# Infinite Angler configuration
#
# true  = vanilla clients may use !fish in, !fish out, and !fish status.
# false = every connected player is required for the shared quest to advance.
#
# Opting out only removes that player from the required completion quorum.
# They may still catch and turn in the current quest fish normally.
EnableParticipationCommands=true

# Debug/testing helper. When enabled, an allowlisted character can talk to the
# Angler while holding a fishing rod to receive one copy of the current quest fish.
# The normal Angler turn-in/reward path is unchanged.
EnableDebugQuestFish=false

# Comma-separated Terraria character names allowed to use the debug helper.
# Spaces inside character names are preserved. Matching is case-insensitive.
# Empty = nobody is allowed.
DebugQuestFishPlayers=
