name: Expanded Worlds global storage audit

on:
  workflow_dispatch:
  push:
    branches:
      - feat/expanded-world-sizes
    paths:
      - .github/workflows/expanded-worlds-global-storage-audit.yml
      - gmods/ExpandedWorlds/**

jobs:
  audit-global-world-storage:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ILSpy command line
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .audit-tools | Out-Null
          dotnet tool install ilspycmd --tool-path .audit-tools

      - name: Audit Terraria 1.4.5.8 global world storage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveVersion = '1458'
          $zip = Join-Path $env:RUNNER_TEMP "terraria-server-$archiveVersion.zip"
          $root = Join-Path $env:RUNNER_TEMP 'terraria-server'
          $url = "https://terraria.org/api/download/pc-dedicated-server/terraria-server-$archiveVersion.zip"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $server = Join-Path $root "$archiveVersion/Windows/TerrariaServer.exe"
          if (-not (Test-Path $server)) {
            throw "TerrariaServer.exe not found at expected path: $server"
          }

          $ilspy = Join-Path $PWD '.audit-tools/ilspycmd.exe'
          $auditDir = Join-Path $PWD 'global-storage-audit-output'
          New-Item -ItemType Directory -Force $auditDir | Out-Null

          $main = Join-Path $auditDir 'Main.cs'
          $chest = Join-Path $auditDir 'Chest.cs'
          $sign = Join-Path $auditDir 'Sign.cs'
          $tileEntity = Join-Path $auditDir 'TileEntity.cs'

          & $ilspy -t Terraria.Main $server | Set-Content -Encoding UTF8 $main
          & $ilspy -t Terraria.Chest $server | Set-Content -Encoding UTF8 $chest
          & $ilspy -t Terraria.Sign $server | Set-Content -Encoding UTF8 $sign
          & $ilspy -t Terraria.DataStructures.TileEntity $server | Set-Content -Encoding UTF8 $tileEntity

          foreach ($required in @($main, $chest, $sign, $tileEntity)) {
            if (-not (Test-Path $required) -or (Get-Item $required).Length -eq 0) {
              throw "ILSpy did not produce required storage audit input: $required"
            }
          }

          $report = Join-Path $auditDir 'terraria-1.4.5.8-global-storage-audit.txt'
          @(
            'Terraria 1.4.5.8 global world storage audit',
            '',
            '=== Main chest storage ==='
          ) | Set-Content -Encoding UTF8 $report

          Select-String -Path $main -Pattern 'Chest\[\]|new Chest\[|chest\s*=' -Context 3,6 |
            ForEach-Object { $_.ToString() } | Add-Content -Encoding UTF8 $report

          Add-Content -Encoding UTF8 $report ''
          Add-Content -Encoding UTF8 $report '=== Chest allocation ==='
          Select-String -Path $chest -Pattern 'CreateChest|Main\.chest|\.Length' -Context 5,12 |
            ForEach-Object { $_.ToString() } | Add-Content -Encoding UTF8 $report

          Add-Content -Encoding UTF8 $report ''
          Add-Content -Encoding UTF8 $report '=== Sign storage ==='
          Select-String -Path $sign -Pattern 'maxSigns|Sign\[\]|new Sign\[|\.Length' -Context 3,8 |
            ForEach-Object { $_.ToString() } | Add-Content -Encoding UTF8 $report

          Add-Content -Encoding UTF8 $report ''
          Add-Content -Encoding UTF8 $report '=== TileEntity storage ==='
          Select-String -Path $tileEntity -Pattern 'ByID|ByPosition|Dictionary|List<' -Context 3,8 |
            ForEach-Object { $_.ToString() } | Add-Content -Encoding UTF8 $report

          $mainSource = Get-Content -Raw $main
          $chestSource = Get-Content -Raw $chest
          $signSource = Get-Content -Raw $sign
          $tileEntitySource = Get-Content -Raw $tileEntity
          $failures = New-Object System.Collections.Generic.List[string]

          function Assert-Contract {
            param([string]$Name, [string]$Source, [string]$Pattern)
            $ok = [regex]::IsMatch($Source, $Pattern, [System.Text.RegularExpressions.RegexOptions]::Multiline)
            Write-Host "$($(if ($ok) {'PASS'} else {'FAIL'})) - $Name"
            Add-Content -Encoding UTF8 $report "$($(if ($ok) {'PASS'} else {'FAIL'})) - $Name"
            if (-not $ok) { $failures.Add($Name) }
          }

          Add-Content -Encoding UTF8 $report ''
          Add-Content -Encoding UTF8 $report '=== Enforced contracts ==='
          Assert-Contract 'Global chest table remains 8000 entries' $mainSource 'new Chest\[8000\]'
          Assert-Contract 'Chest allocation derives its search from Main.chest' $chestSource 'Main\.chest'
          Assert-Contract 'Sign capacity remains 32000' $signSource '32000'
          Assert-Contract 'TileEntity IDs are dictionary-backed' $tileEntitySource 'Dictionary<int,\s*TileEntity>'
          Assert-Contract 'TileEntity positions are dictionary-backed' $tileEntitySource 'Dictionary<Point16,\s*TileEntity>'

          if ($failures.Count -gt 0) {
            throw "Terraria 1.4.5.8 global storage audit failed: $($failures -join '; ')"
          }

      - name: Upload exact audited storage sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-worlds-global-storage-source-audit
          path: global-storage-audit-output/
          if-no-files-found: warn
          retention-days: 7
