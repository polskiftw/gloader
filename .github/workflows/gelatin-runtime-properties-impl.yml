name: Gelatin Runtime Properties Implementation

on:
  push:
    branches:
      - gelatin-runtime-properties-015
  workflow_dispatch:

permissions:
  contents: write

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  PATCH_B64: 

jobs:
  implement-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Apply handoff implementation
        shell: pwsh
        run: |
          python -c "import base64,gzip,os,pathlib; pathlib.Path('.github/runtime-properties-patch.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])))"
          python .github/runtime-properties-patch.py
          Remove-Item .github/runtime-properties-patch.py -Force
          Remove-Item .github/workflows/gelatin-runtime-properties-impl.yml -Force

      - name: Verify patch hygiene
        shell: pwsh
        run: git diff --check

      - name: Restore
        working-directory: tools/gelatin
        run: dotnet restore Gelatin.sln

      - name: Build Release
        working-directory: tools/gelatin
        run: dotnet build Gelatin.sln -c Release --no-restore

      - name: Run tests
        working-directory: tools/gelatin
        run: dotnet test Gelatin.sln -c Release --no-build

      - name: Commit tested implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw "Patch produced no changes." }
          git commit -m "Gelatin 0.1.5: add GEL1 runtime properties"
          git push origin "HEAD:${{ github.ref_name }}"
