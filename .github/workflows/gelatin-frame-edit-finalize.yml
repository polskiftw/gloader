name: Gelatin frame edit finalizer

on:
  push:
    branches:
      - gelatin-frame-edit
    paths:
      - ".github/scripts/finalize-gelatin-frame-edit.py"
      - ".github/workflows/gelatin-frame-edit-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gelatin-frame-edit
          fetch-depth: 0

      - name: Apply final version and cleanup
        run: python .github/scripts/finalize-gelatin-frame-edit.py

      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/gelatin .github/scripts
          git diff --cached --quiet && exit 0
          git commit -m "Gelatin 0.1.4: finalize frame editing"
          git push origin HEAD:gelatin-frame-edit
