name: PatchReviewer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'tools/patchreviewer'
      - 'tools/patchreviewer/**'
      - 'tools/patchreviewer.README.md'
      - '.github/workflows/patchreviewer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout gloader + PatchReviewer
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish PatchReviewer
        shell: pwsh
        run: |
          dotnet publish tools/patchreviewer/PatchReviewer/PatchReviewer.csproj `
            --configuration Release `
            --framework net10.0-windows `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/PatchReviewer-win-x64

      - name: Upload PatchReviewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatchReviewer-win-x64
          path: artifacts/PatchReviewer-win-x64/**
          if-no-files-found: error
