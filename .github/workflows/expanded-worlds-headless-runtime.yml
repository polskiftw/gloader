name: Expanded Worlds headless runtime

on:
  workflow_dispatch:
  push:
    branches:
      - feat/expanded-world-sizes
    paths:
      - .github/workflows/expanded-worlds-headless-runtime.yml
      - src/GLoader/**
      - gmods/ExpandedWorlds/**

jobs:
  vanilla-server-smoke:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download official Terraria 1.4.5.8 dedicated server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveVersion = '1458'
          $zip = Join-Path $env:RUNNER_TEMP "terraria-server-$archiveVersion.zip"
          $root = Join-Path $env:RUNNER_TEMP 'terraria-server-runtime'
          $url = "https://terraria.org/api/download/pc-dedicated-server/terraria-server-$archiveVersion.zip"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $server = Join-Path $root "$archiveVersion/Windows/TerrariaServer.exe"
          if (-not (Test-Path $server)) {
            throw "TerrariaServer.exe not found at expected path: $server"
          }

          "TERRARIA_SERVER=$server" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TERRARIA_SERVER_DIR=$(Split-Path -Parent $server)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "TerrariaServer.exe SHA256: $((Get-FileHash $server -Algorithm SHA256).Hash)"

      - name: Build 64-bit gloader runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build src/GLoader/GLoader.csproj -c Release -p:PlatformTarget=x64 -p:Prefer32Bit=false

          $gloader = Join-Path $PWD 'src/GLoader/bin/Release/net48/gloader.exe'
          if (-not (Test-Path $gloader)) {
            throw "gloader.exe not found: $gloader"
          }

          "GLOADER_EXE=$gloader" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate a vanilla world through gloader and TerrariaServer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $saveRoot = Join-Path $env:RUNNER_TEMP 'terraria-headless-smoke-save'
          $worldDir = Join-Path $saveRoot 'Worlds'
          $world = Join-Path $worldDir 'vanilla-smoke.wld'
          New-Item -ItemType Directory -Force $worldDir | Out-Null

          $logDir = Join-Path $PWD 'headless-runtime-output'
          New-Item -ItemType Directory -Force $logDir | Out-Null
          $stdoutPath = Join-Path $logDir 'vanilla-server-stdout.txt'
          $stderrPath = Join-Path $logDir 'vanilla-server-stderr.txt'

          $arguments = @(
            '--target', ('"' + $env:TERRARIA_SERVER + '"'),
            '--no-mods',
            '--',
            '-savedirectory', ('"' + $saveRoot + '"'),
            '-autocreate', '1',
            '-world', ('"' + $world + '"'),
            '-worldname', 'GLoaderVanillaSmoke',
            '-seed', '123456789',
            '-difficulty', '0',
            '-nosteam',
            '-noupnp'
          ) -join ' '

          $startInfo = New-Object System.Diagnostics.ProcessStartInfo
          $startInfo.FileName = $env:GLOADER_EXE
          $startInfo.Arguments = $arguments
          $startInfo.WorkingDirectory = $env:TERRARIA_SERVER_DIR
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.CreateNoWindow = $true

          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $startInfo
          if (-not $process.Start()) {
            throw 'Failed to start gloader/TerrariaServer process.'
          }

          # The server reads console commands only after world creation/startup.
          # Piped input remains buffered until then, so one early `exit` gives us
          # a deterministic clean shutdown after the generated world is saved.
          $process.StandardInput.WriteLine('exit')
          $process.StandardInput.Close()

          $stdoutTask = $process.StandardOutput.ReadToEndAsync()
          $stderrTask = $process.StandardError.ReadToEndAsync()

          if (-not $process.WaitForExit(900000)) {
            try { $process.Kill() } catch {}
            throw 'TerrariaServer did not exit within 15 minutes.'
          }

          $stdout = $stdoutTask.Result
          $stderr = $stderrTask.Result
          $stdout | Set-Content -Encoding UTF8 $stdoutPath
          $stderr | Set-Content -Encoding UTF8 $stderrPath

          Write-Host $stdout
          if ($stderr) { Write-Host $stderr }

          if ($process.ExitCode -ne 0) {
            throw "gloader/TerrariaServer exited with code $($process.ExitCode)."
          }

          if (-not (Test-Path $world)) {
            throw "TerrariaServer exited without creating $world"
          }

          $worldInfo = Get-Item $world
          if ($worldInfo.Length -lt 1MB) {
            throw "Generated world is unexpectedly small: $($worldInfo.Length) bytes"
          }

          "WORLD_FILE=$world" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Generated vanilla smoke world: $($worldInfo.FullName) ($($worldInfo.Length) bytes)"

      - name: Upload runtime smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-worlds-headless-runtime-smoke
          path: headless-runtime-output/
          if-no-files-found: warn
          retention-days: 7
