name: One-shot vanilla continuity migration

on:
  push:
    branches:
      - fix/vanilla-world-size-continuity
    paths:
      - ".github/workflows/one-shot-vanilla-continuity.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply canonical vanilla-continuity payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $parts = @(Get-ChildItem '.migration/payload.*' -File | Sort-Object Name)
          if ($parts.Count -ne 5) {
            throw "Expected 5 migration payload chunks, found $($parts.Count)."
          }

          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'vanilla-continuity-payload.tar.xz'
          [System.IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($base64))

          $payloadDir = Join-Path $env:RUNNER_TEMP 'vanilla-continuity-payload'
          Remove-Item $payloadDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $payloadDir | Out-Null
          tar -xf $archive -C $payloadDir
          if ($LASTEXITCODE -ne 0) {
            throw "Could not extract the migration payload."
          }

          python (Join-Path $payloadDir 'apply.py')
          if ($LASTEXITCODE -ne 0) {
            throw "Continuity migration script failed with exit code $LASTEXITCODE."
          }

          Remove-Item '.migration' -Recurse -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw 'Migration produced no repository changes.'
          }
          $global:LASTEXITCODE = 0

          git commit -m 'Rebase Expanded Worlds on vanilla size continuity'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not commit continuity migration."
          }

          git push origin HEAD:fix/vanilla-world-size-continuity
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push continuity migration."
          }
