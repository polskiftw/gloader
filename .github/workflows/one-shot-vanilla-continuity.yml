name: One-shot vanilla continuity migration

on:
  push:
    branches:
      - fix/vanilla-world-size-continuity
    paths:
      - ".github/workflows/one-shot-vanilla-continuity.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply canonical vanilla-continuity payload
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t parts < <(find .migration -maxdepth 1 -type f -name 'payload.*' | sort)
          if [[ ${#parts[@]} -ne 5 ]]; then
            echo "Expected 5 migration payload chunks, found ${#parts[@]}." >&2
            exit 1
          fi

          archive="$RUNNER_TEMP/vanilla-continuity-payload.tar.xz"
          cat "${parts[@]}" | base64 --decode > "$archive"

          payload_dir="$RUNNER_TEMP/vanilla-continuity-payload"
          rm -rf "$payload_dir"
          mkdir -p "$payload_dir"
          tar -xJf "$archive" -C "$payload_dir"

          python3 "$payload_dir/apply.py"

          # The Actions token may update ordinary repository contents but may not
          # create workflow files. Push the source migration first; the permanent
          # continuity workflow is added immediately afterward through the GitHub
          # connector using the user's normal repository authorization.
          rm -f .github/workflows/expanded-worlds-continuity.yml
          rm -rf .migration

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Migration produced no repository changes.' >&2
            exit 1
          fi

          git commit -m 'Rebase Expanded Worlds on vanilla size continuity'
          git push origin HEAD:fix/vanilla-world-size-continuity
