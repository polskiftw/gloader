name: Expanded Worlds Terraria source audit

on:
  workflow_dispatch:
  push:
    branches:
      - feat/expanded-world-sizes
    paths:
      - .github/workflows/expanded-worlds-source-audit.yml
      - gmods/ExpandedWorlds/**
      - tests/ExpandedWorldCompile/**
      - tests/ExpandedWorldMathCompile/**

jobs:
  audit-worldgen:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ILSpy command line
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .audit-tools | Out-Null
          dotnet tool install ilspycmd --tool-path .audit-tools

      - name: Audit Terraria 1.4.5.8 worldgen source shape
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.5.8'
          $archiveVersion = '1458'
          $zip = Join-Path $env:RUNNER_TEMP "terraria-server-$archiveVersion.zip"
          $root = Join-Path $env:RUNNER_TEMP 'terraria-server'
          $url = "https://terraria.org/api/download/pc-dedicated-server/terraria-server-$archiveVersion.zip"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $server = Join-Path $root "$archiveVersion/Windows/TerrariaServer.exe"
          if (-not (Test-Path $server)) {
            throw "TerrariaServer.exe not found at expected path: $server"
          }

          $hash = (Get-FileHash $server -Algorithm SHA256).Hash
          $ilspy = Join-Path $PWD '.audit-tools/ilspycmd.exe'
          $auditDir = Join-Path $PWD 'audit-output'
          New-Item -ItemType Directory -Force $auditDir | Out-Null

          $worldGen = Join-Path $auditDir 'WorldGen.cs'
          $genVars = Join-Path $auditDir 'GenVars.cs'
          $dungeonData = Join-Path $auditDir 'DungeonData.cs'
          $hiveBiome = Join-Path $auditDir 'HiveBiome.cs'
          $types = Join-Path $auditDir 'types.txt'

          & $ilspy -l c $server | Set-Content -Encoding UTF8 $types
          & $ilspy -t Terraria.WorldGen $server | Set-Content -Encoding UTF8 $worldGen
          & $ilspy -t Terraria.WorldBuilding.GenVars $server | Set-Content -Encoding UTF8 $genVars
          & $ilspy -t Terraria.GameContent.Generation.Dungeon.DungeonData $server | Set-Content -Encoding UTF8 $dungeonData
          & $ilspy -t Terraria.GameContent.Biomes.HiveBiome $server | Set-Content -Encoding UTF8 $hiveBiome

          foreach ($requiredFile in @($types, $worldGen, $genVars, $dungeonData, $hiveBiome)) {
            if (-not (Test-Path $requiredFile) -or (Get-Item $requiredFile).Length -eq 0) {
              throw "ILSpy did not produce required audit input: $requiredFile"
            }
          }

          $report = Join-Path $auditDir 'terraria-1.4.5.8-worldgen-audit.txt'
          @(
            "Terraria dedicated server: $version",
            "TerrariaServer.exe SHA256: $hash",
            "Audit generated: $([DateTime]::UtcNow.ToString('u'))",
            '',
            '=== Relevant type names ==='
          ) | Set-Content -Encoding UTF8 $report

          Select-String -Path $types -Pattern 'WorldGen.*SecretSeed|DungeonData|DungeonGenVars|WorldBuilding.GenVars|HiveBiome' |
            ForEach-Object { $_.Line } | Add-Content -Encoding UTF8 $report

          function Add-MatchesWithContext {
            param(
              [string]$Title,
              [string]$Path,
              [string[]]$Patterns,
              [int]$Before = 5,
              [int]$After = 8
            )

            Add-Content -Encoding UTF8 $report ''
            Add-Content -Encoding UTF8 $report "=== $Title ==="
            foreach ($pattern in $Patterns) {
              Add-Content -Encoding UTF8 $report ''
              Add-Content -Encoding UTF8 $report "--- pattern: $pattern ---"
              $matches = Select-String -Path $Path -Pattern $pattern -Context $Before,$After
              if (-not $matches) {
                Add-Content -Encoding UTF8 $report '[NO MATCH]'
                continue
              }

              foreach ($match in $matches) {
                Add-Content -Encoding UTF8 $report "[line $($match.LineNumber)]"
                foreach ($line in $match.Context.PreContext) {
                  Add-Content -Encoding UTF8 $report $line
                }
                Add-Content -Encoding UTF8 $report $match.Line
                foreach ($line in $match.Context.PostContext) {
                  Add-Content -Encoding UTF8 $report $line
                }
                Add-Content -Encoding UTF8 $report '...'
              }
            }
          }

          Add-MatchesWithContext -Title 'GenVars fixed-capacity declarations' -Path $genVars -Patterns @(
            'skyLake',
            'floatingIslandHouseX',
            'floatingIslandHouseY',
            'floatingIslandStyle',
            'larvaX',
            'larvaY',
            'JChestX',
            'JChestY',
            'mCaveX',
            'mCaveY',
            'maxTunnels',
            'tunnelX',
            'maxOrePatch',
            'orePatchX',
            'maxMushroomBiomes',
            'mushroomBiomesPosition',
            'maxLakes',
            'LakeX',
            'maxOasis',
            'oasisPosition',
            'dungeonGenVars',
            'CurrentDungeonGenVars'
          ) -Before 3 -After 7

          Add-MatchesWithContext -Title 'DungeonData dynamic collections' -Path $dungeonData -Patterns @(
            'dungeonRooms',
            'dungeonHalls',
            'dungeonFeatures',
            'dungeonDoorData',
            'dungeonPlatformData',
            'protectedDungeonBounds'
          ) -Before 2 -After 3

          Add-MatchesWithContext -Title 'HiveBiome larva producers and seed branches' -Path $hiveBiome -Patterns @(
            'larvaX',
            'numLarva',
            'CreateStandForLarva',
            'drunkWorldGen',
            'remixWorldGen',
            'notTheBees'
          ) -Before 12 -After 24

          Add-MatchesWithContext -Title 'WorldGen reads and writes of fixed-capacity records' -Path $worldGen -Patterns @(
            'skyLakes',
            'skyLake',
            'floatingIslandHouseX',
            'numIslandHouses',
            'larvaX',
            'numLarva',
            'JChestX',
            'numJChests',
            'mCaveX',
            'numMCaves',
            'tunnelX',
            'numTunnels',
            'orePatchX',
            'numOrePatch',
            'mushroomBiomesPosition',
            'numMushroomBiomes',
            'LakeX',
            'numLakes',
            'oasisPosition',
            'numOasis',
            'heartPos',
            'heartCount',
            'CrimStart',
            'CrimVein'
          ) -Before 16 -After 24

          Add-MatchesWithContext -Title 'Secret-seed worldgen switches touching high-risk generation' -Path $worldGen -Patterns @(
            'extraFloatingIslands',
            'extraFloatingIslandsReducedAmount',
            'errorWorldAdjustment',
            'dualDungeons',
            'extraLivingTrees',
            'extraLivingTreesReducedAmount',
            'addTeleporters',
            'notTheBees',
            'NotTheBees',
            'drunkWorldGen',
            'remixWorldGen',
            'getGoodWorldGen',
            '0.00045'
          ) -Before 12 -After 24

          Add-MatchesWithContext -Title 'Hard-coded world-size and width-tier assumptions' -Path $worldGen -Patterns @(
            '0.0008',
            '0.00045',
            '8400',
            '6400',
            '4200',
            'maxTilesX ==',
            'maxTilesX / 4200',
            'maxTilesX > 8400',
            'maxTilesX < 8400'
          ) -Before 5 -After 8

          $failures = New-Object System.Collections.Generic.List[string]

          function Assert-SourcePattern {
            param(
              [string]$Name,
              [string]$Path,
              [string]$Pattern
            )

            $matched = Select-String -Path $Path -Pattern $Pattern -Quiet
            $result = if ($matched) { 'PASS' } else { 'FAIL' }
            Add-Content -Encoding UTF8 $report "$result - $Name"
            Write-Host "$result - $Name"
            if (-not $matched) {
              $failures.Add($Name)
            }
          }

          Add-Content -Encoding UTF8 $report ''
          Add-Content -Encoding UTF8 $report '=== Enforced source-shape contract ==='

          Assert-SourcePattern 'Floating Island sky-lake metadata capacity is 300' $genVars 'skyLake\s*=\s*new bool\[300\]'
          Assert-SourcePattern 'Floating Island X metadata capacity is 300' $genVars 'floatingIslandHouseX\s*=\s*new int\[300\]'
          Assert-SourcePattern 'Floating Island Y metadata capacity is 300' $genVars 'floatingIslandHouseY\s*=\s*new int\[300\]'
          Assert-SourcePattern 'Floating Island style metadata capacity is 300' $genVars 'floatingIslandStyle\s*=\s*new int\[300\]'
          Assert-SourcePattern 'Larva X storage capacity is 100' $genVars 'larvaX\s*=\s*new int\[100\]'
          Assert-SourcePattern 'Larva Y storage capacity is 100' $genVars 'larvaY\s*=\s*new int\[100\]'
          Assert-SourcePattern 'Jungle chest X storage capacity is 100' $genVars 'JChestX\s*=\s*new int\[100\]'
          Assert-SourcePattern 'Jungle chest Y storage capacity is 100' $genVars 'JChestY\s*=\s*new int\[100\]'
          Assert-SourcePattern 'Mountain cave X storage capacity is 30' $genVars 'mCaveX\s*=\s*new int\[30\]'
          Assert-SourcePattern 'Mountain cave Y storage capacity is 30' $genVars 'mCaveY\s*=\s*new int\[30\]'
          Assert-SourcePattern 'Tunnel storage maximum is 50' $genVars 'maxTunnels\s*=\s*50'
          Assert-SourcePattern 'Ore-patch storage maximum is 50' $genVars 'maxOrePatch\s*=\s*50'
          Assert-SourcePattern 'Mushroom-biome storage maximum is 50' $genVars 'maxMushroomBiomes\s*=\s*50'
          Assert-SourcePattern 'Lake storage maximum is 50' $genVars 'maxLakes\s*=\s*50'
          Assert-SourcePattern 'Oasis storage maximum is 20' $genVars 'maxOasis\s*=\s*20'
          Assert-SourcePattern 'Per-dungeon generation state is a dynamic list' $genVars 'List<DungeonGenVars>\s+dungeonGenVars'

          Assert-SourcePattern 'Crimson heart scratch capacity is 100' $worldGen 'heartPos\s*=.*new Point\[100\]'
          Assert-SourcePattern 'Crimson region count derives from physical width' $worldGen 'Main\.maxTilesX\s*\*\s*0\.00045'
          Assert-SourcePattern 'Crimson vein count remains five through eight' $worldGen 'genRand\.Next\(5,\s*9\)'
          Assert-SourcePattern 'Crimson vein appends directly by heartCount' $worldGen 'heartPos\[heartCount\]\s*='

          Assert-SourcePattern 'Dungeon rooms use List<T>' $dungeonData 'List<DungeonRoom>\s+dungeonRooms'
          Assert-SourcePattern 'Dungeon halls use List<T>' $dungeonData 'List<DungeonHall>\s+dungeonHalls'
          Assert-SourcePattern 'Dungeon features use List<T>' $dungeonData 'List<IDungeonFeature>\s+dungeonFeatures'
          Assert-SourcePattern 'Dungeon doors use List<T>' $dungeonData 'List<DungeonDoorData>\s+dungeonDoorData'
          Assert-SourcePattern 'Dungeon platforms use List<T>' $dungeonData 'List<DungeonPlatformData>\s+dungeonPlatformData'
          Assert-SourcePattern 'Dungeon protected bounds use List<T>' $dungeonData 'List<DungeonBounds>\s+protectedDungeonBounds'

          Write-Host '--- BEGIN EXPANDED WORLDS SOURCE AUDIT ---'
          Get-Content $report
          Write-Host '--- END EXPANDED WORLDS SOURCE AUDIT ---'

          if ($failures.Count -gt 0) {
            throw "Terraria $version source-shape audit failed: $($failures -join '; ')"
          }

      - name: Upload audit report and exact decompile inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-worlds-terraria-1.4.5.8-source-audit
          path: audit-output/
          if-no-files-found: warn
          retention-days: 7
