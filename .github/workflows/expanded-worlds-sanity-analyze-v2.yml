name: Expanded Worlds six-size stats

on:
  push:
    branches:
      - feat/expanded-world-sizes
    paths:
      - .github/workflows/expanded-worlds-sanity-analyze-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download preserved six real worlds
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33678526071
          name: expanded-worlds-six-size-worlds
          path: inputs

      - name: Clone pinned TEdit parser
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/TEdit/Terraria-Map-Editor.git "$env:RUNNER_TEMP/tedit"
          git -C "$env:RUNNER_TEMP/tedit" fetch --depth 1 origin cbf7b3876e408cf45240b5d792e0d8e57ba78e3f
          git -C "$env:RUNNER_TEMP/tedit" checkout cbf7b3876e408cf45240b5d792e0d8e57ba78e3f

      - name: Analyze counts and densities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'ew-stats'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $teditProj = (Join-Path $env:RUNNER_TEMP 'tedit/src/TEdit.Terraria/TEdit.Terraria.csproj').Replace('\\','/')

          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$teditProj" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -Encoding UTF8 (Join-Path $dir 'Stats.csproj')

          @'
          using System.Text;
          using System.Text.Json;
          using ReactiveUI.Builder;
          using TEdit.Terraria;

          static class Program
          {
              static readonly Dictionary<string, HashSet<ushort>> Biomes = new()
              {
                  ["desert"] = new ushort[] { 53, 112, 116, 234, 396, 397, 398, 399, 400, 401, 402, 403 }.ToHashSet(),
                  ["snow"] = new ushort[] { 147, 161, 162, 163, 164, 200 }.ToHashSet(),
                  ["jungle"] = new ushort[] { 59, 60, 61, 62, 74, 225 }.ToHashSet(),
                  ["evil"] = new ushort[] { 23, 25, 32, 112, 163, 199, 200, 203, 234, 352, 398, 400 }.ToHashSet(),
                  ["dungeon"] = new ushort[] { 41, 43, 44, 481, 482, 483 }.ToHashSet(),
                  ["temple"] = new ushort[] { 226, 237 }.ToHashSet(),
                  ["underworld"] = new ushort[] { 57, 58, 75, 76 }.ToHashSet()
              };

              static int Main(string[] args)
              {
                  RxAppBuilder.CreateReactiveUIBuilder().BuildApp();
                  if (args.Length != 2) throw new ArgumentException("input-dir output-dir");
                  Directory.CreateDirectory(args[1]);
                  var order = new Dictionary<string,int> { ["Small"]=0,["Medium"]=1,["Large"]=2,["XL"]=3,["Huge"]=4,["THICC"]=5 };
                  var rows = new List<Dictionary<string,object>>();
                  foreach (var file in Directory.GetFiles(args[0], "*.wld", SearchOption.AllDirectories)
                           .OrderBy(f => order.GetValueOrDefault(Path.GetFileNameWithoutExtension(f), 99)))
                      rows.Add(Analyze(file));

                  File.WriteAllText(Path.Combine(args[1], "world-stats.json"), JsonSerializer.Serialize(rows, new JsonSerializerOptions { WriteIndented = true }));
                  WriteCsv(Path.Combine(args[1], "world-stats.csv"), rows);
                  return 0;
              }

              static Dictionary<string,object> Analyze(string file)
              {
                  Console.WriteLine($"Loading {Path.GetFileName(file)}");
                  var (world, error) = World.LoadWorld(file);
                  if (error != null) throw new Exception($"TEdit failed to load {file}", error);
                  if (world == null) throw new InvalidOperationException("TEdit returned null world");

                  string name = Path.GetFileNameWithoutExtension(file);
                  int w = world.TilesWide, h = world.TilesHigh;
                  long total = (long)w * h, active = 0, walls = 0, liquids = 0, empty = 0;
                  var types = new Dictionary<ushort,long>();
                  var biomeCounts = Biomes.Keys.ToDictionary(k => k, _ => 0L);
                  var biomeMinX = Biomes.Keys.ToDictionary(k => k, _ => int.MaxValue);
                  var biomeMaxX = Biomes.Keys.ToDictionary(k => k, _ => -1);

                  for (int x=0; x<w; x++)
                  for (int y=0; y<h; y++)
                  {
                      var t = world.Tiles[x,y];
                      if (t.IsActive)
                      {
                          active++;
                          types.TryGetValue(t.Type, out var n); types[t.Type] = n + 1;
                          foreach (var b in Biomes)
                          {
                              if (!b.Value.Contains(t.Type)) continue;
                              biomeCounts[b.Key]++;
                              biomeMinX[b.Key] = Math.Min(biomeMinX[b.Key], x);
                              biomeMaxX[b.Key] = Math.Max(biomeMaxX[b.Key], x);
                          }
                      }
                      if (t.Wall != 0) walls++;
                      if (t.HasLiquid) liquids++;
                      if (t.IsEmpty) empty++;
                  }

                  long T(ushort id) => types.TryGetValue(id, out var n) ? n : 0;
                  int chests = world.Chests.Count;
                  int surfaceChests = world.Chests.Count(c => c.Y < world.GroundLevel);
                  int undergroundChests = world.Chests.Count(c => c.Y >= world.GroundLevel && c.Y < world.RockLevel);
                  int deepChests = chests - surfaceChests - undergroundChests;

                  long heartTiles = T(12);
                  long altarTiles = T(26);
                  long orbTiles = T(31);
                  long potTiles = T(28) + T(591) + T(653);
                  long statueTiles = T(105);
                  long trackTiles = T(314);

                  double PerM(long n) => n / (total / 1_000_000.0);
                  double PerKWidth(long n) => n / (w / 1000.0);
                  double F(long n) => n / (double)total;
                  double Span(string b) => biomeMaxX[b] < 0 ? 0 : (biomeMaxX[b]-biomeMinX[b]+1)/(double)w;

                  var r = new Dictionary<string,object>
                  {
                      ["name"] = name, ["width"] = w, ["height"] = h, ["tiles"] = total,
                      ["groundLevel"] = world.GroundLevel, ["rockLevel"] = world.RockLevel,
                      ["activePct"] = F(active)*100, ["wallPct"] = F(walls)*100, ["liquidPct"] = F(liquids)*100, ["emptyPct"] = F(empty)*100,
                      ["chests"] = chests, ["chestsPerM"] = PerM(chests), ["chestsPerKWidth"] = PerKWidth(chests),
                      ["surfaceChests"] = surfaceChests, ["undergroundChests"] = undergroundChests, ["deepChests"] = deepChests,
                      ["lifeCrystals"] = heartTiles/4, ["lifeCrystalsPerM"] = PerM(heartTiles/4),
                      ["altars"] = altarTiles/6, ["altarsPerM"] = PerM(altarTiles/6), ["altarsPerKWidth"] = PerKWidth(altarTiles/6),
                      ["shadowOrbsOrCrimsonHearts"] = orbTiles/4, ["orbsPerKWidth"] = PerKWidth(orbTiles/4),
                      ["pots"] = potTiles/4, ["potsPerM"] = PerM(potTiles/4),
                      ["statues"] = statueTiles/6, ["statuesPerM"] = PerM(statueTiles/6),
                      ["minecartTrackTiles"] = trackTiles, ["trackTilesPerM"] = PerM(trackTiles),
                      ["desertTilePct"] = biomeCounts["desert"]/(double)Math.Max(1,active)*100, ["desertSpanPct"] = Span("desert")*100,
                      ["snowTilePct"] = biomeCounts["snow"]/(double)Math.Max(1,active)*100, ["snowSpanPct"] = Span("snow")*100,
                      ["jungleTilePct"] = biomeCounts["jungle"]/(double)Math.Max(1,active)*100, ["jungleSpanPct"] = Span("jungle")*100,
                      ["evilTilePct"] = biomeCounts["evil"]/(double)Math.Max(1,active)*100, ["evilSpanPct"] = Span("evil")*100,
                      ["dungeonTilePct"] = biomeCounts["dungeon"]/(double)Math.Max(1,active)*100,
                      ["templeTilePct"] = biomeCounts["temple"]/(double)Math.Max(1,active)*100,
                      ["underworldTilePct"] = biomeCounts["underworld"]/(double)Math.Max(1,active)*100
                  };
                  Console.WriteLine($"{name}: {w}x{h} chests={chests} crystals={heartTiles/4} altars={altarTiles/6} active={F(active):P2}");
                  return r;
              }

              static void WriteCsv(string path, List<Dictionary<string,object>> rows)
              {
                  if (rows.Count == 0) return;
                  var keys = rows[0].Keys.ToArray();
                  using var sw = new StreamWriter(path, false, Encoding.UTF8);
                  sw.WriteLine(string.Join(',', keys));
                  foreach (var r in rows)
                      sw.WriteLine(string.Join(',', keys.Select(k => Convert.ToString(r[k], System.Globalization.CultureInfo.InvariantCulture))));
              }
          }
          '@ | Set-Content -Encoding UTF8 (Join-Path $dir 'Program.cs')

          dotnet run --project (Join-Path $dir 'Stats.csproj') -c Release -- inputs stats

      - name: Upload six-size stats
        uses: actions/upload-artifact@v4
        with:
          name: expanded-worlds-six-size-stats
          path: stats/
          if-no-files-found: error
          retention-days: 14
