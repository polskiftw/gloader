name: Gelatin

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/gelatin/**"
      - "LICENSE.md"
      - "THIRD-PARTY-NOTICES.txt"
      - ".github/workflows/gelatin.yml"
  pull_request:
    paths:
      - "tools/gelatin/**"
      - "LICENSE.md"
      - "THIRD-PARTY-NOTICES.txt"
      - ".github/workflows/gelatin.yml"

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test-package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: tools/gelatin
        run: dotnet restore Gelatin.sln

      - name: Build Release
        working-directory: tools/gelatin
        run: dotnet build Gelatin.sln -c Release --no-restore

      - name: Run tests
        working-directory: tools/gelatin
        run: dotnet test Gelatin.sln -c Release --no-build

      - name: Publish Windows x64 package
        shell: pwsh
        run: tools/gelatin/scripts/publish.ps1

      - name: Verify clean single-file package
        shell: pwsh
        run: |
          $archive = "tools/gelatin/dist/gelatin-0.1.5-win-x64.zip"
          $publish = "tools/gelatin/dist/gelatin"
          $executable = Join-Path $publish "Gelatin.exe"
          $licenses = Join-Path $publish "licenses"

          if (-not (Test-Path $archive -PathType Leaf)) { throw "Missing $archive" }
          if (-not (Test-Path $executable -PathType Leaf)) { throw "Missing $executable" }
          if (-not (Test-Path $licenses -PathType Container)) { throw "Missing $licenses" }

          $rootFiles = @(Get-ChildItem $publish -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($rootFiles -join ',') -ne "Gelatin.exe") {
            throw "Gelatin package root must contain only Gelatin.exe. Found: $($rootFiles -join ', ')"
          }

          $rootDirectories = @(Get-ChildItem $publish -Directory | Select-Object -ExpandProperty Name | Sort-Object)
          if (($rootDirectories -join ',') -ne "licenses") {
            throw "Gelatin package root must contain only the licenses folder. Found: $($rootDirectories -join ', ')"
          }

          $expectedLegalFiles = @(
            "DOTNET-RUNTIME-THIRD-PARTY-NOTICES.txt",
            "LICENSE.md",
            "SKIASHARP-THIRD-PARTY-NOTICES.txt",
            "THIRD-PARTY-NOTICES.txt"
          ) | Sort-Object
          $actualLegalFiles = @(Get-ChildItem $licenses -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($actualLegalFiles -join ',') -ne ($expectedLegalFiles -join ',')) {
            throw "Unexpected licenses folder contents. Found: $($actualLegalFiles -join ', ')"
          }

          $legalDirectories = @(Get-ChildItem $licenses -Directory)
          if ($legalDirectories.Count -ne 0) {
            throw "licenses must not contain subdirectories."
          }

          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          Write-Host "Gelatin package SHA256: $hash"
          Write-Host "Extracted layout: Gelatin.exe + licenses/ (4 files)"

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $executable = (Resolve-Path "tools/gelatin/dist/gelatin/Gelatin.exe").Path
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "Packaged Gelatin.exe exited during startup smoke test with code $($process.ExitCode)."
            }
            Write-Host "Packaged Gelatin.exe remained running through the startup smoke test."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Upload Gelatin artifact
        uses: actions/upload-artifact@v6
        with:
          name: gelatin-0.1.5-win-x64
          path: tools/gelatin/dist/gelatin-0.1.5-win-x64.zip
          if-no-files-found: error
