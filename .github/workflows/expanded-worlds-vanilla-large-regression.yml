name: Expanded Worlds vanilla Large regression

on:
  workflow_dispatch:
  push:
    branches:
      - feat/expanded-world-sizes
    paths:
      - .github/workflows/expanded-worlds-vanilla-large-regression.yml
      - gmods/ExpandedWorlds/**
      - src/GLoader/**

jobs:
  vanilla-large-after-huge:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install official Microsoft XNA Framework 4.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'xnafx40_redist.msi'
          $url = 'https://download.microsoft.com/download/a/c/2/ac2c903b-e6e8-42c2-9fd7-bebac362a930/xnafx40_redist.msi'
          Invoke-WebRequest -Uri $url -OutFile $msi
          $p = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', ('"' + $msi + '"'), '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010)) {
            throw "XNA Framework installer exited with code $($p.ExitCode)."
          }

      - name: Download official Terraria 1.4.5.8 dedicated server and build x86 gloader
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'terraria-server-1458.zip'
          $root = Join-Path $env:RUNNER_TEMP 'terraria-server-1458'
          Invoke-WebRequest 'https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip' -OutFile $zip
          Expand-Archive $zip $root -Force

          $server = Join-Path $root '1458/Windows/TerrariaServer.exe'
          if (-not (Test-Path $server)) { throw 'Official TerrariaServer.exe missing.' }
          $assemblyName = [System.Reflection.AssemblyName]::GetAssemblyName($server)
          if ($assemblyName.Version.ToString() -ne '1.4.5.8') {
            throw "Unexpected TerrariaServer version: $($assemblyName.Version)"
          }

          dotnet build src/GLoader/GLoader.csproj -c Release -p:PlatformTarget=x86 -p:Prefer32Bit=true
          $gloader = Join-Path $PWD 'src/GLoader/bin/Release/net48/gloader.exe'
          if (-not (Test-Path $gloader)) { throw 'gloader.exe missing after build.' }

          "TERRARIA_SERVER=$server" >> $env:GITHUB_ENV
          "TERRARIA_SERVER_DIR=$(Split-Path -Parent $server)" >> $env:GITHUB_ENV
          "GLOADER_EXE=$gloader" >> $env:GITHUB_ENV

      - name: Stage Expanded Worlds only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mods = Join-Path $env:RUNNER_TEMP 'expanded-worlds-only'
          New-Item -ItemType Directory -Force $mods | Out-Null
          Copy-Item 'gmods/ExpandedWorlds' (Join-Path $mods 'ExpandedWorlds') -Recurse -Force
          "MODS_DIR=$mods" >> $env:GITHUB_ENV

      - name: Prove a vanilla-created Large world still loads after Huge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $outDir = Join-Path $PWD 'vanilla-large-regression'
          New-Item -ItemType Directory -Force $outDir | Out-Null

          function Show-Logs([string]$stdoutPath, [string]$stderrPath) {
            if (Test-Path $stdoutPath) {
              Write-Host '--- stdout ---'
              Get-Content -Raw $stdoutPath | Write-Host
            }
            if (Test-Path $stderrPath) {
              $stderr = Get-Content -Raw $stderrPath
              if (-not [string]::IsNullOrWhiteSpace($stderr)) {
                Write-Host '--- stderr ---'
                Write-Host $stderr
              }
            }
          }

          function Test-LocalPort([int]$port) {
            $client = New-Object System.Net.Sockets.TcpClient
            try {
              $task = $client.ConnectAsync('127.0.0.1', $port)
              if (-not $task.Wait(250)) { return $false }
              return $client.Connected
            }
            catch {
              return $false
            }
            finally {
              $client.Dispose()
            }
          }

          function Wait-Ready(
            [System.Diagnostics.Process]$process,
            [int]$port,
            [string]$stdoutPath,
            [string]$stderrPath,
            [int]$timeoutSeconds) {

            $deadline = (Get-Date).AddSeconds($timeoutSeconds)
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                Show-Logs $stdoutPath $stderrPath
                throw "Process exited with code $($process.ExitCode) before opening TCP port $port."
              }
              if (Test-LocalPort $port) {
                Write-Host "Server is listening on TCP $port."
                return
              }
              Start-Sleep -Seconds 1
            }

            try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
            Show-Logs $stdoutPath $stderrPath
            throw "Server did not open TCP port $port within $timeoutSeconds seconds."
          }

          function Stop-TestProcess([System.Diagnostics.Process]$process) {
            Start-Sleep -Seconds 2
            try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
            try { $process.WaitForExit(10000) | Out-Null } catch {}
          }

          # Phase 1: create the baseline with the unmodified official server,
          # not gloader. This guarantees the compatibility specimen is a genuine
          # vanilla Large .wld that existed before the Huge run.
          Remove-Item Env:GLOADER_EXPANDED_WORLD -ErrorAction SilentlyContinue
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'ew-vanilla-baseline'
          $baselineWorldDir = Join-Path $baselineRoot 'Worlds'
          New-Item -ItemType Directory -Force $baselineWorldDir | Out-Null
          $baselineWorld = Join-Path $baselineWorldDir 'baseline-large.wld'
          $baselineStdout = Join-Path $outDir 'baseline-create-stdout.txt'
          $baselineStderr = Join-Path $outDir 'baseline-create-stderr.txt'
          $baselineArgs = @(
            '-savedirectory', ('"' + $baselineRoot + '"'),
            '-world', ('"' + $baselineWorld + '"'),
            '-autocreate', '3',
            '-worldname', 'VanillaLargeBaseline',
            '-seed', '246813579',
            '-difficulty', '0',
            '-port', '7800',
            '-maxplayers', '1',
            '-noupnp'
          ) -join ' '

          $baselineProcess = Start-Process `
            -FilePath $env:TERRARIA_SERVER `
            -ArgumentList $baselineArgs `
            -WorkingDirectory $env:TERRARIA_SERVER_DIR `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput $baselineStdout `
            -RedirectStandardError $baselineStderr

          Wait-Ready $baselineProcess 7800 $baselineStdout $baselineStderr 1800
          Stop-TestProcess $baselineProcess
          Show-Logs $baselineStdout $baselineStderr

          if (-not (Test-Path $baselineWorld)) {
            throw 'Official vanilla server became ready without creating the baseline Large .wld.'
          }
          $baselineInfo = Get-Item $baselineWorld
          if ($baselineInfo.Length -lt 1MB) {
            throw "Vanilla Large baseline is unexpectedly small: $($baselineInfo.Length) bytes"
          }
          $baselineHash = (Get-FileHash $baselineWorld -Algorithm SHA256).Hash
          Write-Host "PASS baseline: official Terraria created a Large world; bytes=$($baselineInfo.Length); SHA256=$baselineHash"

          # Phase 2: perform real Huge generation with Expanded Worlds in between.
          $env:GLOADER_EXPANDED_WORLD = 'Huge'
          $hugeRoot = Join-Path $env:RUNNER_TEMP 'ew-huge-between'
          $hugeWorldDir = Join-Path $hugeRoot 'Worlds'
          New-Item -ItemType Directory -Force $hugeWorldDir | Out-Null
          $hugeWorld = Join-Path $hugeWorldDir 'between-huge.wld'
          $hugeStdout = Join-Path $outDir 'huge-stdout.txt'
          $hugeStderr = Join-Path $outDir 'huge-stderr.txt'
          $hugeGameArgs = @(
            '-savedirectory', ('"' + $hugeRoot + '"'),
            '-world', ('"' + $hugeWorld + '"'),
            '-autocreate', '3',
            '-worldname', 'ExpandedWorldHugeRegression',
            '-seed', '123456789',
            '-difficulty', '0',
            '-port', '7801',
            '-maxplayers', '1',
            '-noupnp'
          )
          $hugeLoaderArgs = @(
            '--target', ('"' + $env:TERRARIA_SERVER + '"'),
            '--mods', ('"' + $env:MODS_DIR + '"'),
            '--'
          )
          $hugeArgs = ($hugeLoaderArgs + $hugeGameArgs) -join ' '

          $hugeProcess = Start-Process `
            -FilePath $env:GLOADER_EXE `
            -ArgumentList $hugeArgs `
            -WorkingDirectory $env:TERRARIA_SERVER_DIR `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput $hugeStdout `
            -RedirectStandardError $hugeStderr

          Wait-Ready $hugeProcess 7801 $hugeStdout $hugeStderr 1800
          Stop-TestProcess $hugeProcess
          Show-Logs $hugeStdout $hugeStderr

          if (-not (Test-Path $hugeWorld)) { throw 'Huge generation did not produce a .wld.' }
          $hugeLog = Get-Content -Raw $hugeStdout
          $hugeMarkers = @(
            'Dedicated-server headless preset: Huge 16800x2400',
            'GenerateWorld: using Huge 16800x2400 (vanilla tier 2)',
            'clearWorld: using Huge 16800x2400 (vanilla tier 2)',
            'Dedicated-server generation completed at 16800x2400',
            'LoadWorld verified Huge 16800x2400 (vanilla tier 2)'
          )
          foreach ($marker in $hugeMarkers) {
            if (-not $hugeLog.Contains($marker)) { throw "Huge interstitial run is missing marker: $marker" }
          }
          if ($hugeLog.Contains('Mod failed:')) { throw 'Expanded Worlds failed during Huge interstitial generation.' }
          Write-Host 'PASS Huge interstitial generation.'

          # Phase 3: remove the custom preset and load the untouched official
          # vanilla Large specimen through gloader + Expanded Worlds.
          Remove-Item Env:GLOADER_EXPANDED_WORLD -ErrorAction SilentlyContinue
          $reloadStdout = Join-Path $outDir 'baseline-reload-stdout.txt'
          $reloadStderr = Join-Path $outDir 'baseline-reload-stderr.txt'
          $reloadGameArgs = @(
            '-savedirectory', ('"' + $baselineRoot + '"'),
            '-world', ('"' + $baselineWorld + '"'),
            '-port', '7802',
            '-maxplayers', '1',
            '-noupnp'
          )
          $reloadLoaderArgs = @(
            '--target', ('"' + $env:TERRARIA_SERVER + '"'),
            '--mods', ('"' + $env:MODS_DIR + '"'),
            '--'
          )
          $reloadArgs = ($reloadLoaderArgs + $reloadGameArgs) -join ' '

          $reloadProcess = Start-Process `
            -FilePath $env:GLOADER_EXE `
            -ArgumentList $reloadArgs `
            -WorkingDirectory $env:TERRARIA_SERVER_DIR `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput $reloadStdout `
            -RedirectStandardError $reloadStderr

          Wait-Ready $reloadProcess 7802 $reloadStdout $reloadStderr 600
          Stop-TestProcess $reloadProcess
          Show-Logs $reloadStdout $reloadStderr

          $reloadLog = Get-Content -Raw $reloadStdout
          if (-not $reloadLog.Contains('Dedicated-server headless preset not requested; vanilla server sizing is untouched.')) {
            throw 'Expanded Worlds did not report its vanilla no-preset path while loading the baseline Large world.'
          }
          if ($reloadLog.Contains('GenerateWorld: using ') -or
              $reloadLog.Contains('clearWorld: using ') -or
              $reloadLog.Contains('tile backing storage enlarged to ')) {
            throw 'Expanded Worlds applied custom physical sizing while loading the vanilla Large baseline.'
          }
          if ($reloadLog.Contains('Mod failed:')) {
            throw 'gloader reported a source-mod failure while loading the vanilla Large baseline.'
          }

          $afterHash = (Get-FileHash $baselineWorld -Algorithm SHA256).Hash
          if ($afterHash -ne $baselineHash) {
            throw "Vanilla Large .wld changed after Huge regression load: $baselineHash -> $afterHash"
          }

          Write-Host "PASS: official vanilla Large world still loads unchanged after Huge; SHA256=$afterHash"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Expanded Worlds vanilla Large regression'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Baseline: **official Terraria 1.4.5.8 Large autocreate**'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Interstitial Expanded Worlds Huge: **PASS**'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Baseline reload through gloader + Expanded Worlds: **PASS**'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Baseline `.wld` hash unchanged: **PASS**'

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-worlds-vanilla-large-regression
          path: vanilla-large-regression/
          if-no-files-found: warn
          retention-days: 7
