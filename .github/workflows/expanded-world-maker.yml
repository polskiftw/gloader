name: Expanded World Maker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/world-maker-wld-validation
    paths:
      - "tools/expanded-world-maker/**"
      - ".github/workflows/expanded-world-maker.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build native GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore tools/expanded-world-maker/ExpandedWorldMaker.csproj
          dotnet build tools/expanded-world-maker/ExpandedWorldMaker.csproj -c Release --no-restore

          $exe = "tools/expanded-world-maker/bin/Release/net48/ExpandedWorldMaker.exe"
          if (-not (Test-Path $exe)) {
            throw "ExpandedWorldMaker.exe was not produced."
          }
          if ((Get-Item $exe).Length -lt 32KB) {
            throw "ExpandedWorldMaker.exe is unexpectedly small."
          }

      - name: Build add-on package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content "tools/expanded-world-maker/ExpandedWorldMaker.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read Expanded World Maker Version."
          }

          $stage = Join-Path $env:RUNNER_TEMP "expanded-world-maker-addon"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $stage "tools") | Out-Null
          Copy-Item "tools/expanded-world-maker/bin/Release/net48/ExpandedWorldMaker.exe" (Join-Path $stage "tools/ExpandedWorldMaker.exe") -Force
          Copy-Item "tools/expanded-world-maker/README.md" (Join-Path $stage "tools/ExpandedWorldMaker.README.md") -Force
          Copy-Item "tools/expanded-world-maker/DGD.md" (Join-Path $stage "tools/ExpandedWorldMaker.DGD.md") -Force

          $addon = "ExpandedWorldMaker-$version.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $addon -Force
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "ADDON_ASSET=$addon" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpandedWorldMaker
          path: ExpandedWorldMaker-*.zip

      - name: Inject World Maker into current gloader release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'Refresh release ') || startsWith(github.event.head_commit.message, 'Release '))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          $gloaderAsset = "gloader-$env:RELEASE_VERSION.zip"
          $download = Join-Path $env:RUNNER_TEMP "release-download"
          $package = Join-Path $env:RUNNER_TEMP "release-package"
          Remove-Item $download,$package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $download,$package | Out-Null

          gh release download $tag --repo "${{ github.repository }}" --pattern $gloaderAsset --dir $download
          $downloaded = Join-Path $download $gloaderAsset
          if (-not (Test-Path $downloaded)) {
            throw "Could not download existing $gloaderAsset from $tag."
          }

          Expand-Archive $downloaded $package -Force
          if (-not (Test-Path (Join-Path $package "gloader.exe"))) {
            throw "Existing gloader release archive has an unexpected layout."
          }
          if (-not (Test-Path (Join-Path $package "gmods/ExpandedWorlds/ServerRuntime.cs"))) {
            throw "Existing release does not contain the headless Expanded Worlds runtime."
          }

          $tools = Join-Path $package "tools"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item "tools/expanded-world-maker/bin/Release/net48/ExpandedWorldMaker.exe" (Join-Path $tools "ExpandedWorldMaker.exe") -Force
          Copy-Item "tools/expanded-world-maker/README.md" (Join-Path $tools "ExpandedWorldMaker.README.md") -Force
          Copy-Item "tools/expanded-world-maker/DGD.md" (Join-Path $tools "ExpandedWorldMaker.DGD.md") -Force

          Remove-Item $downloaded -Force
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $downloaded -Force

          gh release upload $tag $downloaded --clobber --repo "${{ github.repository }}"
          gh release upload $tag $env:ADDON_ASSET --clobber --repo "${{ github.repository }}"
          gh release edit $tag `
            --repo "${{ github.repository }}" `
            --notes "## Downloads`n`n- **gloader-$env:RELEASE_VERSION.zip** — full gloader package. Extract into the Terraria install folder. It includes **tools\\ExpandedWorldMaker.exe** with XL/Huge/THICC headless generation, Special Seeds, and all 37 Terraria 1.4.5 Secret Seed checkboxes.`n- **ExpandedWorldMaker-$env:RELEASE_VERSION.zip** — small add-on overlay for an existing gloader install.`n`nExpanded World Maker uses TerrariaServer 1.4.5.8 through gloader. After the server reaches ready state, the tool validates the binary `.wld` header itself and confirms the exact requested dimensions before copying the world into your Worlds folder; it no longer depends on a particular console verification sentence."
