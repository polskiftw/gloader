name: Terraria Decompiler Offline Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/terraria-decompiler/offline/**'
      - '.github/workflows/terraria-decompiler-offline.yml'

permissions:
  contents: write

jobs:
  build-offline-bundle:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build self-contained offline bundle
        shell: pwsh
        run: |
          ./tools/terraria-decompiler/offline/Build-OfflineBundle.ps1 `
            -OutputDirectory "$env:GITHUB_WORKSPACE\artifacts"

      - name: Upload offline bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerrariaDecompilerOffline-win-x64
          path: artifacts/TerrariaDecompilerOffline-win-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish rolling offline release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'terraria-decompiler-offline'
          $repo = $env:GITHUB_REPOSITORY

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $repo --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw "Could not replace existing rolling release '$tag'."
            }
          }
          $global:LASTEXITCODE = 0

          $notes = @"
          GUI-based offline Windows x64 Terraria decompiler.

          Extract the ZIP and double-click TerrariaDecompiler.exe.
          The GUI auto-detects Terraria when possible, lets you browse to Terraria.exe and choose the output folder, shows progress and audit status, and provides Open Output / View Audit buttons.

          Runtime dependency downloads: none.
          Bundled: TerrariaDecompiler.exe WinForms GUI, ILSpyCmd, private .NET runtime, .NET Framework 4.0 reference assemblies, and redistributable XNA Framework runtime references.

          Game-specific managed references are harvested at runtime from the user's own Terraria install directory. Current Terraria ships the genuine Microsoft.Xna.Framework.Content.Pipeline.dll there, so this bundle contains no Content Pipeline shim and does not redistribute that developer DLL.

          Built from gloader commit $env:GITHUB_SHA.
          "@

          gh release create $tag `
            artifacts/TerrariaDecompilerOffline-win-x64.zip `
            --repo $repo `
            --target $env:GITHUB_SHA `
            --title 'Terraria Decompiler Offline' `
            --notes $notes
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish rolling release '$tag'."
          }
