name: Terraria Decompiler Offline Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/terraria-decompiler/offline/**'
      - '.github/workflows/terraria-decompiler-offline.yml'

concurrency:
  group: terraria-decompiler-offline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-offline-bundle:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build self-contained offline bundle
        shell: pwsh
        run: |
          ./tools/terraria-decompiler/offline/Build-OfflineBundle.ps1 `
            -OutputDirectory "$env:GITHUB_WORKSPACE\artifacts"

      - name: Smoke-test paired client/server orchestration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bundleExtract = Join-Path $env:RUNNER_TEMP 'terraria-decompiler-pair-bundle'
          $pairInput = Join-Path $env:RUNNER_TEMP 'terraria-decompiler-pair-input'
          $pairOutput = Join-Path $env:RUNNER_TEMP 'terraria-decompiler-pair-output'
          Remove-Item $bundleExtract, $pairInput, $pairOutput -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pairInput | Out-Null
          Expand-Archive -Path 'artifacts/TerrariaDecompilerOffline-win-x64.zip' -DestinationPath $bundleExtract -Force

          $fixtureSource = Join-Path $pairInput 'PairFixture.cs'
          @'
          using System.Reflection;
          [assembly: AssemblyVersion("1.4.5.8")]
          [assembly: AssemblyFileVersion("1.4.5.8")]
          public static class Program
          {
              public static void Main() { }
          }
          '@ | Set-Content -LiteralPath $fixtureSource -Encoding ASCII

          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc -PathType Leaf)) {
            $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          }
          if (-not (Test-Path -LiteralPath $csc -PathType Leaf)) {
            throw 'Could not find the Windows .NET Framework C# compiler for the pair fixture.'
          }

          $clientFixture = Join-Path $pairInput 'Terraria.exe'
          $serverFixture = Join-Path $pairInput 'TerrariaServer.exe'
          & $csc /nologo /target:exe "/out:$clientFixture" $fixtureSource
          if ($LASTEXITCODE -ne 0) {
            throw "Could not compile pair-orchestration fixture (csc exit $LASTEXITCODE)."
          }
          Copy-Item -LiteralPath $clientFixture -Destination $serverFixture -Force
          Remove-Item -LiteralPath $fixtureSource -Force

          $engine = Join-Path $bundleExtract 'Run-TerrariaDecompiler.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $engine `
            -TerrariaInput $clientFixture `
            -OutputDirectory $pairOutput `
            -TargetMode Pair
          if ($LASTEXITCODE -ne 0) {
            throw "Paired decompiler orchestration smoke test failed with exit code $LASTEXITCODE."
          }

          $auditPath = Join-Path $pairOutput 'audit\audit.json'
          if (-not (Test-Path -LiteralPath $auditPath -PathType Leaf)) {
            throw 'Pair smoke test did not produce audit\audit.json.'
          }
          $audit = Get-Content -LiteralPath $auditPath -Raw | ConvertFrom-Json
          if ([int]$audit.total_tracked_issues -ne 0) {
            throw "Pair smoke test audit found $($audit.total_tracked_issues) tracked issue(s)."
          }
          if ([string]$audit.target_mode -ne 'Pair') {
            throw "Pair smoke test reported unexpected target_mode '$($audit.target_mode)'."
          }

          $targetNames = @($audit.targets.PSObject.Properties.Name)
          if ($targetNames -notcontains 'client' -or $targetNames -notcontains 'server') {
            throw "Pair smoke test combined audit does not contain both client and server targets: $($targetNames -join ', ')"
          }

          $clientZip = @(Get-ChildItem -Path (Join-Path $pairOutput 'client') -File -Filter 'TerrariaClientDecomp-*-clean.zip')
          $serverZip = @(Get-ChildItem -Path (Join-Path $pairOutput 'server') -File -Filter 'TerrariaServerDecomp-*-clean.zip')
          if ($clientZip.Count -ne 1 -or $serverZip.Count -ne 1) {
            throw "Pair smoke test did not produce exactly one client ZIP and one server ZIP. Client=$($clientZip.Count), Server=$($serverZip.Count)"
          }

          if (-not (Test-Path -LiteralPath (Join-Path $pairOutput 'client\source') -PathType Container) -or
              -not (Test-Path -LiteralPath (Join-Path $pairOutput 'server\source') -PathType Container)) {
            throw 'Pair smoke test did not produce both client\source and server\source trees.'
          }

          Write-Host 'Pair orchestration smoke test clean: client + server outputs + combined audit, 0 tracked issues.'

      - name: Smoke-test latest public TerrariaServer.exe decompile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $namesResponse = Invoke-RestMethod -Uri 'https://terraria.org/api/get/dedicated-servers-names'
          $serverNames = @($namesResponse)
          if ($serverNames.Count -eq 0 -or [string]::IsNullOrWhiteSpace([string]$serverNames[0])) {
            throw 'Terraria.org did not return a PC dedicated-server archive name.'
          }

          $archiveName = [string]$serverNames[0]
          if (-not $archiveName.EndsWith('.zip', [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Unexpected dedicated-server archive name from Terraria.org: $archiveName"
          }

          $serverZip = Join-Path $env:RUNNER_TEMP $archiveName
          $serverUrl = "https://terraria.org/api/download/pc-dedicated-server/$archiveName"
          Write-Host "Downloading public Terraria dedicated server: $serverUrl"
          Invoke-WebRequest -Uri $serverUrl -OutFile $serverZip

          $serverExtract = Join-Path $env:RUNNER_TEMP 'terraria-public-server'
          $bundleExtract = Join-Path $env:RUNNER_TEMP 'terraria-decompiler-bundle'
          $smokeOutput = Join-Path $env:RUNNER_TEMP 'terraria-server-decompile-smoke'
          Remove-Item $serverExtract, $bundleExtract, $smokeOutput -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $serverZip -DestinationPath $serverExtract -Force
          Expand-Archive -Path 'artifacts/TerrariaDecompilerOffline-win-x64.zip' -DestinationPath $bundleExtract -Force

          $serverExe = Get-ChildItem -Path $serverExtract -Recurse -File -Filter 'TerrariaServer.exe' |
            Where-Object { $_.FullName -match '[\\/]Windows[\\/]' } |
            Select-Object -First 1
          if (-not $serverExe) {
            $serverExe = Get-ChildItem -Path $serverExtract -Recurse -File -Filter 'TerrariaServer.exe' | Select-Object -First 1
          }
          if (-not $serverExe) {
            throw "Public dedicated-server archive '$archiveName' did not contain TerrariaServer.exe."
          }

          $engine = Join-Path $bundleExtract 'Run-TerrariaDecompiler.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $engine `
            -TerrariaInput $serverExe.Directory.FullName `
            -OutputDirectory $smokeOutput `
            -TargetMode Server
          if ($LASTEXITCODE -ne 0) {
            throw "Public TerrariaServer.exe decompile smoke test failed with exit code $LASTEXITCODE."
          }

          $auditPath = Join-Path $smokeOutput 'audit\audit.json'
          if (-not (Test-Path -LiteralPath $auditPath -PathType Leaf)) {
            throw 'Server smoke test did not produce audit\audit.json.'
          }
          $audit = Get-Content -LiteralPath $auditPath -Raw | ConvertFrom-Json
          if ([int]$audit.total_tracked_issues -ne 0) {
            throw "Server smoke test audit found $($audit.total_tracked_issues) tracked issue(s)."
          }

          $serverSource = Join-Path $smokeOutput 'server\source'
          $serverCsCount = @(Get-ChildItem -Path $serverSource -Recurse -File -Filter '*.cs').Count
          if ($serverCsCount -eq 0) {
            throw 'Server smoke test produced no C# source files.'
          }
          Write-Host "Public TerrariaServer.exe smoke test clean: $serverCsCount C# files, 0 tracked issues."

      - name: Upload offline bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerrariaDecompilerOffline-win-x64
          path: artifacts/TerrariaDecompilerOffline-win-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Attach bundle to matching gloader release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content "src/GLoader/GLoader.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read Version from src/GLoader/GLoader.csproj"
          }

          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            $global:LASTEXITCODE = 0
            Write-Host "No matching gloader release '$tag' exists yet. Keeping the bundle as an Actions artifact only."
            exit 0
          }

          gh release upload $tag `
            artifacts/TerrariaDecompilerOffline-win-x64.zip `
            --repo $repo `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not attach Terraria decompiler bundle to gloader release '$tag'."
          }

          Write-Host "Updated optional Terraria decompiler asset on gloader release '$tag'."
