name: Fourteen Seed 777 - All Special and Secret Seeds

on:
  push:
    branches:
      - run/fourteen-seed-777-all-special-secret
    paths:
      - .github/workflows/fourteen-seed-777-all-special-secret.yml

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      batch_a: ${{ steps.plan.outputs.batch_a }}
      batch_b: ${{ steps.plan.outputs.batch_b }}
      batch_c: ${{ steps.plan.outputs.batch_c }}
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - name: Build size-first 46-suite matrices
        id: plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $suites = @(
            [ordered]@{ label = "Not the Bees"; slug = "not-the-bees"; special_config = "notthebees"; secret_text = "" },
            [ordered]@{ label = "Drunk"; slug = "drunk"; special_config = "drunk"; secret_text = "" },
            [ordered]@{ label = "Celebration Mk10"; slug = "celebration-mk10"; special_config = "celebration"; secret_text = "" },
            [ordered]@{ label = "The Constant"; slug = "the-constant"; special_config = "theconstant"; secret_text = "" },
            [ordered]@{ label = "For the Worthy"; slug = "for-the-worthy"; special_config = "fortheworthy"; secret_text = "" },
            [ordered]@{ label = "No Traps"; slug = "no-traps"; special_config = "notraps"; secret_text = "" },
            [ordered]@{ label = "Remix / Don't Dig Up"; slug = "remix"; special_config = "remix"; secret_text = "" },
            [ordered]@{ label = "Zenith / Get Fixed Boi"; slug = "zenith"; special_config = "zenith"; secret_text = "" },
            [ordered]@{ label = "Skyblock"; slug = "skyblock"; special_config = "skyblock"; secret_text = "" },

            [ordered]@{ label = "Abandoned Manors"; slug = "abandoned-manors"; special_config = ""; secret_text = "Abandoned manors" },
            [ordered]@{ label = "Arachnophobia"; slug = "arachnophobia"; special_config = ""; secret_text = "Arachnophobia" },
            [ordered]@{ label = "Beam Me Up"; slug = "beam-me-up"; special_config = ""; secret_text = "Beam me up" },
            [ordered]@{ label = "Bring a Towel"; slug = "bring-a-towel"; special_config = ""; secret_text = "Bring a towel" },
            [ordered]@{ label = "Calm Before the Storm"; slug = "calm-before-the-storm"; special_config = ""; secret_text = "Calm before the storm" },
            [ordered]@{ label = "Double Daring Dangers"; slug = "double-daring-dangers"; special_config = ""; secret_text = "Double daring dangers" },
            [ordered]@{ label = "Electric Boogaloo"; slug = "electric-boogaloo"; special_config = ""; secret_text = "Electric Boogaloo" },
            [ordered]@{ label = "Fish Mox"; slug = "fish-mox"; special_config = ""; secret_text = "Fish Mox" },
            [ordered]@{ label = "Hocus Pocus"; slug = "hocus-pocus"; special_config = ""; secret_text = "Hocus pocus" },
            [ordered]@{ label = "How Did I Get Here"; slug = "how-did-i-get-here"; special_config = ""; secret_text = "How did I get here" },
            [ordered]@{ label = "I Am Error"; slug = "i-am-error"; special_config = ""; secret_text = "I am error" },
            [ordered]@{ label = "Invisible Plane"; slug = "invisible-plane"; special_config = ""; secret_text = "Invisible plane" },
            [ordered]@{ label = "Jagged Rocks"; slug = "jagged-rocks"; special_config = ""; secret_text = "Jagged rocks" },
            [ordered]@{ label = "Jingle All the Way"; slug = "jingle-all-the-way"; special_config = ""; secret_text = "Jingle all the way" },
            [ordered]@{ label = "Mole People"; slug = "mole-people"; special_config = ""; secret_text = "Mole people" },
            [ordered]@{ label = "Monochrome"; slug = "monochrome"; special_config = ""; secret_text = "Monochrome" },
            [ordered]@{ label = "More Traps Please"; slug = "more-traps-please"; special_config = ""; secret_text = "More traps please" },
            [ordered]@{ label = "Negative Infinity"; slug = "negative-infinity"; special_config = ""; secret_text = "Negative infinity" },
            [ordered]@{ label = "Night of the Living Dead"; slug = "night-of-the-living-dead"; special_config = ""; secret_text = "Night of the Living Dead" },
            [ordered]@{ label = "Planetoids"; slug = "planetoids"; special_config = ""; secret_text = "Planetoids" },
            [ordered]@{ label = "Pumpkin Season"; slug = "pumpkin-season"; special_config = ""; secret_text = "Pumpkin season" },
            [ordered]@{ label = "Purify This"; slug = "purify-this"; special_config = ""; secret_text = "Purify this" },
            [ordered]@{ label = "Rainbow Road"; slug = "rainbow-road"; special_config = ""; secret_text = "Rainbow Road" },
            [ordered]@{ label = "Royale With Cheese"; slug = "royale-with-cheese"; special_config = ""; secret_text = "Royale with cheese" },
            [ordered]@{ label = "Does That Sparkle"; slug = "does-that-sparkle"; special_config = ""; secret_text = "Does that sparkle" },
            [ordered]@{ label = "Too Easy"; slug = "too-easy"; special_config = ""; secret_text = "Too easy" },
            [ordered]@{ label = "Waterpark"; slug = "waterpark"; special_config = ""; secret_text = "Waterpark" },
            [ordered]@{ label = "What a Horrible Night to Have a Curse"; slug = "what-a-horrible-night"; special_config = ""; secret_text = "What a horrible night to have a curse" },
            [ordered]@{ label = "Winter Is Coming"; slug = "winter-is-coming"; special_config = ""; secret_text = "Winter is coming" },
            [ordered]@{ label = "X-Ray Vision"; slug = "x-ray-vision"; special_config = ""; secret_text = "X-ray vision" },
            [ordered]@{ label = "Truck Stop"; slug = "truck-stop"; special_config = ""; secret_text = "Truck stop" },
            [ordered]@{ label = "Sandy Britches"; slug = "sandy-britches"; special_config = ""; secret_text = "Sandy britches" },
            [ordered]@{ label = "Save the Rainforest"; slug = "save-the-rainforest"; special_config = ""; secret_text = "Save the rainforest" },
            [ordered]@{ label = "Such Great Heights"; slug = "such-great-heights"; special_config = ""; secret_text = "Such great heights" },
            [ordered]@{ label = "The Care Bears Movie"; slug = "care-bears-movie"; special_config = ""; secret_text = "The Care Bears Movie" },
            [ordered]@{ label = "Toadstool"; slug = "toadstool"; special_config = ""; secret_text = "Toadstool" },
            [ordered]@{ label = "We Don't Even Test for That"; slug = "we-dont-even-test-for-that"; special_config = ""; secret_text = "We don't even test for that" }
          )

          $worlds = @(
            [ordered]@{ preset = "Small"; world_slug = "small"; selector = ""; copied_size = 1; autocreate = 1; width = 4200; height = 1200 },
            [ordered]@{ preset = "Medium"; world_slug = "medium"; selector = ""; copied_size = 2; autocreate = 2; width = 6400; height = 1800 },
            [ordered]@{ preset = "Large"; world_slug = "large"; selector = ""; copied_size = 3; autocreate = 3; width = 8400; height = 2400 },
            [ordered]@{ preset = "THICC"; world_slug = "thicc"; selector = "THICC"; copied_size = 3; autocreate = 3; width = 10600; height = 3000 },
            [ordered]@{ preset = "THICC 2"; world_slug = "thicc2"; selector = "THICC2"; copied_size = 3; autocreate = 3; width = 12600; height = 3600 },
            [ordered]@{ preset = "THICC 3"; world_slug = "thicc3"; selector = "THICC3"; copied_size = 3; autocreate = 3; width = 14800; height = 4200 },
            [ordered]@{ preset = "THICC 4"; world_slug = "thicc4"; selector = "THICC4"; copied_size = 3; autocreate = 3; width = 16800; height = 4800 },
            [ordered]@{ preset = "THICC 5"; world_slug = "thicc5"; selector = "THICC5"; copied_size = 3; autocreate = 3; width = 19000; height = 5400 },
            [ordered]@{ preset = "THICC 6"; world_slug = "thicc6"; selector = "THICC6"; copied_size = 3; autocreate = 3; width = 21000; height = 6000 },
            [ordered]@{ preset = "THICC 7"; world_slug = "thicc7"; selector = "THICC7"; copied_size = 3; autocreate = 3; width = 23200; height = 6600 },
            [ordered]@{ preset = "THICC 8"; world_slug = "thicc8"; selector = "THICC8"; copied_size = 3; autocreate = 3; width = 25200; height = 7200 },
            [ordered]@{ preset = "THICC 9"; world_slug = "thicc9"; selector = "THICC9"; copied_size = 3; autocreate = 3; width = 27400; height = 7800 },
            [ordered]@{ preset = "THICC 10"; world_slug = "thicc10"; selector = "THICC10"; copied_size = 3; autocreate = 3; width = 29400; height = 8400 },
            [ordered]@{ preset = "THICC 11"; world_slug = "thicc11"; selector = "THICC11"; copied_size = 3; autocreate = 3; width = 31600; height = 9000 }
          )

          if ($suites.Count -ne 46) { throw "Expected 46 suites; found $($suites.Count)." }
          if ($worlds.Count -ne 14) { throw "Expected 14 world sizes; found $($worlds.Count)." }
          if ((@($suites | Where-Object { -not [string]::IsNullOrWhiteSpace($_.special_config) })).Count -ne 9) { throw 'Expected exactly 9 Special Seeds.' }
          if ((@($suites | Where-Object { -not [string]::IsNullOrWhiteSpace($_.secret_text) })).Count -ne 37) { throw 'Expected exactly 37 Secret Seeds.' }
          if ((@($suites.slug | Sort-Object -Unique)).Count -ne 46) { throw 'Suite slugs must be unique.' }

          function New-SizeFirstMatrix([object[]]$selectedWorlds) {
            $include = @()
            foreach ($world in $selectedWorlds) {
              foreach ($suite in $suites) {
                $include += [ordered]@{
                  suite_label = $suite.label
                  suite_slug = $suite.slug
                  special_config = $suite.special_config
                  secret_text = $suite.secret_text
                  preset = $world.preset
                  world_slug = $world.world_slug
                  selector = $world.selector
                  copied_size = $world.copied_size
                  autocreate = $world.autocreate
                  width = $world.width
                  height = $world.height
                }
              }
            }
            return ([ordered]@{ include = $include } | ConvertTo-Json -Compress -Depth 6)
          }

          $suiteInclude = @()
          foreach ($suite in $suites) {
            $suiteInclude += [ordered]@{ suite_label = $suite.label; suite_slug = $suite.slug }
          }

          $batchA = New-SizeFirstMatrix @($worlds[0..4])
          $batchB = New-SizeFirstMatrix @($worlds[5..9])
          $batchC = New-SizeFirstMatrix @($worlds[10..13])
          $suiteMatrix = [ordered]@{ include = $suiteInclude } | ConvertTo-Json -Compress -Depth 4

          "batch_a=$batchA" >> $env:GITHUB_OUTPUT
          "batch_b=$batchB" >> $env:GITHUB_OUTPUT
          "batch_c=$batchC" >> $env:GITHUB_OUTPUT
          "suites=$suiteMatrix" >> $env:GITHUB_OUTPUT

          Write-Host "Planned 46 comparison families and 644 fresh worlds, ordered by size."

  prepare-x64-runtime:
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      runtime_artifact_id: ${{ steps.upload_runtime.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RETAIL_RELEASE_NAME: gloader-private-input
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Locate private retail input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          $release = @($releases | Where-Object { $_.draft -and ($_.name -eq $env:RETAIL_RELEASE_NAME -or $_.tag_name -eq $env:RETAIL_RELEASE_NAME) }) | Select-Object -First 1
          if ($null -eq $release) { throw "Draft release '$env:RETAIL_RELEASE_NAME' was not found." }
          $assets = @($release.assets | Where-Object { $_.name -in @('Terraria.exe', 'Terraria.zip') })
          if ($assets.Count -ne 1) { throw "Expected exactly one Terraria.exe/Terraria.zip private asset; found $($assets.Count)." }
          "TERRARIA_ASSET_ID=$($assets[0].id)" >> $env:GITHUB_ENV
          "TERRARIA_ASSET_NAME=$($assets[0].name)" >> $env:GITHUB_ENV
          if (-not [string]::IsNullOrWhiteSpace([string]$assets[0].digest)) { "TERRARIA_ASSET_DIGEST=$($assets[0].digest)" >> $env:GITHUB_ENV }

      - name: Build gloader package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build.ps1
          $stage = (Resolve-Path 'dist/gloader').Path
          if (-not (Test-Path (Join-Path $stage 'gloader.exe'))) { throw 'gloader.exe was not produced.' }
          "GLOADER_STAGE=$stage" >> $env:GITHUB_ENV

      - name: Stage matching retail Terraria.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP $env:TERRARIA_ASSET_NAME
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$env:TERRARIA_ASSET_ID" -Headers $headers -OutFile $download
          if (-not [string]::IsNullOrWhiteSpace($env:TERRARIA_ASSET_DIGEST) -and $env:TERRARIA_ASSET_DIGEST.StartsWith('sha256:', [System.StringComparison]::OrdinalIgnoreCase)) {
            $expected = $env:TERRARIA_ASSET_DIGEST.Substring(7)
            $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash
            if ($actual -ne $expected) { throw 'Private Terraria asset digest mismatch.' }
          }
          $bytes = [IO.File]::ReadAllBytes($download)
          $target = Join-Path $env:GLOADER_STAGE 'Terraria.exe'
          if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B) {
            $expanded = Join-Path $env:RUNNER_TEMP 'terraria-private-input'
            Expand-Archive -LiteralPath $download -DestinationPath $expanded -Force
            $matches = @(Get-ChildItem $expanded -Recurse -File -Filter Terraria.exe)
            if ($matches.Count -ne 1) { throw "Expected exactly one Terraria.exe in private archive; found $($matches.Count)." }
            Copy-Item $matches[0].FullName $target -Force
          } else {
            Move-Item $download $target -Force
          }

      - name: Build private x64 Terraria runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/x64-runtime/Build-X64Runtime.ps1 `
            -TerrariaDirectory $env:GLOADER_STAGE `
            -OutputDirectory (Join-Path $env:GLOADER_STAGE 'gdeps/x64-runtime') `
            -WorkspaceDirectory (Join-Path $env:RUNNER_TEMP 'fourteen-seed-777-x64-workspace')
          $runtime = Join-Path $env:GLOADER_STAGE 'gdeps/x64-runtime/TerrariaRelease.dll'
          if (-not (Test-Path $runtime -PathType Leaf)) { throw 'Private x64 TerrariaRelease.dll was not produced.' }
          Remove-Item (Join-Path $env:GLOADER_STAGE 'Terraria.exe') -Force -ErrorAction SilentlyContinue

      - name: Upload prepared x64 runtime
        id: upload_runtime
        uses: actions/upload-artifact@v4
        with:
          name: fourteen-seed-777-runtime
          path: dist/gloader/
          if-no-files-found: error
          retention-days: 2

  generate_a:
    needs: [plan, prepare-x64-runtime]
    name: ${{ matrix.suite_label }} / ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 46
      matrix: ${{ fromJSON(needs.plan.outputs.batch_a) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate seed 777 world
        uses: ./.github/actions/fourteen-seed-777-generate
        with:
          runtime-artifact-id: ${{ needs.prepare-x64-runtime.outputs.runtime_artifact_id }}
          suite-label: ${{ matrix.suite_label }}
          suite-slug: ${{ matrix.suite_slug }}
          special-config: ${{ matrix.special_config }}
          secret-text: ${{ matrix.secret_text }}
          preset: ${{ matrix.preset }}
          world-slug: ${{ matrix.world_slug }}
          selector: ${{ matrix.selector }}
          copied-size: ${{ matrix.copied_size }}
          autocreate: ${{ matrix.autocreate }}
          expected-width: ${{ matrix.width }}
          expected-height: ${{ matrix.height }}

  generate_b:
    if: ${{ always() && needs.plan.result == 'success' && needs.prepare-x64-runtime.result == 'success' }}
    needs: [plan, prepare-x64-runtime, generate_a]
    name: ${{ matrix.suite_label }} / ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 46
      matrix: ${{ fromJSON(needs.plan.outputs.batch_b) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate seed 777 world
        uses: ./.github/actions/fourteen-seed-777-generate
        with:
          runtime-artifact-id: ${{ needs.prepare-x64-runtime.outputs.runtime_artifact_id }}
          suite-label: ${{ matrix.suite_label }}
          suite-slug: ${{ matrix.suite_slug }}
          special-config: ${{ matrix.special_config }}
          secret-text: ${{ matrix.secret_text }}
          preset: ${{ matrix.preset }}
          world-slug: ${{ matrix.world_slug }}
          selector: ${{ matrix.selector }}
          copied-size: ${{ matrix.copied_size }}
          autocreate: ${{ matrix.autocreate }}
          expected-width: ${{ matrix.width }}
          expected-height: ${{ matrix.height }}

  generate_c:
    if: ${{ always() && needs.plan.result == 'success' && needs.prepare-x64-runtime.result == 'success' }}
    needs: [plan, prepare-x64-runtime, generate_b]
    name: ${{ matrix.suite_label }} / ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 46
      matrix: ${{ fromJSON(needs.plan.outputs.batch_c) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate seed 777 world
        uses: ./.github/actions/fourteen-seed-777-generate
        with:
          runtime-artifact-id: ${{ needs.prepare-x64-runtime.outputs.runtime_artifact_id }}
          suite-label: ${{ matrix.suite_label }}
          suite-slug: ${{ matrix.suite_slug }}
          special-config: ${{ matrix.special_config }}
          secret-text: ${{ matrix.secret_text }}
          preset: ${{ matrix.preset }}
          world-slug: ${{ matrix.world_slug }}
          selector: ${{ matrix.selector }}
          copied-size: ${{ matrix.copied_size }}
          autocreate: ${{ matrix.autocreate }}
          expected-width: ${{ matrix.width }}
          expected-height: ${{ matrix.height }}

  compose:
    if: ${{ always() && needs.plan.result == 'success' }}
    needs: [plan, generate_a, generate_b, generate_c]
    name: Compose ${{ matrix.suite_label }}
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 46
      matrix: ${{ fromJSON(needs.plan.outputs.suites) }}
    env:
      SOURCE_RUN_ID: ${{ github.run_id }}
      SUITE_LABEL: ${{ matrix.suite_label }}
      SUITE_SLUG: ${{ matrix.suite_slug }}
      OUTPUT_FILE: 777-${{ matrix.suite_slug }}-fourteen-seed.png
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout gloader history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact fourteen worlds from this run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $artifacts = @()
          $page = 1
          do {
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/artifacts?per_page=100&page=$page"
            $response = Invoke-RestMethod -Uri $url -Headers $headers
            $batch = @($response.artifacts)
            $artifacts += $batch
            $page++
          } while ($batch.Count -eq 100)

          $worldSlugs = @('small','medium','large','thicc','thicc2','thicc3','thicc4','thicc5','thicc6','thicc7','thicc8','thicc9','thicc10','thicc11')
          $worldDir = Join-Path $PWD 'worlds'
          New-Item -ItemType Directory -Force $worldDir | Out-Null

          foreach ($slug in $worldSlugs) {
            $name = "world-$env:SUITE_SLUG-$slug"
            $matches = @($artifacts | Where-Object { $_.name -eq $name -and -not $_.expired })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one live artifact named '$name' in run $env:SOURCE_RUN_ID; found $($matches.Count)."
            }

            $artifact = $matches[0]
            $zip = Join-Path $env:RUNNER_TEMP ("$name.zip")
            $expanded = Join-Path $env:RUNNER_TEMP ("expanded-$name")
            $downloadHeaders = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)/zip" -Headers $downloadHeaders -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
            $wlds = @(Get-ChildItem $expanded -Recurse -File -Filter '*.wld')
            if ($wlds.Count -ne 1) { throw "Artifact '$name' contained $($wlds.Count) .wld files; expected exactly one." }
            Copy-Item $wlds[0].FullName (Join-Path $worldDir "$slug.wld") -Force
          }

          $downloaded = @(Get-ChildItem $worldDir -File -Filter '*.wld')
          if ($downloaded.Count -ne 14) { throw "Expected 14 downloaded worlds, found $($downloaded.Count)." }
          Write-Host "Downloaded all 14 $env:SUITE_LABEL worlds from run $env:SOURCE_RUN_ID."

      - name: Restore pinned TEdit renderer source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git checkout 01b5009e968e9fbdef94256a54affce3d8f2ac3b -- tools/world-family-renderer
          $dir = 'tools/world-family-renderer'
          Remove-Item "$dir/GenerationEngine.cs","$dir/MainForm.cs","$dir/RuntimeLocator.cs","$dir/WorldFamilyJob.cs" -Force

          $projectPath = "$dir/WorldFamilyRenderer.csproj"
          $projectText = Get-Content $projectPath -Raw
          if (-not $projectText.Contains('<OutputType>WinExe</OutputType>')) {
            throw 'Pinned renderer project no longer has the expected WinExe OutputType.'
          }
          $projectText = $projectText.Replace('<OutputType>WinExe</OutputType>', '<OutputType>Exe</OutputType>')
          Set-Content $projectPath $projectText -Encoding UTF8

          @'
          namespace WorldFamilyRenderer;

          internal sealed record WorldPreset(int Number, string Name, string Slug, int Width, int Height)
          {
              public static IReadOnlyList<WorldPreset> All { get; } = new[]
              {
                  new WorldPreset(1, "Small", "small", 4200, 1200),
                  new WorldPreset(2, "Medium", "medium", 6400, 1800),
                  new WorldPreset(3, "Large", "large", 8400, 2400),
                  new WorldPreset(4, "THICC", "thicc", 10600, 3000),
                  new WorldPreset(5, "THICC 2", "thicc2", 12600, 3600),
                  new WorldPreset(6, "THICC 3", "thicc3", 14800, 4200),
                  new WorldPreset(7, "THICC 4", "thicc4", 16800, 4800),
                  new WorldPreset(8, "THICC 5", "thicc5", 19000, 5400),
                  new WorldPreset(9, "THICC 6", "thicc6", 21000, 6000),
                  new WorldPreset(10, "THICC 7", "thicc7", 23200, 6600),
                  new WorldPreset(11, "THICC 8", "thicc8", 25200, 7200),
                  new WorldPreset(12, "THICC 9", "thicc9", 27400, 7800),
                  new WorldPreset(13, "THICC 10", "thicc10", 29400, 8400),
                  new WorldPreset(14, "THICC 11", "thicc11", 31600, 9000)
              };
          }

          internal sealed record RenderedWorld(WorldPreset Preset, string PngPath, int PixelWidth, int PixelHeight);
          '@ | Set-Content "$dir/Models.cs" -Encoding UTF8

          @'
          using ReactiveUI.Builder;
          using TEdit.Terraria;

          namespace WorldFamilyRenderer;

          internal static class Program
          {
              [STAThread]
              private static int Main(string[] args)
              {
                  try
                  {
                      if (args.Length != 3) throw new ArgumentException("Usage: WorldFamilyRenderer <world-dir> <output-dir> <output-file>");
                      _ = RxAppBuilder.CreateReactiveUIBuilder().WithCoreServices().BuildApp();
                      WorldConfiguration.Initialize();
                      string worldDir = Path.GetFullPath(args[0]);
                      string outputDir = Path.GetFullPath(args[1]);
                      string outputFile = args[2];
                      Directory.CreateDirectory(outputDir);
                      var rendered = new List<RenderedWorld>();
                      var progress = new Progress<string>(Console.WriteLine);

                      foreach (WorldPreset preset in WorldPreset.All)
                      {
                          string worldPath = Path.Combine(worldDir, preset.Slug + ".wld");
                          if (!File.Exists(worldPath)) throw new FileNotFoundException("Missing generated world", worldPath);
                          var loaded = World.LoadWorld(worldPath, headersOnly: true);
                          if (loaded.Error != null || loaded.World == null) throw new InvalidDataException("TEdit could not validate " + preset.Name, loaded.Error);
                          if (loaded.World.TilesWide != preset.Width || loaded.World.TilesHigh != preset.Height)
                              throw new InvalidDataException($"{preset.Name}: expected {preset.Width}x{preset.Height}, got {loaded.World.TilesWide}x{loaded.World.TilesHigh}");

                          string png = Path.Combine(outputDir, $"{preset.Number:00}-{preset.Slug}.png");
                          rendered.Add(TEditPaletteRenderer.RenderAsync(worldPath, preset, 3840, png, progress, CancellationToken.None).GetAwaiter().GetResult());
                      }

                      ComparisonComposer.Compose(rendered, Path.Combine(outputDir, outputFile), CancellationToken.None);
                      Console.WriteLine("Fourteen Seed render complete.");
                      return 0;
                  }
                  catch (Exception ex)
                  {
                      Console.Error.WriteLine(ex);
                      return 1;
                  }
              }
          }
          '@ | Set-Content "$dir/Program.cs" -Encoding UTF8

          $composer = Get-Content "$dir/ComparisonComposer.cs" -Raw
          $composer = $composer.Replace('rendered.Count != 6', 'rendered.Count != 14').Replace('Exactly six rendered worlds are required.', 'Exactly fourteen rendered worlds are required.').Replace('Vanilla + XL + Huge + THICC', "Seed 777 + $env:SUITE_LABEL + Small through THICC 11")
          Set-Content "$dir/ComparisonComposer.cs" $composer -Encoding UTF8

      - name: Checkout pinned TEdit
        uses: actions/checkout@v4
        with:
          repository: TEdit/Terraria-Map-Editor
          ref: cca62adbe37f8cbbd447061650f91a357836f5d0
          path: _deps/TEdit

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and run pinned TEdit compositor with explicit process wait
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'tools/world-family-renderer/WorldFamilyRenderer.csproj'
          $tedit = Join-Path $env:GITHUB_WORKSPACE '_deps/TEdit'
          dotnet restore $project -p:TEditRoot="$tedit"
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }
          dotnet publish $project -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:TEditRoot="$tedit"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }

          $exe = (Resolve-Path 'tools/world-family-renderer/bin/Release/net10.0-windows/win-x64/publish/WorldFamilyRenderer.exe').Path
          $worldDir = (Resolve-Path 'worlds').Path
          $outputDir = Join-Path $PWD 'rendered'
          New-Item -ItemType Directory -Force $outputDir | Out-Null

          $process = Start-Process -FilePath $exe -ArgumentList @($worldDir, $outputDir, $env:OUTPUT_FILE) -WorkingDirectory (Split-Path $exe) -NoNewWindow -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Renderer failed with exit code $($process.ExitCode)" }

          $outputPath = Join-Path $outputDir $env:OUTPUT_FILE
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $outputPath -PathType Leaf) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $outputPath -PathType Leaf)) { throw "Final comparison PNG was not produced: $outputPath" }

          $pngs = @(Get-ChildItem $outputDir -File -Filter '*.png')
          if ($pngs.Count -ne 15) { throw "Expected 15 PNGs (14 individual + 1 comparison), found $($pngs.Count)." }

      - name: Upload rendered family
        uses: actions/upload-artifact@v4
        with:
          name: fourteen-seed-777-${{ matrix.suite_slug }}
          path: rendered/*.png
          if-no-files-found: error
          retention-days: 14
