name: Fourteen Seed 777 - All Special and Secret Seeds

on:
  push:
    branches:
      - run/fourteen-seed-777-all-special-secret
    paths:
      - .github/workflows/fourteen-seed-777-all-special-secret.yml
      - .github/actions/fourteen-seed-777-generate/action.yml
      - .github/actions/fourteen-seed-777-prepare/action.yml
      - .github/actions/fourteen-seed-777-compose/action.yml
      - .github/scripts/fourteen-seed-777-plan.ps1
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fourteen-seed-777-all-special-secret
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      batch_a: ${{ steps.plan.outputs.batch_a }}
      batch_b: ${{ steps.plan.outputs.batch_b }}
      batch_c: ${{ steps.plan.outputs.batch_c }}
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - name: Build size-first 46-suite matrices
        id: plan
        shell: pwsh
        run: ./.github/scripts/fourteen-seed-777-plan.ps1

  prepare-x64-runtime:
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      runtime_artifact_id: ${{ steps.prepare.outputs.runtime-artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private x64 runtime
        id: prepare
        uses: ./.github/actions/fourteen-seed-777-prepare

  generate_a:
    needs: [plan, prepare-x64-runtime]
    name: ${{ matrix.suite_label }} / ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 46
      matrix: ${{ fromJSON(needs.plan.outputs.batch_a) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate seed 777 world
        uses: ./.github/actions/fourteen-seed-777-generate
        with:
          runtime-artifact-id: ${{ needs.prepare-x64-runtime.outputs.runtime_artifact_id }}
          suite-label: ${{ matrix.suite_label }}
          suite-slug: ${{ matrix.suite_slug }}
          special-config: ${{ matrix.special_config }}
          secret-text: ${{ matrix.secret_text }}
          preset: ${{ matrix.preset }}
          world-slug: ${{ matrix.world_slug }}
          selector: ${{ matrix.selector }}
          copied-size: ${{ matrix.copied_size }}
          autocreate: ${{ matrix.autocreate }}
          expected-width: ${{ matrix.width }}
          expected-height: ${{ matrix.height }}

  generate_b:
    if: ${{ always() && needs.plan.result == 'success' && needs.prepare-x64-runtime.result == 'success' }}
    needs: [plan, prepare-x64-runtime, generate_a]
    name: ${{ matrix.suite_label }} / ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 46
      matrix: ${{ fromJSON(needs.plan.outputs.batch_b) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate seed 777 world
        uses: ./.github/actions/fourteen-seed-777-generate
        with:
          runtime-artifact-id: ${{ needs.prepare-x64-runtime.outputs.runtime_artifact_id }}
          suite-label: ${{ matrix.suite_label }}
          suite-slug: ${{ matrix.suite_slug }}
          special-config: ${{ matrix.special_config }}
          secret-text: ${{ matrix.secret_text }}
          preset: ${{ matrix.preset }}
          world-slug: ${{ matrix.world_slug }}
          selector: ${{ matrix.selector }}
          copied-size: ${{ matrix.copied_size }}
          autocreate: ${{ matrix.autocreate }}
          expected-width: ${{ matrix.width }}
          expected-height: ${{ matrix.height }}

  generate_c:
    if: ${{ always() && needs.plan.result == 'success' && needs.prepare-x64-runtime.result == 'success' }}
    needs: [plan, prepare-x64-runtime, generate_b]
    name: ${{ matrix.suite_label }} / ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 46
      matrix: ${{ fromJSON(needs.plan.outputs.batch_c) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate seed 777 world
        uses: ./.github/actions/fourteen-seed-777-generate
        with:
          runtime-artifact-id: ${{ needs.prepare-x64-runtime.outputs.runtime_artifact_id }}
          suite-label: ${{ matrix.suite_label }}
          suite-slug: ${{ matrix.suite_slug }}
          special-config: ${{ matrix.special_config }}
          secret-text: ${{ matrix.secret_text }}
          preset: ${{ matrix.preset }}
          world-slug: ${{ matrix.world_slug }}
          selector: ${{ matrix.selector }}
          copied-size: ${{ matrix.copied_size }}
          autocreate: ${{ matrix.autocreate }}
          expected-width: ${{ matrix.width }}
          expected-height: ${{ matrix.height }}

  compose:
    if: ${{ always() && needs.plan.result == 'success' }}
    needs: [plan, generate_a, generate_b, generate_c]
    name: Compose ${{ matrix.suite_label }}
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 46
      matrix: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
      - name: Render fourteen-world comparison
        uses: ./.github/actions/fourteen-seed-777-compose
        with:
          suite-label: ${{ matrix.suite_label }}
          suite-slug: ${{ matrix.suite_slug }}
