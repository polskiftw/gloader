name: Debug Terraria embedded dependency bootstrap

on:
  push:
    branches:
      - fix/terraria-embedded-deps-bootstrap

permissions:
  contents: read

jobs:
  real-expanded-world:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install XNA 4.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'xnafx40_redist.msi'
          Invoke-WebRequest 'https://download.microsoft.com/download/5/3/A/53A804C8-EC78-43CD-A0F0-2FB4D45603D3/xnafx40_redist.msi' -OutFile $msi
          $p = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $msi + '"'), '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "XNA install failed: $($p.ExitCode)" }

      - name: Build gloader package from this branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build.ps1
          if (-not (Test-Path 'dist/gloader/gloader.exe')) { throw 'Built gloader.exe missing.' }
          if (-not (Test-Path 'dist/gloader/gmods/ExpandedWorlds/ServerRuntime.cs')) { throw 'Built ExpandedWorlds missing.' }

      - name: Download official TerrariaServer 1.4.5.8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'terraria-server-1458.zip'
          $root = Join-Path $env:RUNNER_TEMP 'terraria-server-1458'
          Invoke-WebRequest 'https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip' -OutFile $zip
          Expand-Archive $zip $root -Force
          $server = Join-Path $root '1458/Windows/TerrariaServer.exe'
          if (-not (Test-Path $server)) { throw 'Official TerrariaServer.exe missing.' }
          "TERRARIA_SERVER=$server" >> $env:GITHUB_ENV
          "SERVER_DIR=$(Split-Path -Parent $server)" >> $env:GITHUB_ENV

      - name: Generate and validate a real XL world
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $loader = (Resolve-Path 'dist/gloader/gloader.exe').Path
          $mods = Join-Path $env:RUNNER_TEMP 'only-expanded-worlds'
          New-Item -ItemType Directory -Force $mods | Out-Null
          Copy-Item 'gmods/ExpandedWorlds' (Join-Path $mods 'ExpandedWorlds') -Recurse -Force

          $worldDir = Join-Path $env:RUNNER_TEMP 'expanded-world-output'
          New-Item -ItemType Directory -Force $worldDir | Out-Null
          $world = Join-Path $worldDir 'CIExpandedXL.wld'
          $config = Join-Path $env:RUNNER_TEMP 'expanded-world-serverconfig.txt'
          @(
            "world=$world",
            'autocreate=3',
            'worldname=CIExpandedXL',
            'seed=42424242',
            'difficulty=0',
            'maxplayers=1',
            'port=13579',
            'upnp=0',
            'secure=1',
            'worldrollbackstokeep=0'
          ) | Set-Content -Path $config -Encoding ASCII

          $stdout = Join-Path $env:RUNNER_TEMP 'server.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'server.stderr.txt'
          $env:GLOADER_EXPANDED_WORLD = 'XL'
          $arguments = @(
            '--target', ('"' + $env:TERRARIA_SERVER + '"'),
            '--mods', ('"' + $mods + '"'),
            '--', '-config', ('"' + $config + '"')
          )
          $p = Start-Process -FilePath $loader -ArgumentList $arguments -WorkingDirectory $env:SERVER_DIR -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          $deadline = (Get-Date).AddMinutes(30)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $stdout) {
              $text = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
              if ($text -match 'Mod failed:\s*ExpandedWorlds') { break }
              if ($text -match 'Server started' -or $text -match 'Listening on port') {
                $ready = $true
                break
              }
            }
            if ($p.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }

          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          try { $p.WaitForExit(5000) | Out-Null } catch {}

          Write-Host '===== STDOUT TAIL ====='
          if (Test-Path $stdout) { Get-Content $stdout -Tail 300 }
          Write-Host '===== STDERR ====='
          if (Test-Path $stderr) { Get-Content $stderr }
          Write-Host '===== GLOADER SERVER LOG ====='
          $log = Join-Path (Resolve-Path 'dist/gloader/gdeps').Path 'logs/gloader-server.log'
          if (Test-Path $log) { Get-Content $log }

          if (-not $ready) { throw 'Official TerrariaServer never reached ready state with ExpandedWorlds.' }
          if (-not (Test-Path $world)) { throw 'Terraria reached ready state but CIExpandedXL.wld was not created.' }

          $all = Get-Content $stdout -Raw
          if ($all -notmatch 'Loaded Terraria embedded dependency before entry point:\s*ReLogic') { throw 'ReLogic was not resolved from Terraria embedded resources before mod patching.' }
          if ($all -notmatch 'Loaded mod:\s*ExpandedWorlds') { throw 'ExpandedWorlds never reached Loaded mod state.' }
          if ($all -notmatch '\[Expanded Worlds\].*Dedicated-server headless preset:\s*XL\s+12600x2400') { throw 'ExpandedWorlds did not observe the XL request.' }

          $fs = New-Object System.IO.FileStream($world, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
          try {
            $br = New-Object System.IO.BinaryReader($fs, [System.Text.Encoding]::UTF8)
            $version = $br.ReadUInt32()
            if ($version -lt 179) { throw "Unexpected world version: $version" }
            $fs.Position = 0x18
            $sectionCount = $br.ReadInt16()
            if ($sectionCount -lt 2 -or $sectionCount -gt 64) { throw "Invalid section count: $sectionCount" }
            $headerOffset = $br.ReadInt32()
            if ($headerOffset -le $fs.Position -or $headerOffset -ge $fs.Length) { throw "Invalid header offset: $headerOffset" }
            $fs.Position = $headerOffset
            $null = $br.ReadString()
            if ($version -eq 179) { $null = $br.ReadInt32() } else { $null = $br.ReadString() }
            $null = $br.ReadUInt64()
            if ($version -ge 181) { $null = $br.ReadBytes(16) }
            $null = $br.ReadInt32()
            $null = $br.ReadInt32()
            $null = $br.ReadInt32()
            $null = $br.ReadInt32()
            $null = $br.ReadInt32()
            $height = $br.ReadInt32()
            $width = $br.ReadInt32()
          }
          finally {
            if ($br) { $br.Dispose() } else { $fs.Dispose() }
          }

          Write-Host "Saved world header: ${width}x${height}"
          if ($width -ne 12600 -or $height -ne 2400) {
            throw "REAL WORLD FAILURE: expected XL 12600x2400, got ${width}x${height}."
          }
          Write-Host 'PASS: official TerrariaServer generated and saved a real XL 12600x2400 world.'

      - name: Upload probe logs and world header fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraria-expanded-world-generation-probe
          path: |
            ${{ runner.temp }}/server.stdout.txt
            ${{ runner.temp }}/server.stderr.txt
            dist/gloader/gdeps/logs/gloader-server.log
            ${{ runner.temp }}/expanded-world-output/CIExpandedXL.wld
          if-no-files-found: warn
