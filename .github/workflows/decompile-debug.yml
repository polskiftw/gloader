name: Decompile Refreshed Terraria Debug Asset
run-name: Terraria decompile ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft release ID containing TerrariaDebug.tar.gz
        required: true
        type: string
      job_id:
        description: Unique local request ID
        required: true
        type: string

permissions:
  contents: write

jobs:
  decompile:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ILSpy command line
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global ilspycmd
          ilspycmd --version
          if ($LASTEXITCODE -ne 0) { throw 'ilspycmd installation/version check failed.' }

      - name: Download TerrariaDebug.tar.gz from draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -Headers $headers
          if (-not $release.draft) { throw 'Input release must remain a draft.' }
          $asset = $release.assets | Where-Object { $_.name -eq 'TerrariaDebug.tar.gz' } | Select-Object -First 1
          if (-not $asset) { throw 'TerrariaDebug.tar.gz was not found on the requested draft release.' }
          $downloadHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Uri $asset.url -Headers $downloadHeaders -OutFile TerrariaDebug.tar.gz
          if ((Get-Item TerrariaDebug.tar.gz).Length -le 0) { throw 'Downloaded TerrariaDebug.tar.gz is empty.' }

      - name: Extract debug archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path extracted | Out-Null
          tar -xzf TerrariaDebug.tar.gz -C extracted
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract TerrariaDebug.tar.gz.' }

      - name: Discover Terraria managed assemblies
        id: discover
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $managed = @()
          foreach ($file in Get-ChildItem extracted -Recurse -File) {
            try {
              $assembly = [System.Reflection.AssemblyName]::GetAssemblyName($file.FullName)
              $managed += [PSCustomObject]@{ Name = $assembly.Name; Version = $assembly.Version; Path = $file.FullName }
            }
            catch { }
          }

          $client = $managed | Where-Object { $_.Name -eq 'Terraria' } | Select-Object -First 1
          $server = $managed | Where-Object { $_.Name -eq 'TerrariaServer' } | Select-Object -First 1
          if (-not $client) { throw "Could not find a managed assembly named 'Terraria' in TerrariaDebug.tar.gz." }

          Write-Host "Terraria client: $($client.Path) ($($client.Version))"
          "client=$($client.Path)" >> $env:GITHUB_OUTPUT
          if ($server) {
            Write-Host "Terraria server: $($server.Path) ($($server.Version))"
            "server=$($server.Path)" >> $env:GITHUB_OUTPUT
          }

      - name: Bootstrap embedded dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-ProjectDecompile {
            param(
              [Parameter(Mandatory=$true)][string]$Assembly,
              [Parameter(Mandatory=$true)][string]$Output
            )
            $args = @($Assembly, '-o', $Output, '-p', '--disable-updatecheck')
            $pdb = [System.IO.Path]::ChangeExtension($Assembly, '.pdb')
            if (Test-Path $pdb) {
              Write-Host "Using PDB variable names from $pdb"
              $args += @('--use-varnames-from-pdb', $pdb)
            }
            & ilspycmd @args
            if ($LASTEXITCODE -ne 0) { throw "ILSpy bootstrap decompile failed for $Assembly (exit $LASTEXITCODE)." }
          }

          New-Item -ItemType Directory -Force -Path BootstrapClientSource | Out-Null
          Invoke-ProjectDecompile -Assembly '${{ steps.discover.outputs.client }}' -Output 'BootstrapClientSource'

          if ('${{ steps.discover.outputs.server }}' -ne '') {
            New-Item -ItemType Directory -Force -Path BootstrapServerSource | Out-Null
            Invoke-ProjectDecompile -Assembly '${{ steps.discover.outputs.server }}' -Output 'BootstrapServerSource'
          }

      - name: Build complete managed reference set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ManagedRefs | Out-Null

          function Add-ManagedAssembliesFromDirectory {
            param([string]$Directory)
            if (-not (Test-Path $Directory)) { return }

            foreach ($file in Get-ChildItem $Directory -Recurse -File) {
              try { $assembly = [System.Reflection.AssemblyName]::GetAssemblyName($file.FullName) }
              catch { continue }

              $destination = Join-Path (Resolve-Path ManagedRefs) ($assembly.Name + '.dll')
              if (Test-Path $destination) {
                $existing = [System.Reflection.AssemblyName]::GetAssemblyName($destination)
                if ($existing.Version -gt $assembly.Version) { continue }
              }
              Copy-Item $file.FullName $destination -Force
            }
          }

          Add-ManagedAssembliesFromDirectory 'extracted'
          Add-ManagedAssembliesFromDirectory 'BootstrapClientSource'
          Add-ManagedAssembliesFromDirectory 'BootstrapServerSource'

          if (-not (Test-Path 'ManagedRefs/ReLogic.dll')) {
            throw 'ReLogic.dll was not recovered; refusing to return an incomplete Terraria decompile.'
          }

          Write-Host "Managed reference assemblies: $((Get-ChildItem ManagedRefs -File -Filter '*.dll').Count)"

      - name: Decompile Terraria client with resolved dependencies
        id: client_decompile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assembly = '${{ steps.discover.outputs.client }}'
          New-Item -ItemType Directory -Force -Path Result/Client | Out-Null

          $args = @($assembly, '-o', 'Result/Client', '-p', '-r', (Resolve-Path ManagedRefs), '--disable-updatecheck', '--no-dead-code')
          $pdb = [System.IO.Path]::ChangeExtension($assembly, '.pdb')
          $pdbUsed = $false
          if (Test-Path $pdb) {
            Write-Host "Using original PDB variable names from $pdb"
            $args += @('--use-varnames-from-pdb', $pdb)
            $pdbUsed = $true
          }
          & ilspycmd @args
          if ($LASTEXITCODE -ne 0) { throw "Terraria client decompile failed (exit $LASTEXITCODE)." }

          if (-not (Get-ChildItem Result/Client -Recurse -File -Filter '*.cs' | Select-Object -First 1)) {
            throw 'ILSpy produced no Terraria client C# source.'
          }
          "pdb_used=$($pdbUsed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Decompile Terraria server with resolved dependencies
        id: server_decompile
        if: ${{ steps.discover.outputs.server != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assembly = '${{ steps.discover.outputs.server }}'
          New-Item -ItemType Directory -Force -Path Result/Server | Out-Null

          $args = @($assembly, '-o', 'Result/Server', '-p', '-r', (Resolve-Path ManagedRefs), '--disable-updatecheck', '--no-dead-code')
          $pdb = [System.IO.Path]::ChangeExtension($assembly, '.pdb')
          $pdbUsed = $false
          if (Test-Path $pdb) {
            Write-Host "Using original PDB variable names from $pdb"
            $args += @('--use-varnames-from-pdb', $pdb)
            $pdbUsed = $true
          }
          & ilspycmd @args
          if ($LASTEXITCODE -ne 0) { throw "Terraria server decompile failed (exit $LASTEXITCODE)." }

          if (-not (Get-ChildItem Result/Server -Recurse -File -Filter '*.cs' | Select-Object -First 1)) {
            throw 'ILSpy produced no Terraria server C# source.'
          }
          "pdb_used=$($pdbUsed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Make decompiled projects self-contained
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Make-SelfContainedProject {
            param([Parameter(Mandatory=$true)][string]$ProjectDirectory)

            $project = Get-ChildItem $ProjectDirectory -File -Filter '*.csproj' | Select-Object -First 1
            if (-not $project) { throw "No .csproj found in $ProjectDirectory." }

            $referenceOutput = Join-Path $ProjectDirectory 'References'
            New-Item -ItemType Directory -Force -Path $referenceOutput | Out-Null
            Copy-Item 'ManagedRefs/*.dll' $referenceOutput -Force

            [xml]$xml = Get-Content -Raw $project.FullName
            foreach ($reference in @($xml.Project.ItemGroup.Reference)) {
              if (-not $reference.HintPath) { continue }

              $simpleName = ([string]$reference.Include).Split(',')[0]
              $candidate = Join-Path $referenceOutput ($simpleName + '.dll')
              if (-not (Test-Path $candidate)) {
                $oldBase = [System.IO.Path]::GetFileName(([string]$reference.HintPath).Replace('\', '/'))
                $candidate = Join-Path $referenceOutput $oldBase
              }
              if (-not (Test-Path $candidate)) {
                throw "Could not make reference '$($reference.Include)' self-contained for $($project.Name)."
              }

              $reference.HintPath = 'References\' + [System.IO.Path]::GetFileName($candidate)
            }
            $xml.Save($project.FullName)

            [xml]$check = Get-Content -Raw $project.FullName
            foreach ($reference in @($check.Project.ItemGroup.Reference)) {
              if (-not $reference.HintPath) { continue }
              $resolved = Join-Path $ProjectDirectory ([string]$reference.HintPath)
              if (-not (Test-Path $resolved)) {
                throw "Generated project still contains a missing reference: $($reference.HintPath)"
              }
            }
          }

          Make-SelfContainedProject -ProjectDirectory 'Result/Client'
          if (Test-Path 'Result/Server') {
            Make-SelfContainedProject -ProjectDirectory 'Result/Server'
          }

      - name: Audit decompiler output and record provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $fatalPatterns = @(
            'Unknown result type',
            'got Unknown',
            'DecompilerException',
            'Could not decompile',
            'Error near IL',
            'An error occurred while decompiling'
          )

          $sourceFiles = Get-ChildItem Result -Recurse -File -Filter '*.cs'
          $bad = @()
          if ($sourceFiles) {
            $bad = Select-String -Path $sourceFiles.FullName -Pattern $fatalPatterns -SimpleMatch
          }
          if ($bad.Count -gt 0) {
            $bad | Select-Object -First 100 | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw "Decompiler audit failed with $($bad.Count) fatal diagnostic marker(s)."
          }

          $advisoryPatterns = @('Expected VT, but got Obj', 'Expected Obj, but got VT')
          $advisories = @()
          if ($sourceFiles) {
            $advisories = Select-String -Path $sourceFiles.FullName -Pattern $advisoryPatterns -SimpleMatch
          }

          $ilspyVersion = (& ilspycmd --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not record ILSpy version.' }

          $clientAssembly = '${{ steps.discover.outputs.client }}'
          $clientHash = (Get-FileHash $clientAssembly -Algorithm SHA256).Hash.ToLowerInvariant()
          $clientName = [System.Reflection.AssemblyName]::GetAssemblyName($clientAssembly)

          $lines = @(
            'Terraria decompile provenance',
            "ILSpy: $($ilspyVersion -replace '[\r\n]+', ' / ')",
            "Client assembly: $($clientName.Name) $($clientName.Version)",
            "Client SHA256: $clientHash",
            "Client PDB variable names used: ${{ steps.client_decompile.outputs.pdb_used }}",
            "Client C# files: $((Get-ChildItem Result/Client -Recurse -File -Filter '*.cs').Count)"
          )

          if ('${{ steps.discover.outputs.server }}' -ne '') {
            $serverAssembly = '${{ steps.discover.outputs.server }}'
            $serverHash = (Get-FileHash $serverAssembly -Algorithm SHA256).Hash.ToLowerInvariant()
            $serverName = [System.Reflection.AssemblyName]::GetAssemblyName($serverAssembly)
            $lines += "Server assembly: $($serverName.Name) $($serverName.Version)"
            $lines += "Server SHA256: $serverHash"
            $lines += "Server PDB variable names used: ${{ steps.server_decompile.outputs.pdb_used }}"
            $lines += "Server C# files: $((Get-ChildItem Result/Server -Recurse -File -Filter '*.cs').Count)"
          }

          $lines += "Managed references bundled: $((Get-ChildItem ManagedRefs -File -Filter '*.dll').Count)"
          $lines += "Fatal decompiler diagnostics: 0"
          $lines += "Advisory IL stack-type comments: $($advisories.Count)"
          if ($advisories.Count -gt 0) {
            $lines += 'Advisory comments are preserved because ILSpy still emitted valid C# and returned success; inspect these methods when exact IL-level reconstruction matters.'
            Write-Warning "ILSpy emitted $($advisories.Count) advisory stack-type comment(s). They are recorded in DECOMP_INFO.txt."
          }

          $lines | Set-Content -Encoding UTF8 'Result/DECOMP_INFO.txt'

      - name: Package decompile
        shell: pwsh
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "TerrariaDecomp-$env:JOB_ID.tar.gz"
          tar -czf $name -C Result .
          if ($LASTEXITCODE -ne 0) { throw 'Could not package Terraria decompile.' }
          if ((Get-Item $name).Length -le 0) { throw 'Decompile archive is empty.' }

      - name: Upload decompile to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "TerrariaDecomp-$env:JOB_ID.tar.gz"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $escaped = [System.Uri]::EscapeDataString($name)
          Invoke-RestMethod -Method Post -Uri "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=$escaped" -Headers $headers -ContentType 'application/gzip' -InFile $name | Out-Null
