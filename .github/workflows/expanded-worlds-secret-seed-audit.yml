name: Expanded Worlds secret-seed source audit

on:
  workflow_dispatch:
  push:
    branches:
      - feat/expanded-world-sizes
    paths:
      - .github/workflows/expanded-worlds-secret-seed-audit.yml
      - gmods/ExpandedWorlds/**
      - tests/ExpandedWorldCompile/**

jobs:
  audit-secret-seed-worldgen:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ILSpy command line
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .audit-tools | Out-Null
          dotnet tool install ilspycmd --tool-path .audit-tools

      - name: Audit Terraria 1.4.5.8 secret-seed source contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveVersion = '1458'
          $zip = Join-Path $env:RUNNER_TEMP "terraria-server-$archiveVersion.zip"
          $root = Join-Path $env:RUNNER_TEMP 'terraria-server'
          $url = "https://terraria.org/api/download/pc-dedicated-server/terraria-server-$archiveVersion.zip"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $server = Join-Path $root "$archiveVersion/Windows/TerrariaServer.exe"
          if (-not (Test-Path $server)) {
            throw "TerrariaServer.exe not found at expected path: $server"
          }

          $ilspy = Join-Path $PWD '.audit-tools/ilspycmd.exe'
          $auditDir = Join-Path $PWD 'secret-seed-audit-output'
          New-Item -ItemType Directory -Force $auditDir | Out-Null
          $worldGen = Join-Path $auditDir 'WorldGen.cs'
          & $ilspy -t Terraria.WorldGen $server | Set-Content -Encoding UTF8 $worldGen

          if (-not (Test-Path $worldGen) -or (Get-Item $worldGen).Length -eq 0) {
            throw 'ILSpy did not produce WorldGen.cs.'
          }

          $source = Get-Content -Raw $worldGen
          $failures = New-Object System.Collections.Generic.List[string]

          function Assert-Match {
            param([string]$Name, [string]$Pattern)
            $ok = [regex]::IsMatch($source, $Pattern, [System.Text.RegularExpressions.RegexOptions]::Multiline)
            Write-Host "$($(if ($ok) {'PASS'} else {'FAIL'})) - $Name"
            if (-not $ok) { $failures.Add($Name) }
          }

          function Assert-MatchCount {
            param([string]$Name, [string]$Pattern, [int]$Expected)
            $count = [regex]::Matches($source, $Pattern, [System.Text.RegularExpressions.RegexOptions]::Multiline).Count
            $ok = $count -eq $Expected
            Write-Host "$($(if ($ok) {'PASS'} else {'FAIL'})) - $Name (expected $Expected, found $count)"
            if (-not $ok) { $failures.Add("$Name expected $Expected found $count") }
          }

          # Crimson fixed scratch storage: only CrimVein appends heartPos. CrimEnt
          # is invoked afterwards but does not append another record.
          Assert-Match 'Crimson heartPos remains a 100-slot fixed array' 'heartPos\s*=.*new Point\[100\]'
          Assert-Match 'CrimStart still rolls five through eight veins' 'genRand\.Next\(5,\s*9\)'
          Assert-MatchCount 'Exactly one source append writes heartPos by heartCount' 'heartPos\[heartCount\]\s*=' 1

          $crimEnt = [regex]::Match(
            $source,
            'public static void CrimEnt\(.*?(?=public static void CrimVein\()',
            [System.Text.RegularExpressions.RegexOptions]::Singleline).Value
          if ([string]::IsNullOrWhiteSpace($crimEnt) -or $crimEnt -match 'heartPos\[') {
            $failures.Add('CrimEnt must exist and must not append heartPos')
            Write-Host 'FAIL - CrimEnt must exist and must not append heartPos'
          } else {
            Write-Host 'PASS - CrimEnt exists and does not append heartPos'
          }

          # Don't Starve Wavy Caves intentionally uses width squared in vanilla.
          # Expanded Worlds patches only the beyond-Large proxy; if source shape
          # changes, fail instead of guessing a new scaling rule.
          Assert-Match 'Wavy Caves generation pass exists' 'GenPassNameID\.WavyCaves'
          Assert-Match 'Wavy Caves source scale is width / 4200' 'Main\.maxTilesX\s*/\s*4200\.0'
          Assert-Match 'Wavy Caves squares its vanilla width scale' 'num\s*\*=\s*num'
          Assert-Match 'Wavy Caves base coefficient remains 35' '35\.0\s*\*\s*num'
          Assert-Match 'Wavy Caves Remix interaction remains divide by three' 'num2\s*/=\s*3'

          # Modern Temple storage follows the rolled room count dynamically, so
          # seed multipliers do not need a fixed-buffer patch.
          Assert-Match 'Modern makeTemple has GenerationProgress parameter' 'makeTemple\(int x, int y, GenerationProgress progress = null\)'
          Assert-Match 'Temple room count remains width/4200-derived' 'Main\.maxTilesX\s*/\s*4200\.0'
          Assert-Match 'Temple Drunk multiplier remains x3' 'if \(drunkWorldGen\).*?num2 \*= 3'
          Assert-Match 'Temple For the Worthy multiplier remains x3' 'else if \(getGoodWorldGen\).*?num2 \*= 3'
          Assert-Match 'Temple Remix multiplier remains x2' 'else if \(remixWorldGen\).*?num2 \*= 2'
          Assert-Match 'Temple Rectangle storage is dynamic numRooms+10' 'new Rectangle\[num2 \+ 10\]'
          Assert-Match 'Temple depth storage is dynamic numRooms+10' 'new int\[num2 \+ 10\]'

          if ($failures.Count -gt 0) {
            throw "Terraria 1.4.5.8 secret-seed source audit failed: $($failures -join '; ')"
          }

      - name: Upload exact audited WorldGen source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-worlds-secret-seed-source-audit
          path: secret-seed-audit-output/
          if-no-files-found: warn
          retention-days: 7
