name: Prune branch graveyard

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prune-branch-graveyard.yml"

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Delete obsolete branches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $branches = @(
            'debug/world-maker-headless-load',
            'feat/expanded-world-sizes',
            'feat/promote-inferred-tier-continuity',
            'feat/thicc-11-ladder',
            'feat/world-maker-secret-seeds',
            'feature/world-family-renderer',
            'feature/x64-runtime',
            'fix/expanded-worlds-minecart-track-capacity',
            'fix/expanded-worlds-server-headless',
            'fix/fullscreen-map-frame-scaling',
            'fix/main-terraria-embedded-deps-bootstrap',
            'fix/maprenderer-main-map-v2',
            'fix/terraria-embedded-deps-bootstrap',
            'fix/vanilla-world-size-continuity',
            'fix/world-family-reactiveui-init',
            'fix/world-maker-fail-fast-mod-load',
            'fix/world-maker-wld-validation',
            'gelatin-frame-edit',
            'gelatin-gif-support',
            'gelatin-runtime-properties-015',
            'gelatin-v1',
            'general-radio-v1-ready',
            'general-radio-v1',
            'gui-mod-manager',
            'infinite-angler-debug-quest-fish',
            'release/world-maker-secret-seeds-main',
            'release/x64-expanded-worlds',
            'run/expandedworlds-one-small-20260904',
            'run/six-seed-343434-20260904',
            'run/six-seed-1337420-20260904',
            'run/world-family-sample-20260903',
            'toolchain-autodownload',
            'toolchain-autodownload-2',
            'toolchain-autodownload-3',
            'toolchain-autodownload-4',
            'ui/expanded-worlds-size-grid',
            'unused-check'
          )

          foreach ($branch in $branches) {
            Write-Host "Deleting branch: $branch"
            gh api --silent --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$branch"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete branch '$branch'."
            }
          }

          Write-Host "Deleted $($branches.Count) obsolete branches."

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prune-branch-graveyard.yml
          git commit -m "Remove one-shot branch graveyard cleanup"
          git push origin HEAD:main
