name: Radio live provider smoke

on:
  workflow_dispatch:
  push:
    branches:
      - general-radio-v1
    paths:
      - "gmods/Radio/**"
      - "tests/RadioCompile/**"
      - ".github/workflows/radio-live-smoke.yml"
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

jobs:
  live-provider-smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Radio test harness
        shell: pwsh
        run: dotnet restore tests/RadioCompile/RadioCompile.csproj

      - name: Build Radio test harness
        shell: pwsh
        run: dotnet build tests/RadioCompile/RadioCompile.csproj -c Release --no-restore

      - name: Fresh provider/catalog/metadata probes
        shell: pwsh
        run: |
          & "tests/RadioCompile/bin/Release/net48/RadioCompile.exe" --live
          if ($LASTEXITCODE -ne 0) {
            throw "Radio live provider smoke failed with exit code $LASTEXITCODE"
          }
