name: Expanded Worlds 16800x4800 LAA memory probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/expanded-world-sizes
    paths:
      - .github/workflows/expanded-worlds-16800x4800-memory-probe-v4.yml

jobs:
  probe:
    name: 16800x4800 LAA generate + save + fresh reload
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install official Microsoft XNA Framework 4.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'xnafx40_redist.msi'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/a/c/2/ac2c903b-e6e8-42c2-9fd7-bebac362a930/xnafx40_redist.msi' -OutFile $msi
          $p = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', ('"' + $msi + '"'), '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010)) { throw "XNA installer exited $($p.ExitCode)." }

      - name: Download official Terraria 1.4.5.8 dedicated server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'terraria-server-1458.zip'
          $root = Join-Path $env:RUNNER_TEMP 'terraria-server-runtime'
          Invoke-WebRequest -Uri 'https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $server = Join-Path $root '1458/Windows/TerrariaServer.exe'
          if (-not (Test-Path $server)) { throw "TerrariaServer.exe not found: $server" }
          Write-Host "TerrariaServer SHA256: $((Get-FileHash $server -Algorithm SHA256).Hash)"
          "TERRARIA_SERVER=$server" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TERRARIA_SERVER_DIR=$(Split-Path -Parent $server)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build x86 gloader and enable Large Address Aware for probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build src/GLoader/GLoader.csproj -c Release -p:PlatformTarget=x86 -p:Prefer32Bit=true
          $gloader = Join-Path $PWD 'src/GLoader/bin/Release/net48/gloader.exe'
          if (-not (Test-Path $gloader)) { throw "gloader.exe not found: $gloader" }

          function Read-PeCharacteristics([string]$path) {
            $b = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 0x3c)
            [pscustomobject]@{ Bytes=$b; Offset=($pe + 22); Value=[BitConverter]::ToUInt16($b, $pe + 22) }
          }

          $pe = Read-PeCharacteristics $gloader
          Write-Host ("gloader before: Characteristics=0x{0:X4}; LAA={1}" -f $pe.Value, (($pe.Value -band 0x20) -ne 0))
          $newValue = [uint16]($pe.Value -bor 0x20)
          [BitConverter]::GetBytes($newValue).CopyTo($pe.Bytes, $pe.Offset)
          [IO.File]::WriteAllBytes($gloader, $pe.Bytes)

          $verify = Read-PeCharacteristics $gloader
          $laa = (($verify.Value -band 0x20) -ne 0)
          Write-Host ("gloader probe build: Characteristics=0x{0:X4}; LAA={1}" -f $verify.Value, $laa)
          if (-not $laa) { throw 'Failed to enable LARGEADDRESSAWARE on isolated probe gloader.exe.' }

          "GLOADER_EXE=$gloader" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GLOADER_LAA=$laa" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare isolated Expanded Worlds 16800x4800 staging copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modsRoot = Join-Path $env:RUNNER_TEMP 'expanded-worlds-16800x4800-gmods'
          $mod = Join-Path $modsRoot 'ExpandedWorlds'
          New-Item -ItemType Directory -Force $modsRoot | Out-Null
          Copy-Item (Join-Path $PWD 'gmods/ExpandedWorlds') $mod -Recurse -Force

          function Replace-Once([string]$path, [string]$old, [string]$new) {
            $text = Get-Content -Raw $path
            $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
            if ($count -ne 1) { throw "Expected one '$old' in $path; found $count." }
            Set-Content $path ($text.Replace($old, $new)) -Encoding UTF8
          }

          Replace-Once (Join-Path $mod 'GenerationMath.cs') 'public const int HugeHeight = 2400;' 'public const int HugeHeight = 4800;'
          Replace-Once (Join-Path $mod 'ServerRuntime.cs') 'internal const int VanillaLargeHeight = 2400;' 'internal const int VanillaLargeHeight = 4800;'

          $storage = Join-Path $mod 'WorldStorage.cs'
          $text = Get-Content -Raw $storage
          $pattern = 'return\s+height\s*==\s*ExpandedWorldMath\.LargeHeight\s*&&\s*\(width\s*==\s*ExpandedWorldMath\.XLWidth\s*\|\|\s*width\s*==\s*ExpandedWorldMath\.HugeWidth\s*\);'
          if ([regex]::Matches($text, $pattern).Count -ne 1) { throw 'WorldStorage dimension guard shape changed.' }
          $replacement = 'return (width == ExpandedWorldMath.XLWidth && height == ExpandedWorldMath.XLHeight) ||' + [Environment]::NewLine + '               (width == ExpandedWorldMath.HugeWidth && height == ExpandedWorldMath.HugeHeight);'
          Set-Content $storage ([regex]::Replace($text, $pattern, $replacement, 1)) -Encoding UTF8

          Write-Host 'Staged exactly one source mod: ExpandedWorlds. Probe Huge=16800x4800.'
          "EXPANDED_MODS=$modsRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate, save, and fresh-process reload 16800x4800
        shell: pwsh
        env:
          GLOADER_EXPANDED_WORLD: HUGE
        run: |
          $ErrorActionPreference = 'Stop'
          $width = 16800
          $height = 4800
          $output = Join-Path $PWD 'memory-probe-16800x4800-v4'
          $saveRoot = Join-Path $env:RUNNER_TEMP 'terraria-expanded-16800x4800-v4'
          $worldDir = Join-Path $saveRoot 'Worlds'
          $world = Join-Path $worldDir 'expanded-16800x4800.wld'
          New-Item -ItemType Directory -Force $output | Out-Null
          New-Item -ItemType Directory -Force $worldDir | Out-Null

          function Test-Port([int]$port) {
            $c = New-Object System.Net.Sockets.TcpClient
            try {
              $t = $c.ConnectAsync('127.0.0.1', $port)
              if (-not $t.Wait(250)) { return $false }
              return $c.Connected
            } catch { return $false } finally { $c.Dispose() }
          }

          function Show-Logs([string]$stdout, [string]$stderr) {
            if (Test-Path $stdout) {
              $s = Get-Content -Raw -ErrorAction SilentlyContinue $stdout
              if (-not [string]::IsNullOrWhiteSpace($s)) { Write-Host '--- stdout ---'; Write-Host $s }
            }
            if (Test-Path $stderr) {
              $e = Get-Content -Raw -ErrorAction SilentlyContinue $stderr
              if (-not [string]::IsNullOrWhiteSpace($e)) { Write-Host '--- stderr ---'; Write-Host $e }
            }
          }

          function Peaks([string]$csv) {
            $r = @(Import-Csv $csv)
            if ($r.Count -eq 0) { return [pscustomobject]@{ WS=0; Private=0; Virtual=0 } }
            [pscustomobject]@{
              WS = ($r | ForEach-Object { [double]$_.working_set_mb } | Measure-Object -Maximum).Maximum
              Private = ($r | ForEach-Object { [double]$_.private_mb } | Measure-Object -Maximum).Maximum
              Virtual = ($r | ForEach-Object { [double]$_.virtual_mb } | Measure-Object -Maximum).Maximum
            }
          }

          function Run-Phase([string]$phase, [int]$port, [bool]$autocreate, [int]$timeoutSeconds) {
            $stdout = Join-Path $output "$phase-stdout.txt"
            $stderr = Join-Path $output "$phase-stderr.txt"
            $memory = Join-Path $output "$phase-memory.csv"
            'utc,elapsed_s,working_set_mb,private_mb,virtual_mb' | Set-Content $memory

            $game = @('-savedirectory', ('"' + $saveRoot + '"'), '-world', ('"' + $world + '"'), '-port', $port, '-maxplayers', '1', '-noupnp')
            if ($autocreate) { $game += @('-autocreate', '3', '-worldname', 'Expanded16800x4800', '-seed', '123456789', '-difficulty', '0') }
            $a = @('--target', ('"' + $env:TERRARIA_SERVER + '"'), '--mods', ('"' + $env:EXPANDED_MODS + '"'), '--') + $game
            $argString = $a -join ' '
            Write-Host "Starting $phase"
            $p = Start-Process -FilePath $env:GLOADER_EXE -ArgumentList $argString -WorkingDirectory $env:TERRARIA_SERVER_DIR -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

            $sw = [Diagnostics.Stopwatch]::StartNew()
            $nextReport = 0
            while ($sw.Elapsed.TotalSeconds -lt $timeoutSeconds) {
              if ($p.HasExited) {
                Show-Logs $stdout $stderr
                throw "$phase process exited with code $($p.ExitCode)."
              }

              $p.Refresh()
              $ws = [math]::Round($p.WorkingSet64 / 1MB, 2)
              $private = [math]::Round($p.PrivateMemorySize64 / 1MB, 2)
              $virtual = [math]::Round($p.VirtualMemorySize64 / 1MB, 2)
              Add-Content $memory "$(Get-Date -Format o),$([math]::Round($sw.Elapsed.TotalSeconds,1)),$ws,$private,$virtual"
              if ($sw.Elapsed.TotalSeconds -ge $nextReport) {
                Write-Host ("{0}: {1:n0}s, WS {2:n1} MiB, private {3:n1} MiB, virtual {4:n1} MiB" -f $phase, $sw.Elapsed.TotalSeconds, $ws, $private, $virtual)
                $nextReport += 60
              }

              if (Test-Path $stdout) {
                $live = Get-Content -Raw -ErrorAction SilentlyContinue $stdout
                if (-not [string]::IsNullOrEmpty($live)) {
                  if ($live.Contains('Dedicated-server generation failed:') -or $live.Contains('Mod failed:')) {
                    Show-Logs $stdout $stderr
                    throw "$phase reported a generation/mod failure."
                  }
                }
              }

              if (Test-Port $port) {
                Start-Sleep -Seconds 2
                try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
                try { $p.WaitForExit(10000) | Out-Null } catch {}
                Show-Logs $stdout $stderr
                return [pscustomobject]@{ Ready=$true; Stdout=$stdout; Stderr=$stderr; Memory=$memory; Peaks=(Peaks $memory) }
              }
              Start-Sleep -Seconds 5
            }

            try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
            Show-Logs $stdout $stderr
            return [pscustomobject]@{ Ready=$false; Stdout=$stdout; Stderr=$stderr; Memory=$memory; Peaks=(Peaks $memory) }
          }

          $gen = Run-Phase 'generate' 7820 $true 17000
          if (-not $gen.Ready) {
            Add-Content $env:GITHUB_STEP_SUMMARY '### Expanded Worlds 16800x4800 LAA memory probe'
            Add-Content $env:GITHUB_STEP_SUMMARY '- Result: **INCONCLUSIVE — generation exceeded runner budget; slowness is not failure.**'
            Add-Content $env:GITHUB_STEP_SUMMARY "- Generation peak WS/private/virtual: **$($gen.Peaks.WS) / $($gen.Peaks.Private) / $($gen.Peaks.Virtual) MiB**"
            exit 0
          }

          if (-not (Test-Path $world)) { throw 'Server opened its port but no world file exists.' }
          $genLog = Get-Content -Raw $gen.Stdout
          foreach ($marker in @(
            "Dedicated-server headless preset: Huge $width`x$height",
            "GenerateWorld: using Huge $width`x$height (vanilla tier 2)",
            "clearWorld: using Huge $width`x$height (vanilla tier 2)",
            "Dedicated-server generation completed at $width`x$height",
            "LoadWorld verified Huge $width`x$height (vanilla tier 2)")) {
            if (-not $genLog.Contains($marker)) { throw "Generation log missing: $marker" }
          }

          $info = Get-Item $world
          if ($info.Length -lt 1MB) { throw "Generated world is unexpectedly small: $($info.Length) bytes" }
          $hash = (Get-FileHash $world -Algorithm SHA256).Hash
          Copy-Item $world (Join-Path $output 'expanded-16800x4800.wld') -Force
          Write-Host "GENERATION PASS: $($info.Length) bytes; SHA256 $hash"
          Write-Host "Generation peaks: WS $($gen.Peaks.WS) MiB; private $($gen.Peaks.Private) MiB; virtual $($gen.Peaks.Virtual) MiB"

          $reload = Run-Phase 'reload' 7821 $false 2400
          if (-not $reload.Ready) {
            Add-Content $env:GITHUB_STEP_SUMMARY '### Expanded Worlds 16800x4800 LAA memory probe'
            Add-Content $env:GITHUB_STEP_SUMMARY '- Generation: **PASS**'
            Add-Content $env:GITHUB_STEP_SUMMARY '- Fresh reload: **INCONCLUSIVE — reload exceeded runner budget; slowness is not failure.**'
            exit 0
          }

          $reloadLog = Get-Content -Raw $reload.Stdout
          $reloadMarker = "LoadWorld verified Huge $width`x$height (vanilla tier 2)"
          if (-not $reloadLog.Contains($reloadMarker)) { throw "Reload log missing: $reloadMarker" }
          if ($reloadLog.Contains('GenerateWorld: using Huge')) { throw 'Fresh reload regenerated instead of loading.' }
          $hash2 = (Get-FileHash $world -Algorithm SHA256).Hash
          if ($hash2 -ne $hash) { throw "World changed during reload: $hash -> $hash2" }

          Add-Content $env:GITHUB_STEP_SUMMARY '### Expanded Worlds 16800x4800 LAA memory probe'
          Add-Content $env:GITHUB_STEP_SUMMARY '- Result: **PASS — generated, saved, and fresh-process reloaded.**'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Dimensions: **$width x $height**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- World bytes: **$($info.Length)**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- SHA256: ``$hash``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- gloader LARGEADDRESSAWARE: **$env:GLOADER_LAA**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Generation peak WS/private/virtual: **$($gen.Peaks.WS) / $($gen.Peaks.Private) / $($gen.Peaks.Virtual) MiB**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Reload peak WS/private/virtual: **$($reload.Peaks.WS) / $($reload.Peaks.Private) / $($reload.Peaks.Virtual) MiB**"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-worlds-16800x4800-laa-memory-probe
          path: memory-probe-16800x4800-v4/
          if-no-files-found: warn
          retention-days: 7
