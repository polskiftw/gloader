name: Expanded Worlds THICC 16800x4800 runtime probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/expanded-world-sizes
    paths:
      - .github/workflows/expanded-worlds-16800x4800-memory-probe-v4.yml
      - build.ps1
      - src/GLoader/**
      - gmods/ExpandedWorlds/**

jobs:
  probe:
    name: Permanent THICC generate + save + fresh reload
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install official Microsoft XNA Framework 4.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'xnafx40_redist.msi'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/a/c/2/ac2c903b-e6e8-42c2-9fd7-bebac362a930/xnafx40_redist.msi' -OutFile $msi
          $p = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', ('"' + $msi + '"'), '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010)) { throw "XNA installer exited $($p.ExitCode)." }

      - name: Download official Terraria 1.4.5.8 dedicated server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'terraria-server-1458.zip'
          $root = Join-Path $env:RUNNER_TEMP 'terraria-server-runtime'
          Invoke-WebRequest -Uri 'https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $server = Join-Path $root '1458/Windows/TerrariaServer.exe'
          if (-not (Test-Path $server)) { throw "TerrariaServer.exe not found: $server" }
          Write-Host "TerrariaServer SHA256: $((Get-FileHash $server -Algorithm SHA256).Hash)"
          "TERRARIA_SERVER=$server" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TERRARIA_SERVER_DIR=$(Split-Path -Parent $server)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release gloader and verify Large Address Aware
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build.ps1
          $gloader = Join-Path $PWD 'dist/gloader/gloader.exe'
          if (-not (Test-Path $gloader)) { throw "gloader.exe not found: $gloader" }

          $bytes = [IO.File]::ReadAllBytes($gloader)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $characteristics = [BitConverter]::ToUInt16($bytes, $pe + 22)
          $laa = (($characteristics -band 0x20) -ne 0)
          Write-Host ("Release gloader: Characteristics=0x{0:X4}; LAA={1}" -f $characteristics, $laa)
          if (-not $laa) { throw 'Release gloader.exe is not Large Address Aware.' }

          "GLOADER_EXE=$gloader" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage only the real Expanded Worlds mod
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modsRoot = Join-Path $env:RUNNER_TEMP 'expanded-worlds-thicc-gmods'
          New-Item -ItemType Directory -Force $modsRoot | Out-Null
          Copy-Item (Join-Path $PWD 'gmods/ExpandedWorlds') (Join-Path $modsRoot 'ExpandedWorlds') -Recurse -Force
          "EXPANDED_MODS=$modsRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Staged unmodified ExpandedWorlds source. THICC will be selected through the permanent server preset.'

      - name: Generate, save, and fresh-process reload permanent THICC
        shell: pwsh
        env:
          GLOADER_EXPANDED_WORLD: THICC
        run: |
          $ErrorActionPreference = 'Stop'
          $width = 16800
          $height = 4800
          $output = Join-Path $PWD 'thicc-runtime-probe'
          $saveRoot = Join-Path $env:RUNNER_TEMP 'terraria-expanded-thicc'
          $worldDir = Join-Path $saveRoot 'Worlds'
          $world = Join-Path $worldDir 'THICC.wld'
          New-Item -ItemType Directory -Force $output | Out-Null
          New-Item -ItemType Directory -Force $worldDir | Out-Null

          function Test-Port([int]$port) {
            $c = New-Object System.Net.Sockets.TcpClient
            try {
              $t = $c.ConnectAsync('127.0.0.1', $port)
              if (-not $t.Wait(250)) { return $false }
              return $c.Connected
            } catch { return $false } finally { $c.Dispose() }
          }

          function Show-Logs([string]$stdout, [string]$stderr) {
            if (Test-Path $stdout) {
              $s = Get-Content -Raw -ErrorAction SilentlyContinue $stdout
              if (-not [string]::IsNullOrWhiteSpace($s)) { Write-Host '--- stdout ---'; Write-Host $s }
            }
            if (Test-Path $stderr) {
              $e = Get-Content -Raw -ErrorAction SilentlyContinue $stderr
              if (-not [string]::IsNullOrWhiteSpace($e)) { Write-Host '--- stderr ---'; Write-Host $e }
            }
          }

          function Peaks([string]$csv) {
            $r = @(Import-Csv $csv)
            if ($r.Count -eq 0) { return [pscustomobject]@{ WS=0; Private=0; Virtual=0 } }
            [pscustomobject]@{
              WS = ($r | ForEach-Object { [double]$_.working_set_mb } | Measure-Object -Maximum).Maximum
              Private = ($r | ForEach-Object { [double]$_.private_mb } | Measure-Object -Maximum).Maximum
              Virtual = ($r | ForEach-Object { [double]$_.virtual_mb } | Measure-Object -Maximum).Maximum
            }
          }

          function Run-Phase([string]$phase, [int]$port, [bool]$autocreate, [int]$timeoutSeconds) {
            $stdout = Join-Path $output "$phase-stdout.txt"
            $stderr = Join-Path $output "$phase-stderr.txt"
            $memory = Join-Path $output "$phase-memory.csv"
            'utc,elapsed_s,working_set_mb,private_mb,virtual_mb' | Set-Content $memory

            $game = @('-savedirectory', ('"' + $saveRoot + '"'), '-world', ('"' + $world + '"'), '-port', $port, '-maxplayers', '1', '-noupnp')
            if ($autocreate) {
              $game += @('-autocreate', '3', '-worldname', 'THICC', '-seed', '123456789', '-difficulty', '0')
            }
            $loaderArgs = @('--target', ('"' + $env:TERRARIA_SERVER + '"'), '--mods', ('"' + $env:EXPANDED_MODS + '"'), '--')
            $argString = ($loaderArgs + $game) -join ' '
            Write-Host "Starting $phase"
            $p = Start-Process -FilePath $env:GLOADER_EXE -ArgumentList $argString -WorkingDirectory $env:TERRARIA_SERVER_DIR -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

            $sw = [Diagnostics.Stopwatch]::StartNew()
            $nextReport = 0
            while ($sw.Elapsed.TotalSeconds -lt $timeoutSeconds) {
              if ($p.HasExited) {
                Show-Logs $stdout $stderr
                throw "$phase process exited with code $($p.ExitCode)."
              }

              $p.Refresh()
              $ws = [math]::Round($p.WorkingSet64 / 1MB, 2)
              $private = [math]::Round($p.PrivateMemorySize64 / 1MB, 2)
              $virtual = [math]::Round($p.VirtualMemorySize64 / 1MB, 2)
              Add-Content $memory "$(Get-Date -Format o),$([math]::Round($sw.Elapsed.TotalSeconds,1)),$ws,$private,$virtual"
              if ($sw.Elapsed.TotalSeconds -ge $nextReport) {
                Write-Host ("{0}: {1:n0}s, WS {2:n1} MiB, private {3:n1} MiB, virtual {4:n1} MiB" -f $phase, $sw.Elapsed.TotalSeconds, $ws, $private, $virtual)
                $nextReport += 60
              }

              if (Test-Path $stdout) {
                $live = Get-Content -Raw -ErrorAction SilentlyContinue $stdout
                if (-not [string]::IsNullOrEmpty($live) -and
                    ($live.Contains('Dedicated-server generation failed:') -or $live.Contains('Mod failed:'))) {
                  Show-Logs $stdout $stderr
                  throw "$phase reported a generation/mod failure."
                }
              }

              if (Test-Port $port) {
                Start-Sleep -Seconds 2
                try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
                try { $p.WaitForExit(10000) | Out-Null } catch {}
                Show-Logs $stdout $stderr
                return [pscustomobject]@{ Ready=$true; Stdout=$stdout; Stderr=$stderr; Memory=$memory; Peaks=(Peaks $memory) }
              }
              Start-Sleep -Seconds 5
            }

            try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
            Show-Logs $stdout $stderr
            return [pscustomobject]@{ Ready=$false; Stdout=$stdout; Stderr=$stderr; Memory=$memory; Peaks=(Peaks $memory) }
          }

          $gen = Run-Phase 'generate' 7820 $true 17000
          if (-not $gen.Ready) { throw 'Permanent THICC generation exceeded the probe timeout.' }
          if (-not (Test-Path $world)) { throw 'Server opened its port but no THICC world file exists.' }

          $genLog = Get-Content -Raw $gen.Stdout
          foreach ($marker in @(
            "Dedicated-server headless preset: THICC $width`x$height",
            "GenerateWorld: using THICC $width`x$height (vanilla tier 2)",
            "clearWorld: using THICC $width`x$height (vanilla tier 2)",
            "Dedicated-server generation completed at $width`x$height",
            "LoadWorld verified THICC $width`x$height (vanilla tier 2)")) {
            if (-not $genLog.Contains($marker)) { throw "Generation log missing permanent THICC marker: $marker" }
          }

          $info = Get-Item $world
          if ($info.Length -lt 1MB) { throw "Generated THICC world is unexpectedly small: $($info.Length) bytes" }
          $hash = (Get-FileHash $world -Algorithm SHA256).Hash
          Copy-Item $world (Join-Path $output 'THICC.wld') -Force

          $reload = Run-Phase 'reload' 7821 $false 2400
          if (-not $reload.Ready) { throw 'Permanent THICC fresh reload exceeded the probe timeout.' }
          $reloadLog = Get-Content -Raw $reload.Stdout
          $reloadMarker = "LoadWorld verified THICC $width`x$height (vanilla tier 2)"
          if (-not $reloadLog.Contains($reloadMarker)) { throw "Reload log missing: $reloadMarker" }
          if ($reloadLog.Contains('GenerateWorld: using THICC')) { throw 'Fresh reload regenerated instead of loading.' }

          $hash2 = (Get-FileHash $world -Algorithm SHA256).Hash
          if ($hash2 -ne $hash) { throw "World changed during reload: $hash -> $hash2" }

          Add-Content $env:GITHUB_STEP_SUMMARY '### Permanent THICC 16800x4800 runtime probe'
          Add-Content $env:GITHUB_STEP_SUMMARY '- Result: **PASS — unmodified mod selected THICC, generated, saved, and fresh-process reloaded.**'
          Add-Content $env:GITHUB_STEP_SUMMARY '- Vanilla category: **Large (tier 2)**'
          Add-Content $env:GITHUB_STEP_SUMMARY '- Release gloader: **Large Address Aware**'
          Add-Content $env:GITHUB_STEP_SUMMARY "- World bytes: **$($info.Length)**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- SHA256: **$hash**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Generation peak WS/private/virtual: **$($gen.Peaks.WS) / $($gen.Peaks.Private) / $($gen.Peaks.Virtual) MiB**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Reload peak WS/private/virtual: **$($reload.Peaks.WS) / $($reload.Peaks.Private) / $($reload.Peaks.Virtual) MiB**"

      - name: Upload THICC probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-worlds-thicc-permanent-runtime-probe
          path: thicc-runtime-probe/
          if-no-files-found: warn
          retention-days: 7