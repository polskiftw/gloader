name: ExpandedWorlds clearWorld perf

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out gloader
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Linux gloader
        run: ./build.sh

      - name: Download current private Steam Terraria Linux sample
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const release = releases.find(r => r.draft && r.name === 'Linux Terraria Full Binaries');
            if (!release) {
              throw new Error('Could not find draft release "Linux Terraria Full Binaries".');
            }
            const asset =
              release.assets.find(a => a.name === 'TerrariaDebug.tar.gz') ||
              release.assets.find(a => a.name === 'Terraria.Linux.tar.gz');
            if (!asset) {
              throw new Error('Draft release "Linux Terraria Full Binaries" contains neither TerrariaDebug.tar.gz nor legacy Terraria.Linux.tar.gz.');
            }
            if (!asset.digest || !asset.digest.startsWith('sha256:')) {
              throw new Error('TerrariaDebug.tar.gz does not expose a SHA-256 digest through the GitHub release API.');
            }

            const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: asset.id,
              headers: { accept: 'application/octet-stream' }
            });
            const bytes = Buffer.isBuffer(response.data)
              ? response.data
              : Buffer.from(response.data);
            const actual = crypto.createHash('sha256').update(bytes).digest('hex');
            const expected = asset.digest.slice('sha256:'.length).toLowerCase();
            if (actual !== expected) {
              throw new Error(`TerrariaDebug.tar.gz SHA256 mismatch. Expected ${expected}, got ${actual}`);
            }
            core.info(`Using draft asset ${asset.id}; SHA256 ${actual}`);
            fs.writeFileSync('TerrariaDebug.tar.gz', bytes);
      - name: Prepare exact server fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir input
          tar -xzf TerrariaDebug.tar.gz -C input

          server_bin="$(find input -maxdepth 4 -type f -name TerrariaServer.bin.x86_64 -print -quit)"
          test -n "$server_bin"
          steam_root="$(dirname "$server_bin")"
          fixture="$RUNNER_TEMP/expandedworlds-clearworld"

          rm -rf "$fixture"
          cp -a "$steam_root" "$fixture"
          cp dist/gloader "$fixture/gloader"
          rm -rf "$fixture/gdeps" "$fixture/gmods"
          mkdir -p "$fixture/gdeps" "$fixture/gmods/ExpandedWorlds" "$fixture/gmods/WorldgenPerfProbe"
          cp -a dist/gdeps/. "$fixture/gdeps/"
          cp -a gmods/ExpandedWorlds/. "$fixture/gmods/ExpandedWorlds/"
          cp tests/WorldgenPerfProbe/PerfProbe.cs "$fixture/gmods/WorldgenPerfProbe/PerfProbe.cs"
          echo "$fixture" > fixture-path.txt

      - name: Benchmark tile-canvas initialization
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(cat fixture-path.txt)"
          seed=1337420

          run_case() {
            name="$1"
            preset="$2"
            gc_params="${3:-}"
            out="$RUNNER_TEMP/clear-$name.out"
            save="$RUNNER_TEMP/clear-save-$name"
            world="$save/Worlds/clear-$name.wld"
            rm -rf "$save"
            mkdir -p "$save/Worlds"

            echo "===== CLEAR CASE $name ====="
            start_ns="$(date +%s%N)"
            set +e
            (
              cd "$fixture"
              export GLOADER_PERF_EXIT_AFTER_CLEARWORLD=1
              if [ -n "$preset" ]; then
                export GLOADER_EXPANDED_WORLD="$preset"
              else
                unset GLOADER_EXPANDED_WORLD || true
              fi

              if [ -n "$gc_params" ]; then
                export MONO_GC_PARAMS="$gc_params"
              else
                unset MONO_GC_PARAMS || true
              fi

              exec ./gloader --server --                 -savedirectory "$save"                 -world "$world"                 -autocreate 3                 -worldname "Clear$name"                 -seed "$seed"                 -difficulty 0                 -port 7941                 -maxplayers 1                 -noupnp
            ) >"$out" 2>&1
            status=$?
            set -e
            end_ns="$(date +%s%N)"
            elapsed="$(awk -v a="$start_ns" -v b="$end_ns" 'BEGIN { printf "%.3f", (b-a)/1000000000 }')"

            echo "CLEAR_RESULT case=$name status=$status process_seconds=$elapsed"
            grep -E '^\[Worldgen Perf\] (runtime|clearWorld_)' "$out" || true
            test "$status" -eq 0
            grep -q '^\[Worldgen Perf\] clearWorld_end' "$out"
          }

          run_case large ""
          run_case thicc THICC
          run_case thicc11 THICC11
          run_case thicc11-gc64 THICC11 "nursery-size=64m"
          run_case thicc11-gc256 THICC11 "nursery-size=256m"

      - name: Upload clearWorld logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expandedworlds-clearworld-perf
          path: |
            ${{ runner.temp }}/clear-large.out
            ${{ runner.temp }}/clear-thicc.out
            ${{ runner.temp }}/clear-thicc11.out
            ${{ runner.temp }}/clear-thicc11-gc64.out
            ${{ runner.temp }}/clear-thicc11-gc256.out
          if-no-files-found: warn
