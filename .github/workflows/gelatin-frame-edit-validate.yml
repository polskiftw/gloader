name: Gelatin frame edit validation

on:
  push:
    branches:
      - gelatin-frame-edit
    paths:
      - ".github/workflows/gelatin-frame-edit-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gelatin-frame-edit

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: tools/gelatin
        run: dotnet restore Gelatin.sln

      - name: Build Release
        working-directory: tools/gelatin
        run: dotnet build Gelatin.sln -c Release --no-restore

      - name: Run tests
        working-directory: tools/gelatin
        run: dotnet test Gelatin.sln -c Release --no-build

      - name: Publish Windows x64 package
        shell: pwsh
        run: tools/gelatin/scripts/publish.ps1

      - name: Verify package
        shell: pwsh
        run: |
          $archive = "tools/gelatin/dist/gelatin-0.1.3-win-x64.zip"
          $publish = "tools/gelatin/dist/gelatin"
          $executable = Join-Path $publish "Gelatin.exe"
          if (-not (Test-Path $archive -PathType Leaf)) { throw "Missing $archive" }
          if (-not (Test-Path $executable -PathType Leaf)) { throw "Missing $executable" }
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          Write-Host "Gelatin package SHA256: $hash"

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $executable = (Resolve-Path "tools/gelatin/dist/gelatin/Gelatin.exe").Path
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "Packaged Gelatin.exe exited during startup smoke test with code $($process.ExitCode)."
            }
            Write-Host "Packaged Gelatin.exe remained running through the startup smoke test."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
          }
