name: gloader Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build native ELF, Mono profiler, and managed loader
        run: ./build.sh

      - name: Verify package contract
        shell: bash
        run: |
          set -euo pipefail
          test -x dist/gloader
          test -f dist/gdeps/GLoader.dll
          test -x dist/gdeps/libmono-profiler-gloader.so
          test -d dist/gmods
          test ! -e dist/gloader.exe

          file dist/gloader
          file dist/gdeps/libmono-profiler-gloader.so
          file dist/gdeps/GLoader.dll
          readelf -h dist/gloader
          readelf -h dist/gdeps/libmono-profiler-gloader.so
          readelf -d dist/gdeps/libmono-profiler-gloader.so

          file dist/gloader | grep -q 'ELF 64-bit'
          file dist/gdeps/libmono-profiler-gloader.so | grep -q 'ELF 64-bit.*shared object'
          readelf -h dist/gloader | grep -q 'Advanced Micro Devices X86-64'
          readelf -h dist/gdeps/libmono-profiler-gloader.so | grep -q 'Advanced Micro Devices X86-64'
          nm -D dist/gdeps/libmono-profiler-gloader.so | grep -q ' T mono_profiler_init_gloader$'

          if readelf -d dist/gloader | grep -Ei 'NEEDED.*mono'; then
            echo 'gloader must not link against a system Mono runtime.' >&2
            exit 1
          fi
          if readelf -d dist/gdeps/libmono-profiler-gloader.so | grep -Ei 'NEEDED.*mono'; then
            echo 'gloader profiler must resolve Mono from Terraria, not link a system Mono runtime.' >&2
            exit 1
          fi

      - name: Native wrapper handoff smoke test
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/gloader-wrapper-fixture"
          rm -rf "$fixture"
          mkdir -p "$fixture/gdeps"
          cp dist/gloader "$fixture/gloader"

          cat > "$fixture/Terraria.bin.x86_64" <<'SH'
          #!/usr/bin/env bash
          {
            echo "HOST=${0##*/}"
            echo "MONO=${MONO_BUNDLED_OPTIONS-}"
            echo "ROOT=${GLOADER_ROOT-}"
            echo "MODE=${GLOADER_MODE-}"
            echo "DISABLE=${GLOADER_DISABLE_MODS-}"
            echo "LD=${LD_LIBRARY_PATH-}"
            printf 'ARG=%s\n' "$@"
          } > "$CAPTURE"
          SH
          cp "$fixture/Terraria.bin.x86_64" "$fixture/TerrariaServer.bin.x86_64"
          chmod 0755 "$fixture/Terraria.bin.x86_64" "$fixture/TerrariaServer.bin.x86_64"

          CAPTURE="$fixture/client.out" \
          MONO_BUNDLED_OPTIONS='--debug --profile=gloader:stale' \
          "$fixture/gloader" "$fixture/Terraria" alpha 'two words'

          grep -Fxq 'HOST=Terraria.bin.x86_64' "$fixture/client.out"
          grep -Fxq 'MONO=--debug --profile=gloader' "$fixture/client.out"
          grep -Fxq "ROOT=$fixture" "$fixture/client.out"
          grep -Fxq 'MODE=client' "$fixture/client.out"
          grep -Fxq 'DISABLE=0' "$fixture/client.out"
          grep -Fq "LD=$fixture/gdeps" "$fixture/client.out"
          grep -Fxq 'ARG=alpha' "$fixture/client.out"
          grep -Fxq 'ARG=two words' "$fixture/client.out"

          CAPTURE="$fixture/server.out" \
          "$fixture/gloader" --server -- -port 7777

          grep -Fxq 'HOST=TerrariaServer.bin.x86_64' "$fixture/server.out"
          grep -Fxq 'MODE=server' "$fixture/server.out"
          grep -Fxq 'ARG=-port' "$fixture/server.out"
          grep -Fxq 'ARG=7777' "$fixture/server.out"

          CAPTURE="$fixture/vanilla.out" \
          GLOADER_ROOT=stale \
          GLOADER_MODE=server \
          GLOADER_DISABLE_MODS=1 \
          LD_LIBRARY_PATH=/keep \
          MONO_BUNDLED_OPTIONS='--debug --profile=gloader' \
          "$fixture/gloader" --vanilla "$fixture/Terraria" vanilla

          grep -Fxq 'MONO=--debug' "$fixture/vanilla.out"
          grep -Fxq 'ROOT=' "$fixture/vanilla.out"
          grep -Fxq 'MODE=' "$fixture/vanilla.out"
          grep -Fxq 'DISABLE=' "$fixture/vanilla.out"
          grep -Fxq 'LD=/keep' "$fixture/vanilla.out"
          grep -Fxq 'ARG=vanilla' "$fixture/vanilla.out"

      - name: Mono profiler attach smoke test
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-runtime mono-mcs

          fixture="$RUNNER_TEMP/gloader-mono-fixture"
          rm -rf "$fixture"
          mkdir -p "$fixture/gdeps" "$fixture/gmods"
          cp -a dist/gdeps/. "$fixture/gdeps/"

          cat > "$fixture/Terraria.cs" <<'CS'
          using System;
          public static class Program
          {
              public static void Main(string[] args)
              {
                  Console.WriteLine("TERRARIA_FIXTURE_MAIN");
              }
          }
          CS
          mcs -nologo -target:exe -out:"$fixture/Terraria.exe" "$fixture/Terraria.cs"

          (
            cd "$fixture"
            GLOADER_ROOT="$fixture" \
            GLOADER_MODE=client \
            GLOADER_DISABLE_MODS=1 \
            LD_LIBRARY_PATH="$fixture/gdeps${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            MONO_PATH="$fixture:$fixture/gdeps" \
            mono --profile=gloader Terraria.exe | tee fixture.out
          )

          grep -q 'TERRARIA_FIXTURE_MAIN' "$fixture/fixture.out"
          grep -q 'Attached target: Terraria' "$fixture/gdeps/logs/gloader-client.log"
          grep -q 'returning control to Terraria' "$fixture/gdeps/logs/gloader-client.log"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: gloader-linux
          path: dist/
          if-no-files-found: error
