name: Expanded Worlds headless runtime

on:
  workflow_dispatch:
  push:
    branches:
      - feat/expanded-world-sizes
    paths:
      - .github/workflows/expanded-worlds-headless-runtime-x86.yml
      - src/GLoader/**
      - gmods/ExpandedWorlds/**

jobs:
  generate-and-reload:
    name: ${{ matrix.preset }} generate + reload
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: XL
            expected_width: 12600
            generation_port: 7782
            reload_port: 7783
          - preset: Huge
            expected_width: 16800
            generation_port: 7784
            reload_port: 7785

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install official Microsoft XNA Framework 4.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'xnafx40_redist.msi'
          $url = 'https://download.microsoft.com/download/a/c/2/ac2c903b-e6e8-42c2-9fd7-bebac362a930/xnafx40_redist.msi'
          Invoke-WebRequest -Uri $url -OutFile $msi
          Write-Host "XNA MSI SHA256: $((Get-FileHash $msi -Algorithm SHA256).Hash)"

          $p = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', ('"' + $msi + '"'), '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010)) {
            throw "XNA Framework installer exited with code $($p.ExitCode)."
          }

          $xnaCandidates = @(
            "$env:WINDIR\Microsoft.NET\assembly\GAC_32\Microsoft.Xna.Framework",
            "$env:WINDIR\assembly\GAC_32\Microsoft.Xna.Framework"
          )
          if (-not ($xnaCandidates | Where-Object { Test-Path $_ })) {
            throw 'XNA Framework install completed but Microsoft.Xna.Framework was not found in the 32-bit GAC.'
          }

      - name: Download official Terraria 1.4.5.8 dedicated server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveVersion = '1458'
          $zip = Join-Path $env:RUNNER_TEMP "terraria-server-$archiveVersion.zip"
          $root = Join-Path $env:RUNNER_TEMP 'terraria-server-runtime'
          $url = "https://terraria.org/api/download/pc-dedicated-server/terraria-server-$archiveVersion.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $server = Join-Path $root "$archiveVersion/Windows/TerrariaServer.exe"
          if (-not (Test-Path $server)) { throw "TerrariaServer.exe not found: $server" }

          $assemblyName = [System.Reflection.AssemblyName]::GetAssemblyName($server)
          Write-Host "Server assembly: $($assemblyName.FullName)"
          Write-Host "ProcessorArchitecture: $($assemblyName.ProcessorArchitecture)"
          Write-Host "TerrariaServer.exe SHA256: $((Get-FileHash $server -Algorithm SHA256).Hash)"

          "TERRARIA_SERVER=$server" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TERRARIA_SERVER_DIR=$(Split-Path -Parent $server)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build matching x86 gloader runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build src/GLoader/GLoader.csproj -c Release -p:PlatformTarget=x86 -p:Prefer32Bit=true

          $gloader = Join-Path $PWD 'src/GLoader/bin/Release/net48/gloader.exe'
          if (-not (Test-Path $gloader)) { throw "gloader.exe not found: $gloader" }
          "GLOADER_EXE=$gloader" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare isolated Expanded Worlds mod directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modsRoot = Join-Path $env:RUNNER_TEMP 'expanded-worlds-gmods'
          $modDestination = Join-Path $modsRoot 'ExpandedWorlds'
          New-Item -ItemType Directory -Force $modsRoot | Out-Null
          Copy-Item -Path (Join-Path $PWD 'gmods/ExpandedWorlds') -Destination $modDestination -Recurse -Force
          "EXPANDED_MODS=$modsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate and reload real ${{ matrix.preset }} world
        shell: pwsh
        env:
          PRESET: ${{ matrix.preset }}
          EXPECTED_WIDTH: ${{ matrix.expected_width }}
          GENERATION_PORT: ${{ matrix.generation_port }}
          RELOAD_PORT: ${{ matrix.reload_port }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHeight = 2400
          $expectedWidth = [int]$env:EXPECTED_WIDTH
          $generationPort = [int]$env:GENERATION_PORT
          $reloadPort = [int]$env:RELOAD_PORT
          $preset = $env:PRESET
          $env:GLOADER_EXPANDED_WORLD = $preset

          $outputRoot = Join-Path $PWD "headless-runtime-$($preset.ToLowerInvariant())"
          New-Item -ItemType Directory -Force $outputRoot | Out-Null

          $saveRoot = Join-Path $env:RUNNER_TEMP "terraria-expanded-$($preset.ToLowerInvariant())"
          $worldDir = Join-Path $saveRoot 'Worlds'
          New-Item -ItemType Directory -Force $worldDir | Out-Null
          $world = Join-Path $worldDir "expanded-$($preset.ToLowerInvariant()).wld"

          function Show-ProcessLogs([string]$stdoutPath, [string]$stderrPath) {
            if (Test-Path $stdoutPath) {
              Write-Host '--- stdout ---'
              Get-Content -Raw $stdoutPath | Write-Host
            }
            if (Test-Path $stderrPath) {
              $stderr = Get-Content -Raw $stderrPath
              if (-not [string]::IsNullOrWhiteSpace($stderr)) {
                Write-Host '--- stderr ---'
                Write-Host $stderr
              }
            }
          }

          function Test-LocalPort([int]$port) {
            $client = New-Object System.Net.Sockets.TcpClient
            try {
              $task = $client.ConnectAsync('127.0.0.1', $port)
              if (-not $task.Wait(250)) { return $false }
              return $client.Connected
            }
            catch {
              return $false
            }
            finally {
              $client.Dispose()
            }
          }

          function Wait-ForServerReady(
            [System.Diagnostics.Process]$process,
            [int]$port,
            [string]$stdoutPath,
            [string]$stderrPath,
            [int]$timeoutSeconds) {

            $deadline = (Get-Date).AddSeconds($timeoutSeconds)
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                Show-ProcessLogs $stdoutPath $stderrPath
                throw "TerrariaServer exited with code $($process.ExitCode) before opening TCP port $port."
              }

              if (Test-LocalPort $port) {
                Write-Host "Server is listening on TCP $port. World load is complete."
                return
              }

              Start-Sleep -Seconds 1
            }

            try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
            Show-ProcessLogs $stdoutPath $stderrPath
            throw "TerrariaServer did not open TCP port $port within $timeoutSeconds seconds."
          }

          function Start-GLoaderServer(
            [string]$phase,
            [int]$port,
            [bool]$autocreate) {

            $stdoutPath = Join-Path $outputRoot "$phase-stdout.txt"
            $stderrPath = Join-Path $outputRoot "$phase-stderr.txt"

            $gameArgs = @(
              '-savedirectory', ('"' + $saveRoot + '"'),
              '-world', ('"' + $world + '"'),
              '-port', $port,
              '-maxplayers', '1',
              '-noupnp'
            )

            if ($autocreate) {
              $gameArgs += @(
                '-autocreate', '3',
                '-worldname', "ExpandedWorld$($preset)",
                '-seed', '123456789',
                '-difficulty', '0'
              )
            }

            $arguments = @(
              '--target', ('"' + $env:TERRARIA_SERVER + '"'),
              '--mods', ('"' + $env:EXPANDED_MODS + '"'),
              '--'
            ) + $gameArgs

            $argumentString = $arguments -join ' '
            Write-Host "Starting $phase: $env:GLOADER_EXE $argumentString"

            $process = Start-Process `
              -FilePath $env:GLOADER_EXE `
              -ArgumentList $argumentString `
              -WorkingDirectory $env:TERRARIA_SERVER_DIR `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput $stdoutPath `
              -RedirectStandardError $stderrPath

            return @($process, $stdoutPath, $stderrPath)
          }

          # Phase 1: Terraria's real Large autocreate path, with Expanded Worlds
          # arming the requested physical width immediately before clearWorld.
          $generation = Start-GLoaderServer 'generate' $generationPort $true
          $generationProcess = $generation[0]
          $generationStdout = [string]$generation[1]
          $generationStderr = [string]$generation[2]
          Wait-ForServerReady $generationProcess $generationPort $generationStdout $generationStderr 1800
          Start-Sleep -Seconds 2
          try { Stop-Process -Id $generationProcess.Id -Force -ErrorAction SilentlyContinue } catch {}
          try { $generationProcess.WaitForExit(10000) | Out-Null } catch {}
          Show-ProcessLogs $generationStdout $generationStderr

          if (-not (Test-Path $world)) {
            throw "Terraria reached server-ready state without creating $world"
          }

          $worldInfo = Get-Item $world
          if ($worldInfo.Length -lt 1MB) {
            throw "Generated world is unexpectedly small: $($worldInfo.Length) bytes"
          }

          $generateLog = Get-Content -Raw $generationStdout
          $requiredGenerationMarkers = @(
            "Dedicated-server headless preset: $preset $expectedWidth`x$expectedHeight",
            "GenerateWorld: using $preset $expectedWidth`x$expectedHeight (vanilla tier 2)",
            "clearWorld: using $preset $expectedWidth`x$expectedHeight (vanilla tier 2)",
            "Dedicated-server generation completed at $expectedWidth`x$expectedHeight",
            "LoadWorld verified $preset $expectedWidth`x$expectedHeight (vanilla tier 2)"
          )
          foreach ($marker in $requiredGenerationMarkers) {
            if (-not $generateLog.Contains($marker)) {
              throw "Generation log is missing required marker: $marker"
            }
          }
          if ($generateLog.Contains('Mod failed:')) {
            throw 'gloader reported a source-mod failure during generation.'
          }

          $worldHash = (Get-FileHash $world -Algorithm SHA256).Hash
          Write-Host "PASS generation: $preset $expectedWidth`x$expectedHeight, $($worldInfo.Length) bytes, SHA256 $worldHash"

          # Phase 2: fresh Terraria/gloader process, existing .wld, no autocreate.
          # The server cannot open its port until WorldFile.LoadWorld has completed;
          # our Harmony postfix throws if Terraria reports any dimensions other than
          # the physical XL/Huge values saved above.
          $reload = Start-GLoaderServer 'reload' $reloadPort $false
          $reloadProcess = $reload[0]
          $reloadStdout = [string]$reload[1]
          $reloadStderr = [string]$reload[2]
          Wait-ForServerReady $reloadProcess $reloadPort $reloadStdout $reloadStderr 600
          Start-Sleep -Seconds 2
          try { Stop-Process -Id $reloadProcess.Id -Force -ErrorAction SilentlyContinue } catch {}
          try { $reloadProcess.WaitForExit(10000) | Out-Null } catch {}
          Show-ProcessLogs $reloadStdout $reloadStderr

          $reloadLog = Get-Content -Raw $reloadStdout
          $reloadMarker = "LoadWorld verified $preset $expectedWidth`x$expectedHeight (vanilla tier 2)"
          if (-not $reloadLog.Contains($reloadMarker)) {
            throw "Reload log is missing required marker: $reloadMarker"
          }
          if ($reloadLog.Contains("GenerateWorld: using $preset")) {
            throw 'Reload unexpectedly regenerated the world instead of loading the saved .wld.'
          }
          if ($reloadLog.Contains('Mod failed:')) {
            throw 'gloader reported a source-mod failure during reload.'
          }

          $reloadedHash = (Get-FileHash $world -Algorithm SHA256).Hash
          if ($reloadedHash -ne $worldHash) {
            throw "The .wld changed during read-only reload verification: $worldHash -> $reloadedHash"
          }

          Write-Host "PASS reload: Terraria reopened $preset at $expectedWidth`x$expectedHeight from the saved .wld."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Expanded Worlds $preset"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Generated: **$expectedWidth x $expectedHeight**"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- World bytes: **$($worldInfo.Length)**"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- SHA256: ``$worldHash``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Fresh-process reload: **PASS**"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Terraria category after generation/load: **Large (2)**"

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-worlds-headless-${{ matrix.preset }}
          path: headless-runtime-*/
          if-no-files-found: warn
          retention-days: 7
