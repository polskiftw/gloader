name: gloader

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "gmods/**"
      - "tests/**"
      - "build.ps1"
      - "gloader.sln"
      - ".github/workflows/gloader.yml"
  pull_request:
    paths:
      - "src/**"
      - "gmods/**"
      - "tests/**"
      - "build.ps1"
      - "gloader.sln"
      - ".github/workflows/gloader.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore gloader.sln
          dotnet restore tests/InfiniteAnglerCompile/InfiniteAnglerCompile.csproj
          dotnet restore tests/NoLiquidDupeCompile/NoLiquidDupeCompile.csproj
          dotnet restore tests/VGMRadioCompile/VGMRadioCompile.csproj
          dotnet restore tests/HostPlayFixture/Client.csproj
          dotnet restore tests/HostPlayFixture/Server.csproj

      - name: Build
        shell: pwsh
        run: |
          dotnet build gloader.sln -c Release --no-restore
          dotnet build tests/InfiniteAnglerCompile/InfiniteAnglerCompile.csproj -c Release --no-restore
          dotnet build tests/NoLiquidDupeCompile/NoLiquidDupeCompile.csproj -c Release --no-restore
          dotnet build tests/VGMRadioCompile/VGMRadioCompile.csproj -c Release --no-restore
          dotnet build tests/HostPlayFixture/Client.csproj -c Release --no-restore
          dotnet build tests/HostPlayFixture/Server.csproj -c Release --no-restore

      - name: VGMRadio Rainwave metadata parser test
        shell: pwsh
        run: |
          & "tests/VGMRadioCompile/bin/Release/net48/VGMRadioCompile.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "VGMRadio Rainwave metadata parser test failed with exit code $LASTEXITCODE"
          }

      - name: Publish
        shell: pwsh
        run: ./build.ps1

      - name: Verify clean Terraria root layout
        shell: pwsh
        run: |
          $rootFiles = @(Get-ChildItem "dist/gloader" -File)
          if ($rootFiles.Count -ne 1 -or $rootFiles[0].Name -ne "gloader.exe") {
            throw "dist/gloader root must contain exactly one file: gloader.exe. Found: $($rootFiles.Name -join ', ')"
          }
          if (-not (Test-Path "dist/gloader/gmods" -PathType Container)) {
            throw "dist/gloader/gmods was not produced."
          }

      - name: Steam Host & Play + Infinite Angler participation integration test
        shell: pwsh
        run: |
          $loader = (Resolve-Path "dist/gloader/gloader.exe").Path
          $target = (Resolve-Path "tests/HostPlayFixture/bin/Release/net48/Terraria.exe").Path
          $mods = Join-Path $env:RUNNER_TEMP "gloader-hostplay-mods"
          $anglerMod = Join-Path $mods "InfiniteAngler"

          Remove-Item $mods -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $mods | Out-Null
          Copy-Item "gmods/InfiniteAngler" $anglerMod -Recurse

          # The shipped setting is deliberately false to preserve v0.1.11 behavior.
          # Enable it only in this isolated fixture so CI exercises the command path.
          Set-Content `
            -Path (Join-Path $anglerMod "InfiniteAngler.ini") `
            -Value "EnableParticipationCommands=true" `
            -Encoding ASCII

          & $loader --target $target --mods $mods
          if ($LASTEXITCODE -ne 0) {
            throw "Steam Host & Play / Infinite Angler participation fixture failed with exit code $LASTEXITCODE"
          }

      - name: Remove integration-test logs
        shell: pwsh
        run: |
          Remove-Item "dist/gloader/gmods/logs" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/GLoader/GLoader.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read Version from src/GLoader/GLoader.csproj"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          Compress-Archive -Path "dist/gloader/*" -DestinationPath "gloader-$version.zip" -Force

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:RELEASE_VERSION" "gloader-$env:RELEASE_VERSION.zip" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "gloader v$env:RELEASE_VERSION" `
            --notes "Infinite Angler adds an optional vanilla-client participation system. Enable EnableParticipationCommands=true in gmods/InfiniteAngler/InfiniteAngler.ini to use !fish in, !fish out, and !fish status. OUT players may still catch and turn in fish normally and are locked out after a successful turn-in; they simply do not block the shared quest from advancing. Completion and participation are tracked separately, opting back in preserves a completion earned while OUT, all-OUT parks the current quest instead of swapping endlessly, disconnects clear session-only opt-outs, and the default false setting preserves the proven v0.1.11 behavior. CI covers the command path plus the existing dawn, vanilla packet-74/75, join, disconnect, and Host & Play regressions."

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gloader
          path: dist/gloader/
