name: gloader

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "gmods/**"
      - "tests/**"
      - "tools/x64-runtime/**"
      - "build.ps1"
      - "gloader.sln"
      - ".github/workflows/gloader.yml"
      - ".github/workflows/radio-live-smoke.yml"
  pull_request:
    paths:
      - "src/**"
      - "gmods/**"
      - "tests/**"
      - "tools/x64-runtime/**"
      - "build.ps1"
      - "gloader.sln"
      - ".github/workflows/gloader.yml"
      - ".github/workflows/radio-live-smoke.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore gloader.sln
          dotnet restore tests/InfiniteAnglerCompile/InfiniteAnglerCompile.csproj
          dotnet restore tests/InfiniteAnglerDebugFixture/InfiniteAnglerDebugFixture.csproj
          dotnet restore tests/NoLiquidDupeCompile/NoLiquidDupeCompile.csproj
          dotnet restore tests/RadioCompile/RadioCompile.csproj
          dotnet restore tests/RadioPolicyCompile/RadioPolicyCompile.csproj
          dotnet restore tests/ModDiscoveryCompile/ModDiscoveryCompile.csproj
          dotnet restore tests/HostPlayFixture/Client.csproj
          dotnet restore tests/HostPlayFixture/Server.csproj

      - name: Build
        shell: pwsh
        run: |
          dotnet build gloader.sln -c Release --no-restore
          dotnet build tests/InfiniteAnglerCompile/InfiniteAnglerCompile.csproj -c Release --no-restore
          dotnet build tests/InfiniteAnglerDebugFixture/InfiniteAnglerDebugFixture.csproj -c Release --no-restore
          dotnet build tests/NoLiquidDupeCompile/NoLiquidDupeCompile.csproj -c Release --no-restore
          dotnet build tests/RadioCompile/RadioCompile.csproj -c Release --no-restore
          dotnet build tests/RadioPolicyCompile/RadioPolicyCompile.csproj -c Release --no-restore
          dotnet build tests/ModDiscoveryCompile/ModDiscoveryCompile.csproj -c Release --no-restore
          dotnet build tests/HostPlayFixture/Client.csproj -c Release --no-restore
          dotnet build tests/HostPlayFixture/Server.csproj -c Release --no-restore

      - name: Validate x64 runtime builder PowerShell
        shell: pwsh
        run: |
          $builderPath = (Resolve-Path "tools/x64-runtime/Build-X64Runtime.ps1").Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $builderPath,
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            throw "x64 runtime builder has PowerShell parse errors:`n$($errors | Out-String)"
          }

          $builder = Get-Content $builderPath -Raw
          if ($builder -match '(?m)^\s*\$SetupCli\s*=') {
            throw "x64 runtime builder must not invoke the pinned Windows setup-cli.bat; that wrapper changes into setup/ and masks dotnet failures."
          }
          if ($builder -notmatch '-WorkingDirectory\s+\$WorkspaceDirectory') {
            throw "x64 runtime builder must run the upstream setup CLI with the workspace root as its working directory."
          }
          if ($builder -notmatch 'setup\\CLI\\Setup\.CLI\.csproj') {
            throw "x64 runtime builder must invoke the pinned Setup.CLI project directly."
          }

      - name: Infinite Angler debug quest-fish regression test
        shell: pwsh
        run: |
          $mods = Join-Path $env:RUNNER_TEMP "infinite-angler-debug-fixture-mods"
          Remove-Item $mods -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $mods | Out-Null
          & "tests/InfiniteAnglerDebugFixture/bin/Release/net48/InfiniteAnglerDebugFixture.exe" --mods $mods
          if ($LASTEXITCODE -ne 0) {
            throw "Infinite Angler debug quest-fish regression failed with exit code $LASTEXITCODE"
          }

      - name: Radio deterministic unit and migration tests
        shell: pwsh
        run: |
          & "tests/RadioCompile/bin/Release/net48/RadioCompile.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Radio regression test failed with exit code $LASTEXITCODE"
          }

      - name: Radio catalog/browser policy tests
        shell: pwsh
        run: |
          & "tests/RadioPolicyCompile/bin/Release/net48/RadioPolicyCompile.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Radio policy regression failed with exit code $LASTEXITCODE"
          }

      - name: General Radio overlay-upgrade discovery test
        shell: pwsh
        run: |
          & "tests/ModDiscoveryCompile/bin/Release/net48/ModDiscoveryCompile.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Mod discovery migration regression failed with exit code $LASTEXITCODE"
          }

      - name: Publish
        shell: pwsh
        run: ./build.ps1

      - name: Verify x64 gloader host
        shell: pwsh
        run: |
          $output = (& "dist/gloader/gloader.exe" --help 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "Published gloader host failed to execute. Output:`n$output"
          }
          if ($output -notmatch '64-bit raw C# source mod loader') {
            throw "Published gloader did not report the expected x64/CoreCLR build. Output:`n$output"
          }

      - name: Verify release payload
        shell: pwsh
        run: |
          $rootFiles = @(Get-ChildItem "dist/gloader" -File)
          if ($rootFiles.Count -ne 1 -or $rootFiles[0].Name -ne "gloader.exe") {
            throw "dist/gloader root must contain exactly one file: gloader.exe. Found: $($rootFiles.Name -join ', ')"
          }

          $rootDirectories = @(Get-ChildItem "dist/gloader" -Directory | Select-Object -ExpandProperty Name | Sort-Object)
          if (($rootDirectories -join ',') -ne "gdeps,gmods") {
            throw "dist/gloader root must contain exactly the gdeps and gmods folders. Found: $($rootDirectories -join ', ')"
          }

          $modRootFiles = @(Get-ChildItem "dist/gloader/gmods" -File)
          if ($modRootFiles.Count -ne 0) {
            throw "gmods must contain mod folders only. Loose files found: $($modRootFiles.Name -join ', ')"
          }

          $bundledMods = @(Get-ChildItem "dist/gloader/gmods" -Directory | Select-Object -ExpandProperty Name | Sort-Object)
          if (($bundledMods -join ',') -ne "ExpandedWorlds") {
            throw "Release package must bundle exactly one gmod: ExpandedWorlds. Found: $($bundledMods -join ', ')"
          }
          if (-not (Test-Path "dist/gloader/gmods/ExpandedWorlds/Main.cs" -PathType Leaf)) {
            throw "Expanded Worlds Main.cs is missing from the release payload."
          }

          $dependencyFiles = @(Get-ChildItem "dist/gloader/gdeps" -File)
          if ($dependencyFiles.Count -eq 0) {
            throw "gdeps must contain the published gloader runtime/support files."
          }
          if (-not (Test-Path "dist/gloader/gdeps/tools/x64-runtime/Build-X64Runtime.ps1" -PathType Leaf)) {
            throw "The required first-run x64 Terraria runtime bootstrap dependency is missing."
          }

      - name: Private x64 runtime uses the Terraria game root
        shell: pwsh
        run: |
          $loader = (Resolve-Path "dist/gloader/gloader.exe").Path
          $gameRoot = (Resolve-Path "dist/gloader").Path
          $runtimeRoot = Join-Path $gameRoot "gdeps/x64-runtime"
          $target = Join-Path $runtimeRoot "TerrariaRelease.dll"

          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
          Copy-Item "tests/HostPlayFixture/bin/Release/net10.0-windows/Terraria.dll" $target -Force

          try {
            & $loader --target $target --no-mods -- --cwd-probe $gameRoot
            if ($LASTEXITCODE -ne 0) {
              throw "Private runtime/game-root split fixture failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Remove-Item $runtimeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Steam Host & Play + Infinite Angler raw packet-82 integration test
        shell: pwsh
        run: |
          $loader = (Resolve-Path "dist/gloader/gloader.exe").Path
          $target = (Resolve-Path "tests/HostPlayFixture/bin/Release/net10.0-windows/Terraria.dll").Path
          $mods = Join-Path $env:RUNNER_TEMP "gloader-hostplay-mods"
          $anglerMod = Join-Path $mods "InfiniteAngler"

          Remove-Item $mods -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $mods | Out-Null
          Copy-Item "gmods/InfiniteAngler" $anglerMod -Recurse

          $anglerConfig = Get-Content (Join-Path $anglerMod "InfiniteAngler.ini") -Raw
          if ($anglerConfig -notmatch '(?im)^EnableParticipationCommands\s*=\s*true\s*$') {
            throw "Infinite Angler must ship with participation commands enabled by default."
          }
          if ($anglerConfig -notmatch '(?im)^EnableDebugQuestFish\s*=\s*false\s*$') {
            throw "Infinite Angler debug quest-fish helper must ship disabled by default."
          }

          & $loader --target $target --mods $mods
          if ($LASTEXITCODE -ne 0) {
            throw "Steam Host & Play / Infinite Angler raw packet-82 fixture failed with exit code $LASTEXITCODE"
          }

      - name: Remove integration-test logs
        shell: pwsh
        run: |
          Remove-Item "dist/gloader/gdeps/logs" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/GLoader/GLoader.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read Version from src/GLoader/GLoader.csproj"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          Compress-Archive -Path "dist/gloader/*" -DestinationPath "gloader-$version.zip" -Force

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "v$env:RELEASE_VERSION"

          $releaseListJson = gh release list --repo $repo --limit 100 --json tagName,publishedAt,isDraft
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect existing releases to determine the changelog base.'
          }
          $previousTag = (($releaseListJson | ConvertFrom-Json) |
            Where-Object { -not $_.isDraft -and $_.tagName -like 'v*' -and $_.tagName -ne $tag } |
            Sort-Object { [datetime]$_.publishedAt } -Descending |
            Select-Object -First 1).tagName

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $repo --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw "Could not replace existing release '$tag'."
            }
          }
          $global:LASTEXITCODE = 0

          $notes = @"
          ## Download

          - **gloader-$env:RELEASE_VERSION.zip** — Windows x64 gloader, its required runtime dependencies/bootstrap files, and **Expanded Worlds** as the only bundled gmod. Extract the ZIP directly into the Terraria install folder.

          No optional gmods, Expanded World Maker, decompiler bundle, or other standalone tools are included in this release.
          "@

          $releaseArgs = @(
            'release', 'create', $tag,
            "gloader-$env:RELEASE_VERSION.zip",
            '--repo', $repo,
            '--target', "${{ github.sha }}",
            '--title', "gloader v$env:RELEASE_VERSION",
            '--notes', $notes,
            '--generate-notes',
            '--latest'
          )
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            $releaseArgs += @('--notes-start-tag', $previousTag)
            Write-Host "Generating release notes from $previousTag to $tag."
          }

          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish gloader release '$tag'."
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gloader
          path: dist/gloader/
