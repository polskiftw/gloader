name: gloader

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "gmods/**"
      - "tools/expanded-world-maker/**"
      - "tests/**"
      - "build.ps1"
      - "gloader.sln"
      - ".github/workflows/gloader.yml"
      - ".github/workflows/radio-live-smoke.yml"
  pull_request:
    paths:
      - "src/**"
      - "gmods/**"
      - "tools/expanded-world-maker/**"
      - "tests/**"
      - "build.ps1"
      - "gloader.sln"
      - ".github/workflows/gloader.yml"
      - ".github/workflows/radio-live-smoke.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore gloader.sln
          dotnet restore src/GLoader.Compiler/GLoader.Compiler.csproj
          dotnet restore tools/expanded-world-maker/ExpandedWorldMaker.csproj
          dotnet restore tests/InfiniteAnglerCompile/InfiniteAnglerCompile.csproj
          dotnet restore tests/InfiniteAnglerDebugFixture/InfiniteAnglerDebugFixture.csproj
          dotnet restore tests/NoLiquidDupeCompile/NoLiquidDupeCompile.csproj
          dotnet restore tests/RadioCompile/RadioCompile.csproj
          dotnet restore tests/RadioPolicyCompile/RadioPolicyCompile.csproj
          dotnet restore tests/ModDiscoveryCompile/ModDiscoveryCompile.csproj
          dotnet restore tests/ExpandedWorldMathCompile/ExpandedWorldMathCompile.csproj
          dotnet restore tests/ExpandedWorldCompile/ExpandedWorldCompile.csproj
          dotnet restore tests/ExpandedWorldServerCompile/ExpandedWorldServerCompile.csproj
          dotnet restore tests/HostPlayFixture/Client.csproj
          dotnet restore tests/HostPlayFixture/Server.csproj

      - name: Build
        shell: pwsh
        run: |
          dotnet build gloader.sln -c Release --no-restore
          dotnet build src/GLoader.Compiler/GLoader.Compiler.csproj -c Release --no-restore
          dotnet build tools/expanded-world-maker/ExpandedWorldMaker.csproj -c Release --no-restore
          dotnet build tests/InfiniteAnglerCompile/InfiniteAnglerCompile.csproj -c Release --no-restore
          dotnet build tests/InfiniteAnglerDebugFixture/InfiniteAnglerDebugFixture.csproj -c Release --no-restore
          dotnet build tests/NoLiquidDupeCompile/NoLiquidDupeCompile.csproj -c Release --no-restore
          dotnet build tests/RadioCompile/RadioCompile.csproj -c Release --no-restore
          dotnet build tests/RadioPolicyCompile/RadioPolicyCompile.csproj -c Release --no-restore
          dotnet build tests/ModDiscoveryCompile/ModDiscoveryCompile.csproj -c Release --no-restore
          dotnet build tests/ExpandedWorldMathCompile/ExpandedWorldMathCompile.csproj -c Release --no-restore
          dotnet build tests/ExpandedWorldCompile/ExpandedWorldCompile.csproj -c Release --no-restore
          dotnet build tests/ExpandedWorldServerCompile/ExpandedWorldServerCompile.csproj -c Release --no-restore
          dotnet build tests/HostPlayFixture/Client.csproj -c Release --no-restore
          dotnet build tests/HostPlayFixture/Server.csproj -c Release --no-restore

      - name: Expanded Worlds mathematical parity test
        shell: pwsh
        run: |
          & "tests/ExpandedWorldMathCompile/bin/Release/net48/ExpandedWorldMathCompile.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Expanded Worlds mathematical parity regression failed with exit code $LASTEXITCODE"
          }

      - name: Expanded Worlds raw client source compile smoke test
        shell: pwsh
        run: |
          & "tests/ExpandedWorldCompile/bin/Release/net48/ExpandedWorldCompile.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Expanded Worlds raw client source compile fixture failed with exit code $LASTEXITCODE"
          }

      - name: Expanded Worlds raw server source compile smoke test
        shell: pwsh
        run: |
          & "tests/ExpandedWorldServerCompile/bin/Release/net48/ExpandedWorldServerCompile.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Expanded Worlds raw server source compile fixture failed with exit code $LASTEXITCODE"
          }

      - name: Infinite Angler debug quest-fish regression test
        shell: pwsh
        run: |
          $mods = Join-Path $env:RUNNER_TEMP "infinite-angler-debug-fixture-mods"
          Remove-Item $mods -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $mods | Out-Null
          & "tests/InfiniteAnglerDebugFixture/bin/Release/net48/InfiniteAnglerDebugFixture.exe" --mods $mods
          if ($LASTEXITCODE -ne 0) {
            throw "Infinite Angler debug quest-fish regression failed with exit code $LASTEXITCODE"
          }

      - name: Radio deterministic unit and migration tests
        shell: pwsh
        run: |
          & "tests/RadioCompile/bin/Release/net48/RadioCompile.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Radio regression test failed with exit code $LASTEXITCODE"
          }

      - name: Radio catalog/browser policy tests
        shell: pwsh
        run: |
          & "tests/RadioPolicyCompile/bin/Release/net48/RadioPolicyCompile.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Radio policy regression failed with exit code $LASTEXITCODE"
          }

      - name: General Radio overlay-upgrade discovery test
        shell: pwsh
        run: |
          & "tests/ModDiscoveryCompile/bin/Release/net48/ModDiscoveryCompile.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Mod discovery migration regression failed with exit code $LASTEXITCODE"
          }

      - name: Publish
        shell: pwsh
        run: ./build.ps1

      - name: Verify clean Terraria root layout
        shell: pwsh
        run: |
          $rootFiles = @(Get-ChildItem "dist/gloader" -File)
          if ($rootFiles.Count -ne 1 -or $rootFiles[0].Name -ne "gloader.exe") {
            throw "dist/gloader root must contain exactly one file: gloader.exe. Found: $($rootFiles.Name -join ', ')"
          }

          $rootDirectories = @(Get-ChildItem "dist/gloader" -Directory | Select-Object -ExpandProperty Name | Sort-Object)
          if (($rootDirectories -join ',') -ne "gdeps,gmods,tools") {
            throw "dist/gloader root must contain exactly gdeps, gmods, and tools. Found: $($rootDirectories -join ', ')"
          }

          $modRootFiles = @(Get-ChildItem "dist/gloader/gmods" -File)
          if ($modRootFiles.Count -ne 0) {
            throw "gmods must contain mod folders only. Loose files found: $($modRootFiles.Name -join ', ')"
          }

          $dependencyFiles = @(Get-ChildItem "dist/gloader/gdeps" -File)
          if ($dependencyFiles.Count -eq 0) {
            throw "gdeps must contain the published gloader runtime/support files."
          }

          if (-not (Test-Path "dist/gloader/gdeps/compiler/gloader.compiler.exe")) {
            throw "Published package must contain gdeps/compiler/gloader.compiler.exe."
          }

          $roslynInMainDeps = @(Get-ChildItem "dist/gloader/gdeps" -File -Filter "Microsoft.CodeAnalysis*.dll")
          if ($roslynInMainDeps.Count -ne 0) {
            throw "Roslyn must not be loaded by gloader.exe from main gdeps. Found: $($roslynInMainDeps.Name -join ', ')"
          }

          if (-not (Test-Path "dist/gloader/gmods/Radio/Main.cs")) {
            throw "Published package must contain the General Radio mod."
          }

          if (-not (Test-Path "dist/gloader/gmods/ExpandedWorlds/Main.cs")) {
            throw "Published package must contain the Expanded Worlds mod."
          }

          if (-not (Test-Path "dist/gloader/tools/ExpandedWorldMaker.exe")) {
            throw "Published package must contain tools/ExpandedWorldMaker.exe."
          }

          if (Test-Path "dist/gloader/gmods/VGMRadio") {
            throw "VGMRadio is retired and must not be shipped as a separate mod."
          }

      - name: Steam Host & Play + source compiler integration test
        shell: pwsh
        run: |
          $loader = (Resolve-Path "dist/gloader/gloader.exe").Path
          $target = (Resolve-Path "tests/HostPlayFixture/bin/Release/net48/Terraria.exe").Path
          $mods = Join-Path $env:RUNNER_TEMP "gloader-hostplay-mods"
          $anglerMod = Join-Path $mods "InfiniteAngler"
          $radioProbeMod = Join-Path $mods "RadioCompilerProbe"

          Remove-Item $mods -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $mods | Out-Null
          Copy-Item "gmods/InfiniteAngler" $anglerMod -Recurse
          New-Item -ItemType Directory -Path $radioProbeMod | Out-Null

          @'
          using NAudio.Wave;

          internal static class RadioCompilerProbe
          {
              private static void CompileOnly(string streamUrl)
              {
                  using (var reader = new MediaFoundationReader(streamUrl))
                  using (var resampler = new MediaFoundationResampler(reader, new WaveFormat(44100, 16, 2)))
                  {
                      resampler.ResamplerQuality = 60;
                  }
              }
          }
          '@ | Set-Content -Path (Join-Path $radioProbeMod "Main.cs") -Encoding UTF8

          $anglerConfig = Get-Content (Join-Path $anglerMod "InfiniteAngler.ini") -Raw
          if ($anglerConfig -notmatch '(?im)^EnableParticipationCommands\s*=\s*true\s*$') {
            throw "Infinite Angler must ship with participation commands enabled by default."
          }
          if ($anglerConfig -notmatch '(?im)^EnableDebugQuestFish\s*=\s*false\s*$') {
            throw "Infinite Angler debug quest-fish helper must ship disabled by default."
          }

          # gloader is a WinExe so PowerShell's call operator does not reliably wait
          # for it or populate LASTEXITCODE. Start-Process gives us the real result.
          $argumentList = @(
            "--target", ('"' + $target + '"'),
            "--mods", ('"' + $mods + '"')
          )
          $process = Start-Process -FilePath $loader -ArgumentList $argumentList -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Steam Host & Play / out-of-process compiler fixture failed with exit code $($process.ExitCode)"
          }

      - name: Remove integration-test logs
        shell: pwsh
        run: |
          Remove-Item "dist/gloader/gdeps/logs" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Package release
        if: github.event_name == 'push' && ((github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')) || (github.ref == 'refs/heads/feat/expanded-world-sizes' && startsWith(github.event.head_commit.message, 'Refresh release ')))
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/GLoader/GLoader.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read Version from src/GLoader/GLoader.csproj"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          Compress-Archive -Path "dist/gloader/*" -DestinationPath "gloader-$version.zip" -Force

      - name: Publish or refresh GitHub release
        if: github.event_name == 'push' && ((github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')) || (github.ref == 'refs/heads/feat/expanded-world-sizes' && startsWith(github.event.head_commit.message, 'Refresh release ')))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $asset = "gloader-$env:RELEASE_VERSION.zip"

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
            gh release edit $tag `
              --repo "${{ github.repository }}" `
              --notes "## Downloads`n`n- **gloader-$env:RELEASE_VERSION.zip** — full gloader package. Extract it into the Terraria install folder. It includes the current `gmods`, the native **tools\\ExpandedWorldMaker.exe**, Expanded Worlds XL/Huge/THICC support, and a Large Address Aware gloader.exe for the 32-bit Terraria host.`n- **ExpandedWorldMaker-$env:RELEASE_VERSION.zip** — optional small World Maker overlay when available.`n- **TerrariaDecompilerOffline-win-x64.zip** — optional standalone GUI reference decompiler when available.`n`nAV cleanup: `gloader.exe` is now a standard x86 WinExe with a normal asInvoker manifest; it no longer changes the process DLL search path or contains an embedded-assembly extraction fallback. Raw C# compilation remains isolated in `gdeps\\compiler\\gloader.compiler.exe`."
          }
          else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "gloader v$env:RELEASE_VERSION" `
              --notes "Includes a standard x86 WinExe launcher, file-only dependency probing, an out-of-process source compiler helper, native Expanded World Maker, and Expanded Worlds XL/Huge/THICC support."
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gloader
          path: dist/gloader/
