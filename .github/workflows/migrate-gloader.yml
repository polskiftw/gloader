name: Migrate GLoader

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-gloader.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy project from CheatEngine repo
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/polskiftw/cheatengine.git "$tmp/ce"
          cp -a "$tmp/ce/gloader/." .
          rm -rf "$tmp"

      - name: Apply dedicated-repo layout
        shell: bash
        run: python .github/migrate.py

      - name: Build and verify packaged layout
        shell: bash
        run: |
          set -euo pipefail
          pwsh -File ./build.ps1
          test -f dist/gloader/gloader.exe
          test -d dist/gloader/gmods
          extras="$(find dist/gloader -mindepth 1 -maxdepth 1 -type f ! -name gloader.exe -print)"
          if [ -n "$extras" ]; then
            echo "Unexpected root-level GLoader files:" >&2
            echo "$extras" >&2
            exit 1
          fi
          if grep -R --line-number --fixed-string '"Mods"' src gmods --include='*.cs'; then
            echo 'Found stale Mods path.' >&2
            exit 1
          fi

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/migrate.py .github/workflows/migrate-gloader.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rm -rf dist
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Move GLoader into dedicated repository"
          git push
