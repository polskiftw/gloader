name: Private Terraria probe

on:
  push:
    paths:
      - ".github/workflows/private-terraria-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current gloader
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build current Linux gloader
        run: ./build.sh

      - name: Download private full Steam Terraria sample
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: 582791397,
              headers: { accept: 'application/octet-stream' }
            });
            const bytes = Buffer.isBuffer(response.data)
              ? response.data
              : Buffer.from(response.data);
            fs.writeFileSync('Terraria.Linux.tar.gz', bytes);

      - name: Inspect exact Steam runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum Terraria.Linux.tar.gz | cut -d' ' -f1)" = "e040584fc536c2c415dd8b8d6ab3cbcb60882f13da46fde0638e06b6de646860"

          mkdir input
          tar -xzf Terraria.Linux.tar.gz -C input

          client_bin="$(find input -maxdepth 4 -type f -name Terraria.bin.x86_64 -print -quit)"
          test -n "$client_bin"
          steam_root="$(dirname "$client_bin")"
          echo "$steam_root" > steam-root.txt

          echo "=== STEAM ROOT ==="
          echo "$steam_root"
          echo
          echo "=== TOP-LEVEL RUNTIME FILES ==="
          find "$steam_root" -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort
          echo
          echo "=== LIB64 FILES ==="
          if [ -d "$steam_root/lib64" ]; then
            find "$steam_root/lib64" -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort
          fi
          echo
          echo "=== CLIENT LAUNCH SCRIPT ==="
          sed -n '1,120p' "$steam_root/Terraria"
          echo
          echo "=== SERVER LAUNCH SCRIPT ==="
          sed -n '1,120p' "$steam_root/TerrariaServer"

          for required in \
            Terraria Terraria.bin.x86_64 Terraria.exe \
            TerrariaServer TerrariaServer.bin.x86_64 TerrariaServer.exe \
            monoconfig monomachineconfig mscorlib.dll System.Core.dll FNA.dll ReLogic.dll; do
            test -f "$steam_root/$required"
          done
          test -d "$steam_root/lib64"

          echo
          echo "=== HOST HASHES ==="
          sha256sum "$steam_root/Terraria.bin.x86_64" "$steam_root/TerrariaServer.bin.x86_64"
          cmp -s "$steam_root/Terraria.bin.x86_64" "$steam_root/TerrariaServer.bin.x86_64"

          echo
          echo "=== HOST ELF ABI ==="
          file "$steam_root/Terraria.bin.x86_64"
          readelf -h "$steam_root/Terraria.bin.x86_64" | grep -E 'Class:|Type:|Machine:|Entry point'
          readelf -d "$steam_root/Terraria.bin.x86_64" | grep -E 'NEEDED|RPATH|RUNPATH'

          echo
          echo "=== REQUIRED EMBEDDED MONO EXPORTS ==="
          for symbol in \
            mono_profiler_create \
            mono_profiler_set_assembly_loaded_callback \
            mono_get_root_domain \
            mono_domain_assembly_open \
            mono_assembly_get_name \
            mono_assembly_name_get_name \
            mono_assembly_get_image \
            mono_class_from_name \
            mono_class_get_method_from_name \
            mono_runtime_invoke \
            mono_object_unbox \
            mono_object_to_string \
            mono_string_to_utf8 \
            mono_free \
            mono_set_assemblies_path; do
            nm -D "$steam_root/Terraria.bin.x86_64" | grep -q " $symbol$"
            echo "$symbol"
          done

      - name: Inspect managed assembly identities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-utils

          steam_root="$(cat steam-root.txt)"
          echo "=== Terraria.exe ==="
          monodis --assembly "$steam_root/Terraria.exe" | head -80
          echo "=== TerrariaServer.exe ==="
          monodis --assembly "$steam_root/TerrariaServer.exe" | head -80
          echo "=== Terraria refs ==="
          monodis --assemblyref "$steam_root/Terraria.exe" | head -220

      - name: Exact Steam dedicated-server gloader proof
        shell: bash
        run: |
          set -euo pipefail
          steam_root="$(cat steam-root.txt)"
          fixture="$RUNNER_TEMP/exact-steam-server"
          rm -rf "$fixture"
          mkdir -p "$fixture"
          cp -a "$steam_root/." "$fixture/"
          cp dist/gloader "$fixture/gloader"
          rm -rf "$fixture/gdeps" "$fixture/gmods"
          mkdir -p "$fixture/gdeps" "$fixture/gmods/Probe"
          cp -a dist/gdeps/. "$fixture/gdeps/"

          cat > "$fixture/gmods/Probe/Main.cs" <<'CS'
          using System;
          using System.IO;

          public static class Mod
          {
              public static void Load()
              {
                  var directory = AppDomain.CurrentDomain.GetData("GLoader.ModDirectory") as string;
                  if (string.IsNullOrEmpty(directory))
                      throw new InvalidOperationException("GLoader.ModDirectory was not set.");

                  File.WriteAllText(Path.Combine(directory, "loaded.txt"), "exact-steam-runtime-ok");
              }
          }
          CS

          set +e
          (
            cd "$fixture"
            timeout 20s ./gloader --server -- -help
          ) > "$fixture/server.out" 2>&1
          status=$?
          set -e

          echo "Server process status: $status"
          cat "$fixture/server.out"

          test -f "$fixture/gdeps/logs/gloader-server.log"
          cat "$fixture/gdeps/logs/gloader-server.log"
          grep -q 'Attached target: TerrariaServer' "$fixture/gdeps/logs/gloader-server.log"
          grep -q 'Loaded mod: Probe' "$fixture/gdeps/logs/gloader-server.log"
          grep -q 'gloader initialization complete; returning control to Terraria' "$fixture/gdeps/logs/gloader-server.log"
          grep -Fxq 'exact-steam-runtime-ok' "$fixture/gmods/Probe/loaded.txt"

      - name: Exact Steam client attach proof
        shell: bash
        run: |
          set -euo pipefail
          steam_root="$(cat steam-root.txt)"
          fixture="$RUNNER_TEMP/exact-steam-client"
          rm -rf "$fixture"
          mkdir -p "$fixture"
          cp -a "$steam_root/." "$fixture/"
          cp dist/gloader "$fixture/gloader"
          rm -rf "$fixture/gdeps" "$fixture/gmods"
          mkdir -p "$fixture/gdeps" "$fixture/gmods"
          cp -a dist/gdeps/. "$fixture/gdeps/"

          set +e
          (
            cd "$fixture"
            GLOADER_ROOT="$fixture" \
            GLOADER_MODE=client \
            GLOADER_DISABLE_MODS=1 \
            MONO_IOMAP=all \
            MONO_BUNDLED_OPTIONS=--profile=gloader \
            LD_LIBRARY_PATH="$fixture/gdeps${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            timeout 20s ./Terraria.bin.x86_64
          ) > "$fixture/client.out" 2>&1
          status=$?
          set -e

          echo "Client process status: $status"
          tail -200 "$fixture/client.out" || true

          test -f "$fixture/gdeps/logs/gloader-client.log"
          cat "$fixture/gdeps/logs/gloader-client.log"
          grep -q 'Attached target: Terraria' "$fixture/gdeps/logs/gloader-client.log"
          grep -q 'Source mods skipped for this run.' "$fixture/gdeps/logs/gloader-client.log"
          grep -q 'gloader initialization complete; returning control to Terraria' "$fixture/gdeps/logs/gloader-client.log"
