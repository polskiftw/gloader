name: Private Terraria probe

on:
  push:
    paths:
      - ".github/workflows/private-terraria-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current gloader
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build current Linux gloader
        run: ./build.sh

      - name: Download private Steam Terraria sample
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: 582741513,
              headers: { accept: 'application/octet-stream' }
            });
            const bytes = Buffer.isBuffer(response.data)
              ? response.data
              : Buffer.from(response.data);
            fs.writeFileSync('Terraria.tar.gz', bytes);

      - name: Verify exact Steam host ABI
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum Terraria.tar.gz | cut -d' ' -f1)" = "c973651f7eea527749be6ba92e4aced3ee61b514dad1a35c7f85163a04a28ec0"
          mkdir input
          tar -xzf Terraria.tar.gz -C input

          test "$(sha256sum input/Terraria.bin.x86_64 | cut -d' ' -f1)" = "07ac140a3c0a2513d20bc3008c93f5cf464ea9f1ab68d0e2084c58a67a10f159"
          test "$(sha256sum input/TerrariaServer.bin.x86_64 | cut -d' ' -f1)" = "07ac140a3c0a2513d20bc3008c93f5cf464ea9f1ab68d0e2084c58a67a10f159"

          nm -D input/Terraria.bin.x86_64 | grep -q ' mono_profiler_create$'
          nm -D input/Terraria.bin.x86_64 | grep -q ' mono_profiler_set_assembly_loaded_callback$'
          nm -D input/Terraria.bin.x86_64 | grep -q ' mono_domain_assembly_open$'
          nm -D input/Terraria.bin.x86_64 | grep -q ' mono_set_assemblies_path$'
          nm -D input/Terraria.bin.x86_64 | grep -q ' mono_runtime_invoke$'

      - name: Download public Terraria Linux server runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$(curl -fsSL https://terraria.org/api/get/dedicated-servers-names | jq -r '.[0]')"
          test -n "$archive"
          test "$archive" != "null"
          echo "Public dedicated-server archive: $archive"
          curl -fL "https://terraria.org/api/download/pc-dedicated-server/$archive" -o server.zip
          mkdir public-server
          unzip -q server.zip -d public-server

          server_bin="$(find public-server -type f -name TerrariaServer.bin.x86_64 -print -quit)"
          test -n "$server_bin"
          linux_dir="$(dirname "$server_bin")"
          echo "$linux_dir" > linux-runtime-dir.txt

          echo "Public Linux host SHA256:"
          sha256sum "$server_bin"
          test -f "$linux_dir/monoconfig"
          test -f "$linux_dir/monomachineconfig"
          test -f "$linux_dir/mscorlib.dll"
          test -f "$linux_dir/System.Core.dll"

      - name: Install fixture C# compiler
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-mcs

      - name: Full proof with official matching Terraria MonoKickstart runtime
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/public-terraria-profiler-proof"
          linux_dir="$(cat linux-runtime-dir.txt)"
          rm -rf "$fixture"
          mkdir -p "$fixture"
          cp -a "$linux_dir/." "$fixture/"
          chmod 0755 "$fixture/TerrariaServer.bin.x86_64"
          mkdir -p "$fixture/gdeps" "$fixture/gmods"
          cp -a dist/gdeps/. "$fixture/gdeps/"

          cat > "$fixture/TerrariaServer.cs" <<'CS'
          using System;
          public static class Program
          {
              public static void Main(string[] args)
              {
                  Console.WriteLine("OFFICIAL_MONOKICKSTART_FIXTURE_MAIN");
              }
          }
          CS
          mcs -nologo -target:exe -out:"$fixture/TerrariaServer.exe" "$fixture/TerrariaServer.cs"

          (
            cd "$fixture"
            GLOADER_ROOT="$fixture" \
            GLOADER_MODE=server \
            GLOADER_DISABLE_MODS=1 \
            MONO_IOMAP=all \
            MONO_BUNDLED_OPTIONS=--profile=gloader \
            LD_LIBRARY_PATH="$fixture/gdeps:$fixture/lib64" \
            ./TerrariaServer.bin.x86_64 | tee fixture.out
          )

          grep -q 'OFFICIAL_MONOKICKSTART_FIXTURE_MAIN' "$fixture/fixture.out"
          grep -q 'Attached target: TerrariaServer' "$fixture/gdeps/logs/gloader-server.log"
          grep -q 'returning control to Terraria' "$fixture/gdeps/logs/gloader-server.log"

      - name: Exact Steam host reaches gloader boundary
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/exact-steam-host-boundary"
          linux_dir="$(cat linux-runtime-dir.txt)"
          rm -rf "$fixture"
          mkdir -p "$fixture"
          cp -a "$linux_dir/." "$fixture/"
          mkdir -p "$fixture/gdeps" "$fixture/gmods"
          cp input/Terraria.bin.x86_64 "$fixture/Terraria.bin.x86_64"
          chmod 0755 "$fixture/Terraria.bin.x86_64"
          cp -a dist/gdeps/. "$fixture/gdeps/"

          cat > "$fixture/Terraria.cs" <<'CS'
          public static class Program
          {
              public static void Main(string[] args) { }
          }
          CS
          mcs -nologo -target:exe -out:"$fixture/Terraria.exe" "$fixture/Terraria.cs"

          set +e
          (
            cd "$fixture"
            GLOADER_ROOT="$fixture" \
            GLOADER_MODE=client \
            GLOADER_DISABLE_MODS=1 \
            MONO_IOMAP=all \
            MONO_BUNDLED_OPTIONS=--profile=gloader \
            LD_LIBRARY_PATH="$fixture/gdeps:$fixture/lib64" \
            ./Terraria.bin.x86_64
          ) > "$fixture/boundary.out" 2>&1
          status=$?
          set -e

          test "$status" -ne 0
          grep -q 'Your mono runtime and class libraries are out of sync' "$fixture/boundary.out"
          grep -q 'gloader managed exception:' "$fixture/boundary.out"
          grep -q 'GLoader.Entry' "$fixture/boundary.out"
          echo "Exact Steam host loaded the gloader profiler and entered GLoader.Entry; full execution is intentionally blocked here by the nonmatching public 1.4.5.8 class libraries."
