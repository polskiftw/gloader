name: World Family Renderer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/world-family-renderer/**"
      - ".github/workflows/world-family-renderer.yml"
  push:
    branches:
      - main
    paths:
      - "tools/world-family-renderer/**"
      - ".github/workflows/world-family-renderer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout gloader
        uses: actions/checkout@v4

      - name: Checkout pinned TEdit
        uses: actions/checkout@v4
        with:
          repository: TEdit/Terraria-Map-Editor
          ref: cca62adbe37f8cbbd447061650f91a357836f5d0
          path: _deps/TEdit

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore and publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = "tools/world-family-renderer/WorldFamilyRenderer.csproj"
          $tedit = Join-Path $env:GITHUB_WORKSPACE "_deps/TEdit"

          dotnet restore $project -p:TEditRoot="$tedit"
          dotnet publish $project `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:TEditRoot="$tedit"

          $exe = "tools/world-family-renderer/bin/Release/net10.0-windows/win-x64/publish/WorldFamilyRenderer.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "WorldFamilyRenderer.exe was not produced."
          }
          if ((Get-Item $exe).Length -lt 10MB) {
            throw "Self-contained WorldFamilyRenderer.exe is unexpectedly small."
          }

      - name: Palette/parser self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "tools/world-family-renderer/bin/Release/net10.0-windows/win-x64/publish/WorldFamilyRenderer.exe"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "World Family Renderer self-test failed with exit code $LASTEXITCODE"
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content "tools/world-family-renderer/WorldFamilyRenderer.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read World Family Renderer version."
          }

          $stage = Join-Path $env:RUNNER_TEMP "world-family-renderer"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item "tools/world-family-renderer/bin/Release/net10.0-windows/win-x64/publish/WorldFamilyRenderer.exe" $stage
          Copy-Item "tools/world-family-renderer/README.md" $stage
          Copy-Item "tools/world-family-renderer/DGD.md" $stage
          Copy-Item "tools/world-family-renderer/THIRD-PARTY-NOTICES.txt" $stage
          Copy-Item "tools/world-family-renderer/LICENSE.TEdit.MS-PL.txt" $stage

          $zip = "WorldFamilyRenderer-win-x64-$version.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          "WFR_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WorldFamilyRenderer-win-x64
          path: ${{ env.WFR_ZIP }}
          if-no-files-found: error
